   }\n            }\n\n            generateFood() {\n                let food;\n                do {\n                    food = {\n                        x: Math.floor(Math.random() * this.tileCount),\n                        y: Math.floor(Math.random() * this.tileCount)\n                    };\n                } while (this.snake.some(segment => segment.x === food.x && segment.y === food.y));\n\n                return food;\n            }\n\n            update() {\n                if (this.gameOver) return;\n\n                this.direction = this.nextDirection;\n\n                // 移动蛇头\n                const head = {\n                    x: this.snake[0].x + this.direction.x,\n                    y: this.snake[0].y + this.direction.y\n                };\n\n                // 检查撞墙\n                if (head.x < 0 || head.x >= this.tileCount ||\n                    head.y < 0 || head.y >= this.tileCount) {\n                    this.endGame();\n                    return;\n                }\n\n                // 检查撞自己\n                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {\n                    this.endGame();\n                    return;\n                }\n\n                this.snake.unshift(head);\n\n                // 检查吃到食物\n                if (head.x === this.food.x && head.y === this.food.y) {\n                    this.score++;\n                    document.getElementById('score').textContent = this.score;\n                    this.food = this.generateFood();\n\n                    // 加速\n                    if (this.score % 5 === 0 && this.speed > 50) {\n                        this.speed -= 5;\n                    }\n                } else {\n                    this.snake.pop();\n                }\n            }\n\n            draw() {\n                // 清空画布\n                this.ctx.fillStyle = '#34495e';\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n\n                // 绘制网格\n                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';\n                for (let i = 0; i <= this.tileCount; i++) {\n                    this.ctx.beginPath();\n                    this.ctx.moveTo(i * this.gridSize, 0);\n                    this.ctx.lineTo(i * this.gridSize, this.canvas.height);\n                    this.ctx.stroke();\n\n                    this.ctx.beginPath();\n                    this.ctx.moveTo(0, i * this.gridSize);\n                    this.ctx.lineTo(this.canvas.width, i * this.gridSize);\n                    this.ctx.stroke();\n                }\n\n                // 绘制食物\n                this.ctx.fillStyle = '#e74c3c';\n                this.ctx.beginPath();\n                this.ctx.arc(\n                    this.food.x * this.gridSize + this.gridSize / 2,\n                    this.food.y * this.gridSize + this.gridSize / 2,\n                    this.gridSize / 2 - 2,\n                    0,\n                    Math.PI * 2\n                );\n                this.ctx.fill();\n\n                // 绘制蛇\n                this.snake.forEach((segment, index) => {\n                    this.ctx.fillStyle = index === 0 ? '#2ecc71' : '#27ae60';\n                    this.ctx.fillRect(\n                        segment.x * this.gridSize + 1,\n                        segment.y * this.gridSize + 1,\n                        this.gridSize - 2,\n                        this.gridSize - 2\n                    );\n\n                    // 蛇头眼睛\n                    if (index === 0) {\n                        this.ctx.fillStyle = 'white';\n                        const eyeSize = 3;\n                        if (this.direction.x === 1) { // 向右\n                            this.ctx.fillRect(segment.x * this.gridSize + 12, segment.y * this.gridSize + 5, eyeSize, eyeSize);\n                            this.ctx.fillRect(segment.x * this.gridSize + 12, segment.y * this.gridSize + 12, eyeSize, eyeSize);\n                        } else if (this.direction.x === -1) { // 向左\n                            this.ctx.fillRect(segment.x * this.gridSize + 5, segment.y * this.gridSize + 5, eyeSize, eyeSize);\n                            this.ctx.fillRect(segment.x * this.gridSize + 5, segment.y * this.gridSize + 12, eyeSize, eyeSize);\n                        } else if (this.direction.y === -1) { // 向上\n                            this.ctx.fillRect(segment.x * this.gridSize + 5, segment.y * this.gridSize + 5, eyeSize, eyeSize);\n                            this.ctx.fillRect(segment.x * this.gridSize + 12, segment.y * this.gridSize + 5, eyeSize, eyeSize);\n                        } else { // 向下\n                            this.ctx.fillRect(segment.x * this.gridSize + 5, segment.y * this.gridSize + 12, eyeSize, eyeSize);\n                            this.ctx.fillRect(segment.x * this.gridSize + 12, segment.y * this.gridSize + 12, eyeSize, eyeSize);\n                        }\n                    }\n                });\n\n                // 未开始时显示提示（R4-7：移到forEach外，避免每段蛇重复绘制）\n                if (!this.started && !this.gameOver) {\n                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';\n                    this.ctx.font = '22px Arial';\n                    this.ctx.textAlign = 'center';\n                    this.ctx.fillText('点击开始', this.canvas.width / 2, this.canvas.height / 2);\n                }\n            }\n\n            gameLoop() {\n                if (this.paused) return; // 暂停时不继续调度\n\n                this.update();\n                this.draw();\n\n                if (!this.gameOver) {\n                    this.loopTimer = setTimeout(() => this.gameLoop(), this.speed);\n                }\n            }\n\n            endGame() {\n                this.gameOver = true;\n                this.notifyGameOver();\n            }\n\n            notifyReady() {\n                if (window.parent !== window) {\n                    window.parent.postMessage({ type: 'game-ready' }, '*');\n                }\n            }\n\n            notifyGameOver() {\n                if (window.parent !== window) {\n                    window.parent.postMessage({\n                        type: 'game-over',\n                        data: { score: this.score, success: this.score >= 5 }\n                    }, '*');\n                }\n            }\n        }\n\n        const game = new SnakeGame();\n    \n"}, "pin": {"style": "\n        body {\n            margin: 0;\n            padding: 0;\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            min-height: 100vh;\n            font-family: Arial, sans-serif;\n        }\n        #gameCanvas {\n            background: #2c3e50;\n            border-radius: 50%;\n            box-shadow: 0 10px 30px rgba(0,0,0,0.3);\n        \n    max-width: 100%;\n    height: auto;}\n        .score {\n            color: white;\n            font-size: 32px;\n            font-weight: bold;\n            margin: 20px;\n            text-shadow: 0 2px 4px rgba(0,0,0,0.3);\n        }\n        .game-over {\n            display: none;\n            position: fixed;\n            top: 50%;\n            left: 50%;\n            transform: translate(-50%, -50%);\n            background: rgba(0,0,0,0.9);\n            color: white;\n            padding: 40px;\n            border-radius: 20px;\n            text-align: center;\n            font-size: 24px;\n        }\n    \n", "body": "\n    <div class=\"score\">得分: <span id=\"score\">0</span></div>\n    <canvas id=\"gameCanvas\" width=\"400\" height=\"400\"></canvas>\n    <div class=\"game-over\" id=\"gameOver\">\n        <h2>游戏结束</h2>\n        <p>得分: <span id=\"finalScore\">0</span></p>\n    </div>\n\n    \n", "script": "\n        class PinGame {\n            constructor() {\n                this.canvas = document.getElementById('gameCanvas');\n                this.ctx = this.canvas.getContext('2d');\n                this.centerX = 200;\n                this.centerY = 200;\n                this.radius = 150;\n                this.pins = [];\n                this.currentPin = null;\n                this.score = 0;\n                this.gameOver = false;\n                this.paused = false;\n                this.rotationAngle = 0;\n                this.totalPins = 10; // 目标插入数量（config可覆盖：难度越高越多）\n                this.rotationSpeed = 0.02; // 转速（config可覆盖）\n                this.rafId = null; // rAF句柄，暂停时取消\n                this.extraLives = 1; // 容错次数：6岁孩子碰针不立刻失败（R3-23）\n\n                this.init();\n            }\n\n            init() {\n                // 初始化已插入的针（只放3根，留出足够空间，否则永远到不了目标数）\n                for (let i = 0; i < 3; i++) {\n                    this.pins.push({\n                        angle: (Math.PI * 2 / 3) * i\n                    });\n                }\n\n                this.createNewPin();\n                this.bindEvents();\n                this.rafId = requestAnimationFrame(() => this.animate());\n                this.notifyReady();\n            }\n\n            createNewPin() {\n                if (this.score >= this.totalPins) {\n                    this.endGame(true);\n                    return;\n                }\n\n                this.currentPin = {\n                    x: this.centerX,\n                    y: this.centerY - this.radius - 55, // 与draw里的可见位置一致\n                    launching: false,\n                    speed: 0\n                };\n            }\n\n            bindEvents() {\n                this.canvas.addEventListener('click', () => this.launch());\n                this.canvas.addEventListener('touchstart', (e) => {\n                    e.preventDefault();\n                    this.launch();\n                });\n\n                window.addEventListener('message', (e) => {\n                    if (!e.data || typeof e.data !== 'object') return;\n                    const d = e.data;\n                    if (d.type === 'pause') this.pause();\n                    else if (d.type === 'resume') this.resume();\n                    else if (d.type === 'config') this.applyConfig(d.data || {});\n                    else if (d.type === 'item') this.handleItem(d.data && d.data.id);\n                });\n            }\n\n            // 收外壳难度档位：难度越高目标针数越多、转速越快（1A 适配层）\n            applyConfig(cfg) {\n                const diff = cfg.difficulty || 1;\n                if (diff <= 2) { this.totalPins = 6; this.rotationSpeed = 0.015; }\n                else if (diff <= 5) { this.totalPins = 10; this.rotationSpeed = 0.02; }\n                else { this.totalPins = 15; this.rotationSpeed = 0.03; }\n            }\n\n            // 局内道具：慢速光环 = 转盘减速10秒\n            handleItem(id) {\n                if (id === 'slow_aura') {\n                    this.rotationSpeed *= 0.4;\n                    setTimeout(() => { this.rotationSpeed /= 0.4; }, 10000);\n                }\n            }\n\n            // 暂停：停止动画循环\n            pause() {\n                if (this.gameOver) return;\n                this.paused = true;\n                if (this.rafId) {\n                    cancelAnimationFrame(this.rafId);\n                    this.rafId = null;\n                }\n            }\n\n            // 恢复：重启动画循环\n            resume() {\n                if (this.gameOver) return;\n                this.paused = false;\n                if (!this.rafId) {\n                    this.rafId = requestAnimationFrame(() => this.animate());\n                }\n            }\n\n            launch() {\n                if (!this.currentPin || this.currentPin.launching || this.gameOver || this.paused) return;\n\n                this.currentPin.launching = true;\n                this.currentPin.speed = 8;\n            }\n\n            update() {\n                if (this.gameOver || this.paused) return;\n\n                // 旋转圆盘\n                this.rotationAngle += this.rotationSpeed;\n\n                // 更新发射中的针\n                if (this.currentPin && this.currentPin.launching) {\n                    this.currentPin.y += this.currentPin.speed;\n\n                    // 检测是否插入圆盘\n                    const distToCenter = Math.sqrt(\n                        Math.pow(this.currentPin.x - this.centerX, 2) +\n                        Math.pow(this.currentPin.y - this.centerY, 2)\n                    );\n\n                    if (distToCenter <= this.radius - 20) {\n                        // 计算角度\n                        const angle = Math.atan2(\n                            this.currentPin.y - this.centerY,\n                            this.currentPin.x - this.centerX\n                        ) - this.rotationAngle;\n\n                        // 检测碰撞：有容错次数就退针重来，否则结束\n                        if (this.checkCollision(angle)) {\n                            if (this.extraLives > 0) {\n                                this.extraLives--;\n                                this.currentPin.launching = false;\n                                this.currentPin.y = this.centerY - this.radius - 55; // 退回可见位置\n                                return;\n                            }\n                            this.endGame(false);\n                            return;\n                        }\n\n                        // 成功插入\n                        this.pins.push({ angle: angle });\n                        this.score++;\n                        document.getElementById('score').textContent = this.score;\n                        this.currentPin = null;\n\n                        setTimeout(() => this.createNewPin(), 500);\n                    }\n                }\n            }\n\n            checkCollision(newAngle) {\n                const threshold = 0.2; // 碰撞检测阈值（放宽：6岁孩子更容易插进空隙）\n\n                for (let pin of this.pins) {\n                    let diff = Math.abs(newAngle - pin.angle);\n                    // 处理角度环绕\n                    if (diff > Math.PI) {\n                        diff = Math.PI * 2 - diff;\n                    }\n                    if (diff < threshold) {\n                        return true;\n                    }\n                }\n                return false;\n            }\n\n            draw() {\n                // 清空画布\n                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);\n\n                // 绘制中心圆盘\n                this.ctx.save();\n                this.ctx.translate(this.centerX, this.centerY);\n                this.ctx.rotate(this.rotationAngle);\n\n                // 圆盘\n                this.ctx.beginPath();\n                this.ctx.arc(0, 0, this.radius, 0, Math.PI * 2);\n                this.ctx.fillStyle = '#e74c3c';\n                this.ctx.fill();\n\n                // 圆心\n                this.ctx.beginPath();\n                this.ctx.arc(0, 0, 15, 0, Math.PI * 2);\n                this.ctx.fillStyle = '#c0392b';\n                this.ctx.fill();\n\n                // 绘制已插入的针\n                this.pins.forEach(pin => {\n                    this.ctx.save();\n                    this.ctx.rotate(pin.angle);\n\n                    this.ctx.beginPath();\n                    this.ctx.moveTo(0, -this.radius + 20);\n                    this.ctx.lineTo(0, -this.radius - 40);\n                    this.ctx.strokeStyle = '#ecf0f1';\n                    this.ctx.lineWidth = 3;\n                    this.ctx.stroke();\n\n                    // 针头\n                    this.ctx.beginPath();\n                    this.ctx.arc(0, -this.radius - 40, 5, 0, Math.PI * 2);\n                    this.ctx.fillStyle = '#3498db';\n                    this.ctx.fill();\n\n                    this.ctx.restore();\n                });\n\n                this.ctx.restore();\n\n                // 绘制待发射的针（R3-35：针头原画在canvas外不可见，下移到可见区域）\n                if (this.currentPin) {\n                    // 针尖落在圆盘正上方，针身向下延伸，孩子能看到下一根针\n                    this.ctx.beginPath();\n                    this.ctx.moveTo(this.centerX, this.centerY - this.radius - 15);\n                    this.ctx.lineTo(this.centerX, this.centerY - this.radius - 55);\n                    this.ctx.strokeStyle = '#ecf0f1';\n                    this.ctx.lineWidth = 3;\n                    this.ctx.stroke();\n\n                    this.ctx.beginPath();\n                    this.ctx.arc(this.centerX, this.centerY - this.radius - 55, 5, 0, Math.PI * 2);\n                    this.ctx.fillStyle = '#3498db';\n                    this.ctx.fill();\n                }\n            }\n\n            animate() {\n                this.update();\n                this.draw();\n                if (!this.gameOver && !this.paused) {\n                    this.rafId = requestAnimationFrame(() => this.animate());\n                }\n            }\n\n            endGame(success) {\n                this.gameOver = true;\n                document.getElementById('finalScore').textContent = this.score;\n                document.getElementById('gameOver').style.display = 'block';\n\n                setTimeout(() => {\n                    this.notifyGameOver(success);\n                }, 1000);\n            }\n\n            notifyReady() {\n                if (window.parent !== window) {\n                    window.parent.postMessage({ type: 'game-ready' }, '*');\n                }\n            }\n\n            notifyGameOver(success) {\n                if (window.parent !== window) {\n                    window.parent.postMessage({\n                        type: 'game-over',\n                        data: { score: this.score, success: success }\n                    }, '*');\n                }\n            }\n        }\n\n        const game = new PinGame();\n    \n"}, "maze": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#11998e,#38ef7d);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\ncanvas{background:#0b3d2e;border-radius:10px;}\n.hint{font-size:15px;color:#d5f5e0;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">迷宫 1 · 得分 0</div>\n<canvas id=\"cv\" width=\"360\" height=\"360\"></canvas>\n<div class=\"hint\">点相邻的路走，找到终点 🏁 就升级迷宫</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar cv,ctx,SIZE,maze,player,goal,level,score,ended;\nfunction onConfig(cfg){start();}\nfunction start(){\n  cv=document.getElementById('cv');ctx=cv.getContext('2d');\n  level=0;score=0;ended=false;gPaused=false;\n  newLevel(7);notifyReady();\n}\nfunction newLevel(size){\n  level++;SIZE=6+level+Math.floor((gCfg.difficulty-1)/2);\n  if(SIZE%2===0)SIZE++; // 生成器步长2，偶数尺寸终点四邻必为墙，强制奇数保证可解\n  SIZE=Math.min(13,SIZE);\n  maze=genMaze(SIZE);\n  player={r:0,c:0};goal={r:SIZE-1,c:SIZE-1};\n  document.getElementById('bar').textContent='迷宫 '+level+' · 得分 '+score;\n  cv.onclick=function(e){if(ended||gPaused)return;var r=cv.getBoundingClientRect();\n    var cell=360/SIZE;\n    var c=Math.floor((e.clientX-r.left)/cell),rr=Math.floor((e.clientY-r.top)/cell);\n    if(rr>=0&&rr<SIZE&&c>=0&&c<SIZE&&maze[rr][c]===0&&(Math.abs(rr-player.r)+Math.abs(c-player.c)===1)){\n      player={r:rr,c:c};\n      if(rr===goal.r&&c===goal.c){score+=100+Math.max(0,20-level*2);if(score>=700||level>=8){end(true);}else{newLevel();}}\n      draw();\n    }\n  };\n  draw();\n}\nfunction genMaze(n){\n  var m=[];for(var r=0;r<n;r++){m.push(new Array(n).fill(1));}\n  var stack=[[0,0]];m[0][0]=0;\n  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];\n  while(stack.length){\n    var cur=stack[stack.length-1];\n    var neighbors=[];\n    dirs.forEach(function(d){var nr=cur[0]+d[0]*2,nc=cur[1]+d[1]*2;\n      if(nr>=0&&nr<n&&nc>=0&&nc<n&&m[nr][nc]===1){neighbors.push([nr,nc,d[0],d[1]]);}});\n    if(neighbors.length){\n      var nx=neighbors[Math.floor(Math.random()*neighbors.length)];\n      m[cur[0]+nx[2]][cur[1]+nx[3]]=0;m[nx[0]][nx[1]]=0;stack.push([nx[0],nx[1]]);\n    }else{stack.pop();}\n  }\n  m[n-1][n-1]=0;\n  return m;\n}\nfunction draw(){\n  var cell=360/SIZE;\n  ctx.clearRect(0,0,360,360);\n  ctx.fillStyle='#0b3d2e';ctx.fillRect(0,0,360,360);\n  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){\n    if(maze[r][c]===1){ctx.fillStyle='#1b5e20';ctx.fillRect(c*cell,r*cell,cell,cell);}\n  }\n  ctx.fillStyle='#f39c12';ctx.font=(cell*0.7)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';\n  ctx.fillText('🏁',goal.c*cell+cell/2,goal.r*cell+cell/2+2);\n  ctx.font='bold '+(cell*0.7)+'px Arial';\n  ctx.fillText('🐸',player.c*cell+cell/2,player.r*cell+cell/2+2);\n}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(score,win);},400);}\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(){}\n\nnotifyReady();\n\n"}, "mathmatch": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#2b5876,#4e4376);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#board{display:grid;gap:8px;}\n.card{width:64px;height:64px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#2b5876;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25);}\n.card.eq{color:#e74c3c;}\n.card.face{background:#5d4a7a;color:transparent;}\n.card.done{background:rgba(255,255,255,.15);color:#cfd8dc;}\n.hint{font-size:15px;color:#c5d0e5;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">找到 0/0 对</div>\n<div id=\"board\"></div>\n<div class=\"hint\">翻卡片，找到算式和它的答案配对，比如 3+4 和 7</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar cols,rows,cards,flipped,found,totalPairs,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;\n  if(d<=2){rows=3;cols=4;}\n  else if(d<=4){rows=4;cols=4;}\n  else{rows=4;cols=5;}\n  start();\n}\nfunction genPair(i){\n  var max=(gCfg.difficulty||1)<=2?10:20;\n  var a=Math.floor(Math.random()*max)+1,b=Math.floor(Math.random()*max)+1;\n  var eq=a+'+'+b,ans=a+b;\n  return {id:'p'+i,text:eq,ans:ans,pairKey:'p'+i};\n}\nfunction start(){\n  totalPairs=(rows*cols)/2;\n  var items=[];\n  for(var i=0;i<totalPairs;i++){var p=genPair(i);items.push({id:p.id+'_eq',text:p.text,kind:'eq',pair:p.id,value:p.ans});items.push({id:p.id+'_ans',text:String(p.ans),kind:'ans',pair:p.id,value:p.ans});}\n  for(var j=items.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=items[j];items[j]=items[k];items[k]=t;}\n  cards=items.map(function(e){return {text:e.text,kind:e.kind,pair:e.pair,value:e.value,up:false,done:false};});\n  flipped=[];found=0;ended=false;gPaused=false;\n  document.getElementById('bar').textContent='找到 0/'+totalPairs+' 对';\n  var b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+cols+',64px)';b.innerHTML='';\n  cards.forEach(function(card,idx){var d=document.createElement('div');d.className='card face';d.dataset.i=idx;d.onclick=function(){flip(idx);};b.appendChild(d);});\n  render();notifyReady();\n}\nfunction flip(idx){\n  if(ended||gPaused)return;\n  var c=cards[idx];\n  if(c.up||c.done)return;\n  if(flipped.length>=2)return;\n  c.up=true;flipped.push(idx);render();\n  if(flipped.length===2){\n    var a=cards[flipped[0]],b=cards[flipped[1]];\n    setTimeout(function(){\n      if(a.value===b.value&&a.kind!==b.kind){a.done=true;b.done=true;found++;document.getElementById('bar').textContent='找到 '+found+'/'+totalPairs+' 对';if(found===totalPairs){end(true);}}\n      else{a.up=false;b.up=false;}\n      flipped=[];render();\n    },600);\n  }\n}\nfunction render(){\n  var b=document.getElementById('board');\n  [...b.children].forEach(function(d,i){\n    var c=cards[i];\n    d.textContent=c.up||c.done?c.text:'';\n    d.className='card'+(c.done?' done':(c.up?(c.kind==='eq'?' eq':''):' face'));\n  });\n}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(found*100,win);},400);}\nfunction onPause(){}function onResume(){}function handleItem(){}\n\nnotifyReady();\n\n"}, "watersort": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#2193b0,#6dd5ed);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#bottles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:420px;}\n.bottle{width:52px;height:120px;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.6);border-bottom:none;border-radius:4px 4px 0 0;position:relative;cursor:pointer;overflow:hidden;}\n.bottle.sel{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.6);}\n.bottle .water{position:absolute;left:0;right:0;}\n.hint{font-size:15px;color:#e0f7fa;margin-top:10px;}\n\n", "body": "\n<div id=\"bar\">倒水管</div>\n<div id=\"bottles\"></div>\n<div class=\"hint\">点一个管子选水，再点另一个管子倒进去（同色才能倒，每个管子高4格）</div>\n<div style=\"margin-top:8px;\">\n  <button onclick=\"undoMove()\" style=\"font-size:15px;padding:7px 20px;border:none;border-radius:8px;background:#3498db;color:#fff;cursor:pointer;\">🧹 撤销一步</button>\n  <button onclick=\"restartGame()\" style=\"font-size:15px;padding:7px 20px;border:none;border-radius:8px;background:#e74c3c;color:#fff;cursor:pointer;\">🔄 重开本局</button>\n</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar HEIGHT=4,bottles,sel,completed,ended,history;\nvar COLORS=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c'];\nfunction onConfig(cfg){var d=cfg.difficulty||1;\n  var n=d<=2?4:d<=5?5:6;\n  var colors=COLORS.slice(0,n);\n  bottles=[];\n  var pool=[];colors.forEach(function(c){for(var i=0;i<HEIGHT;i++)pool.push(c);});\n  for(var j=pool.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=pool[j];pool[j]=pool[k];pool[k]=t;}\n  for(var c=0;c<n;c++)bottles.push(pool.slice(c*HEIGHT,c*HEIGHT+HEIGHT));\n  for(var e=0;e<2;e++)bottles.push([]); // 两个空管\n  sel=null;completed=0;ended=false;gPaused=false;history=[];\n  render();notifyReady();\n}\nfunction pushState(){history.push(JSON.stringify(bottles));if(history.length>80)history.shift();} // R41：撤销步栈\nfunction undoMove(){if(ended||gPaused)return;if(history.length){bottles=JSON.parse(history.pop());sel=null;render();}} // R41：撤销一步（倒错可恢复）\nfunction restartGame(){if(ended||gPaused)return;onConfig(gCfg);} // R41：重开本局（倒死可恢复）\nfunction topColor(b){return b.length?b[b.length-1]:null;}\nfunction pour(from,to){\n  var a=bottles[from],b=bottles[to];\n  if(!a.length)return;\n  if(b.length>=HEIGHT)return;\n  var color=topColor(a);\n  var cnt=0;for(var i=a.length-1;i>=0;i--){if(a[i]===color)cnt++;else break;}\n  if(b.length&&topColor(b)!==color)return;\n  var n=Math.min(cnt,HEIGHT-b.length);\n  for(var j=0;j<n;j++){b.push(a.pop());}\n}\nfunction render(){\n  var box=document.getElementById('bottles');box.innerHTML='';\n  bottles.forEach(function(b,i){\n    var d=document.createElement('div');d.className='bottle';if(sel===i)d.classList.add('sel');\n    var n=b.length;\n    for(var k=0;k<n;k++){\n      var w=document.createElement('div');w.className='water';\n      w.style.height=(100/HEIGHT)+'%';w.style.bottom=(k*(100/HEIGHT))+'%';\n      w.style.background=b[k];\n      d.appendChild(w);\n    }\n    d.onclick=function(){if(ended||gPaused)return;\n      if(sel===null){sel=i;render();return;}\n      if(sel===i){sel=null;render();return;}\n      pushState(); // R41：记录倒水前状态，供撤销\n      pour(sel,i);sel=null;render();\n      if(checkWin()){end(true);}\n    };\n    box.appendChild(d);\n  });\n}\nfunction checkWin(){\n  var all=bottles.every(function(b){\n    if(!b.length)return true;\n    if(b.length<HEIGHT)return false;\n    var c=b[0];return b.every(function(x){return x===c;});\n  });\n  return all;\n}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(win?bottles.filter(function(b){return b.length===HEIGHT;}).length*100:0,win);},400);}\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(){}\n\nnotifyReady();\n\n"}, "hanoi": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#3a1c71,#d76d77);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\ncanvas{background:rgba(255,255,255,.08);border-radius:10px;}\n.hint{font-size:15px;color:#f0d9e8;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">把圆盘全部移到最右边</div>\n<canvas id=\"cv\" width=\"360\" height=\"280\"></canvas>\n<div class=\"hint\">点一根柱子的最上面的圆盘，再点另一根放下，大的不能压小的</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar pegs,sel,disks,moves,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;disks=(d<=2)?3:(d<=5?4:5);start();}\nfunction start(){\n  pegs=[];var ds=[];for(var i=disks;i>=1;i--)ds.push(i);\n  pegs=[ds,[],[]];\n  sel=null;moves=0;ended=false;gPaused=false;\n  var cv=document.getElementById('cv');\n  cv.onclick=function(e){if(ended||gPaused)return;var r=cv.getBoundingClientRect();var peg=Math.floor((e.clientX-r.left)/120);\n    if(peg<0||peg>2)return;\n    if(sel===null){if(pegs[peg].length){sel=peg;draw();}}\n    else{if(sel===peg){sel=null;draw();return;}\n      var disk=pegs[sel][pegs[sel].length-1];\n      var top=pegs[peg][pegs[peg].length-1];\n      if(pegs[peg].length===0||disk<top){pegs[peg].push(pegs[sel].pop());moves++;sel=null;draw();\n        document.getElementById('bar').textContent='步数: '+moves+'（最少 '+(Math.pow(2,disks)-1)+' 步）';\n        if(pegs[2].length===disks){end(true);}}\n      else{sel=null;draw();}\n    }\n  };\n  draw();notifyReady();\n}\nfunction draw(){\n  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');\n  ctx.clearRect(0,0,360,280);\n  ctx.fillStyle='#3a1c71';ctx.fillRect(0,0,360,280);\n  ctx.fillStyle='#8d6e63';\n  for(var p=0;p<3;p++){ctx.fillRect(20+p*120,240,80,8);ctx.fillRect(52+p*120,240-(pegs[p].length*22+80),10,pegs[p].length*22+80);}\n  for(p=0;p<3;p++){var n=pegs[p].length;\n    for(var j=0;j<n;j++){var d=pegs[p][j];ctx.fillStyle=['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6'][d-1]||'#e74c3c';\n      ctx.fillRect(20+p*120+(40-d*7),240-(j+1)*22,d*14,20);}}\n  if(sel!==null){ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.strokeRect(20+sel*120+5,20,70,230);}\n}\nfunction end(win){if(ended)return;ended=true;\n  var minMoves=Math.pow(2,disks)-1;\n  var sc=win?Math.max(10,Math.round(1000*minMoves/Math.max(moves,1))):0;\n  setTimeout(function(){notifyOver(sc,win);},400);}\nfunction onPause(){}function onResume(){}function handleItem(){}\n\nnotifyReady();\n\n"}, "breakout": {"style": "\n        body {\n            margin: 0;\n            padding: 0;\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            min-height: 100vh;\n            font-family: Arial, sans-serif;\n        }\n        #gameCanvas {\n            background: #2c3e50;\n            border-radius: 10px;\n            box-shadow: 0 10px 30px rgba(0,0,0,0.3);\n            cursor: pointer;\n        \n    max-width: 100%;\n    height: auto;}\n        .score {\n            color: white;\n            font-size: 32px;\n            font-weight: bold;\n            margin: 20px;\n            text-shadow: 0 2px 4px rgba(0,0,0,0.3);\n        }\n        .lives {\n            color: white;\n            font-size: 24px;\n            margin: 10px;\n        }\n    \n", "body": "\n    <div class=\"score\">得分: <span id=\"score\">0</span></div>\n    <div class=\"lives\">生命: <span id=\"lives\">❤️❤️❤️</span></div>\n    <canvas id=\"gameCanvas\" width=\"400\" height=\"500\"></canvas>\n\n    \n", "script": "\n        class BreakoutGame {\n            constructor() {\n                this.canvas = document.getElementById('gameCanvas');\n                this.ctx = this.canvas.getContext('2d');\n\n                // 挡板\n                this.paddle = {\n                    width: 80,\n                    height: 12,\n                    x: 160,\n                    speed: 8\n                };\n                this.paddle.y = this.canvas.height - 30;\n\n                // 球（初始和掉命后都用45°斜上，速度模=this.balls[i].speed，与挡板反弹速度一致）\n                // 多球支持（extra_ball 道具加球）\n                this.balls = [this.makeBall()];\n\n                // 砖块\n                this.bricks = [];\n                this.brickRows = 5;\n                this.brickCols = 8;\n                this.brickWidth = 45;\n                this.brickHeight = 20;\n                this.brickPadding = 5;\n                this.brickOffsetTop = 50;\n                this.brickOffsetLeft = 10;\n\n                this.score = 0;\n                this.lives = 3;\n                this.gameOver = false;\n                this.gameStarted = false;\n                this.paused = false;\n                this.rafId = null;\n\n                this.init();\n            }\n\n            makeBall(x, y, angle) {\n                const speed = this.ballSpeed || 4;\n                if (x === undefined) x = 200;\n                if (y === undefined) y = 300;\n                if (angle === undefined) angle = -Math.PI / 4;\n                return { x, y, radius: 8, dx: speed * Math.cos(angle), dy: speed * Math.sin(angle), speed };\n            }\n\n            init() {\n                this.createBricks();\n                this.bindEvents();\n                this.bindMessages();\n                this.draw();\n                this.notifyReady();\n            }\n\n            // 响应父窗口暂停/恢复/配置/道具消息\n            bindMessages() {\n                window.addEventListener('message', (e) => {\n                    if (!e.data || typeof e.data !== 'object') return;\n                    const d = e.data;\n                    if (d.type === 'pause') this.pause();\n                    else if (d.type === 'resume') this.resume();\n                    else if (d.type === 'config') this.applyConfig(d.data || {});\n                    else if (d.type === 'item') this.handleItem(d.data && d.data.id);\n                });\n                // 文档卸载（重开/退出关卡）时停掉动画循环，防止残留 rAF 与下一局叠加导致球速翻倍\n                window.addEventListener('pagehide', () => {\n                    if (this.rafId) {\n                        cancelAnimationFrame(this.rafId);\n                        this.rafId = null;\n                    }\n                });\n            }\n\n            // 收外壳难度：砖块行数和球速随难度递增（1A 适配层）\n            applyConfig(cfg) {\n                const diff = cfg.difficulty || 1;\n                if (diff <= 2) { this.brickRows = 5; this.ballSpeed = 4; }\n                else if (diff <= 5) { this.brickRows = 7; this.ballSpeed = 4.5; }\n                else { this.brickRows = 9; this.ballSpeed = 5; }\n                this.createBricks();\n                this.draw();\n            }\n\n            // 局内道具：加3颗球（从当前球的位置分三个角度射出去）\n            handleItem(id) {\n                if (id !== 'extra_ball') return;\n                if (this.gameOver || !this.gameStarted) return;\n                const ref = this.balls[0];\n                if (!ref) return;\n                for (const angle of [-Math.PI / 4, -Math.PI / 3, -Math.PI / 6]) {\n                    this.balls.push(this.makeBall(ref.x, ref.y, angle));\n                }\n            }\n\n            pause() {\n                if (this.gameOver) return;\n                this.paused = true;\n                if (this.rafId) {\n                    cancelAnimationFrame(this.rafId);\n                    this.rafId = null;\n                }\n            }\n\n            resume() {\n                if (this.gameOver) return;\n                this.paused = false;\n                if (this.gameStarted && !this.rafId) {\n                    this.rafId = requestAnimationFrame(() => this.gameLoop());\n                }\n            }\n\n            createBricks() {\n                const colors = ['#e74c3c', '#f39c12', '#f1c40f', '#2ecc71', '#3498db'];\n\n                for (let row = 0; row < this.brickRows; row++) {\n                    this.bricks[row] = [];\n                    for (let col = 0; col < this.brickCols; col++) {\n                        this.bricks[row][col] = {\n                            x: col * (this.brickWidth + this.brickPadding) + this.brickOffsetLeft,\n                            y: row * (this.brickHeight + this.brickPadding) + this.brickOffsetTop,\n                            status: 1,\n                            color: colors[row % colors.length]\n                        };\n                    }\n                }\n            }\n\n            bindEvents() {\n                // 鼠标移动\n                this.canvas.addEventListener('mousemove', (e) => {\n                    if (this.paused) return;\n                    const rect = this.canvas.getBoundingClientRect();\n                    const mouseX = e.clientX - rect.left;\n                    this.paddle.x = Math.max(0, Math.min(mouseX - this.paddle.width / 2,\n                        this.canvas.width - this.paddle.width));\n                });\n\n                // 触摸移动\n                this.canvas.addEventListener('touchmove', (e) => {\n                    if (this.paused) return;\n                    e.preventDefault();\n                    const rect = this.canvas.getBoundingClientRect();\n                    const touchX = e.touches[0].clientX - rect.left;\n                    this.paddle.x = Math.max(0, Math.min(touchX - this.paddle.width / 2,\n                        this.canvas.width - this.paddle.width));\n                });\n\n                // 点击开始\n                this.canvas.addEventListener('click', () => {\n                    if (this.paused) return;\n                    if (!this.gameStarted && !this.gameOver) {\n                        this.gameStarted = true;\n                        // 掉命后旧动画循环其实还活着（gameLoop 不因 gameStarted=false 停，只是 update 空转），\n                        // 直接复用，绝不能再启动一条循环——否则两条 rAF 叠加，球每帧动两次 = 速度翻倍\n                        if (!this.rafId) {\n                            this.rafId = requestAnimationFrame(() => this.gameLoop());\n                        }\n                    }\n                });\n            }\n\n            update() {\n                if (!this.gameStarted || this.gameOver) return;\n\n                // 移动每个球（支持 extra_ball 多球）\n                for (const ball of this.balls) {\n                    ball.x += ball.dx;\n                    ball.y += ball.dy;\n\n                    // 墙壁碰撞\n                    if (ball.x + ball.radius > this.canvas.width ||\n                        ball.x - ball.radius < 0) {\n                        ball.dx = -ball.dx;\n                    }\n\n                    if (ball.y - ball.radius < 0) {\n                        ball.dy = -ball.dy;\n                    }\n\n                    // 挡板碰撞\n                    if (ball.y + ball.radius > this.paddle.y &&\n                        ball.x > this.paddle.x &&\n                        ball.x < this.paddle.x + this.paddle.width) {\n\n                        // 根据击球位置改变角度\n                        const hitPos = (ball.x - this.paddle.x) / this.paddle.width;\n                        const angle = (hitPos - 0.5) * Math.PI / 3; // -60度到60度\n                        ball.dx = ball.speed * Math.sin(angle);\n                        ball.dy = -ball.speed * Math.cos(angle);\n                    }\n\n                    // 砖块碰撞（一个球一帧最多打掉一块砖）\n                    outer:\n                    for (let row = 0; row < this.brickRows; row++) {\n                        for (let col = 0; col < this.brickCols; col++) {\n                            const brick = this.bricks[row][col];\n                            if (brick.status === 1) {\n                                if (ball.x > brick.x &&\n                                    ball.x < brick.x + this.brickWidth &&\n                                    ball.y > brick.y &&\n                                    ball.y < brick.y + this.brickHeight) {\n\n                                    ball.dy = -ball.dy;\n                                    brick.status = 0;\n                                    this.score += 10;\n                                    document.getElementById('score').textContent = this.score;\n\n                                    // 检查胜利\n                                    if (this.checkWin()) {\n                                        this.endGame(true);\n                                        return;\n                                    }\n                                    break outer;\n                                }\n                            }\n                        }\n                    }\n                }\n\n                // 掉出屏幕的球移除；全部掉光才扣一条命\n                const before = this.balls.length;\n                this.balls = this.balls.filter(b => b.y - b.radius <= this.canvas.height);\n                if (before > 0 && this.balls.length === 0) {\n                    this.lives--;\n                    this.updateLives();\n\n                    if (this.lives <= 0) {\n                        this.endGame(false);\n                    } else {\n                        this.resetBall();\n                    }\n                }\n            }\n\n            checkWin() {\n                for (let row = 0; row < this.brickRows; row++) {\n                    for (let col = 0; col < this.brickCols; col++) {\n                        if (this.bricks[row][col].status === 1) {\n                            return false;\n                        }\n                    }\n                }\n                return true;\n            }\n\n            resetBall() {\n                this.balls = [this.makeBall(this.canvas.width / 2, 300)];\n                this.gameStarted = false;\n            }\n\n            updateLives() {\n                document.getElementById('lives').textContent = '❤️'.repeat(this.lives);\n            }\n\n            draw() {\n                // 清空画布\n                this.ctx.fillStyle = '#2c3e50';\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n\n                // 绘制砖块\n                for (let row = 0; row < this.brickRows; row++) {\n                    for (let col = 0; col < this.brickCols; col++) {\n                        const brick = this.bricks[row][col];\n                        if (brick.status === 1) {\n                            this.ctx.fillStyle = brick.color;\n                            this.ctx.fillRect(brick.x, brick.y, this.brickWidth, this.brickHeight);\n\n                            // 高光效果\n                            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';\n                            this.ctx.fillRect(brick.x, brick.y, this.brickWidth, this.brickHeight / 2);\n                        }\n                    }\n                }\n\n                // 绘制挡板\n                this.ctx.fillStyle = '#3498db';\n                this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.width, this.paddle.height);\n                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';\n                this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.width, this.paddle.height / 2);\n\n                // 绘制球（多球）\n                this.ctx.fillStyle = '#ecf0f1';\n                for (const ball of this.balls) {\n                    this.ctx.beginPath();\n                    this.ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);\n                    this.ctx.fill();\n                }\n\n                // 开始提示\n                if (!this.gameStarted && !this.gameOver) {\n                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';\n                    this.ctx.font = '20px Arial';\n                    this.ctx.textAlign = 'center';\n                    this.ctx.fillText('点击开始', this.canvas.width / 2, this.canvas.height / 2);\n                }\n            }\n\n            gameLoop() {\n                if (this.gameOver) return;\n\n                this.update();\n                this.draw();\n\n                if (!this.paused) {\n                    this.rafId = requestAnimationFrame(() => this.gameLoop());\n                }\n            }\n\n            endGame(success) {\n                this.gameOver = true;\n                // 停掉动画循环，避免残链与下一局叠加\n                if (this.rafId) {\n                    cancelAnimationFrame(this.rafId);\n                    this.rafId = null;\n                }\n                setTimeout(() => {\n                    this.notifyGameOver(success);\n                }, 500);\n            }\n\n            notifyReady() {\n                if (window.parent !== window) {\n                    window.parent.postMessage({ type: 'game-ready' }, '*');\n                }\n            }\n\n            notifyGameOver(success) {\n                if (window.parent !== window) {\n                    window.parent.postMessage({\n                        type: 'game-over',\n                        data: { score: this.score, success: success }\n                    }, '*');\n                }\n            }\n        }\n\n        const game = new BreakoutGame();\n    \n"}, "maketen": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#f7971e,#ffd200); ct,total:total});},300);}\nfunction onPause(){}function onResume(){}function handleItem(id){if(id==='remove2')removeTwo();}function removeTwo(){var bs=[].slice.call(document.querySelectorAll('button.opt'));var ws=bs.filter(function(x){return !x.disabled&&x.dataset.ans!=='1';});for(var k=0;k<2&&ws.length;k++){var i=Math.floor(Math.random()*ws.length);var x=ws.splice(i,1)[0];x.disabled=true;x.style.opacity='0.3';x.style.pointerEvents='none';x.style.cursor='default';}}\n\nnotifyReady();\n\n"}, "2048": {"style": "\n        body {\n            margin: 0;\n            padding: 20px;\n            background: #faf8ef;\n            font-family: \"Clear Sans\", \"Helvetica Neue\", Arial, sans-serif;\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            min-height: 100vh;\n        }\n        .game-container {\n            background: #bbada0;\n            border-radius: 10px;\n            padding: 15px;\n            position: relative;\n        }\n        .grid-container {\n            display: grid;\n            grid-template-columns: repeat(4, 80px);\n            grid-gap: 15px;\n        \n    max-width: 100%;\n    overflow-x: auto;}\n        .grid-cell {\n            width: 80px;\n            height: 80px;\n            background: rgba(238, 228, 218, 0.35);\n            border-radius: 5px;\n        }\n        .tile.hint { outline: 4px solid #ffd700; animation: hintPulse 0.5s ease-in-out 2; }\n        @keyframes hintPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }\n        .tile {\n            position: absolute;\n            width: 80px;\n            height: 80px;\n            border-radius: 5px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            font-weight: bold;\n            font-size: 32px;\n            transition: all 0.15s ease-in-out;\n        }\n        .tile-2 { background: #eee4da; color: #776e65; }\n        .tile-4 { background: #ede0c8; color: #776e65; }\n        .tile-8 { background: #f2b179; color: #f9f6f2; }\n        .tile-16 { background: #f59563; color: #f9f6f2; }\n        .tile-32 { background: #f67c5f; color: #f9f6f2; }\n        .tile-64 { background: #f65e3b; color: #f9f6f2; }\n        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }\n        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }\n        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }\n        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 24px; }\n        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 24px; }\n        .score-container {\n            background: #bbada0;\n            color: white;\n            padding: 10px 20px;\n            border-radius: 5px;\n            margin: 10px;\n            font-size: 18px;\n            font-weight: bold;\n        }\n        .game-over {\n            position: absolute;\n            top: 0;\n            left: 0;\n            right: 0;\n            bottom: 0;\n            background: rgba(238, 228, 218, 0.9);\n            display: none;\n            align-items: center;\n            justify-content: center;\n            border-radius: 10px;\n            font-size: 48px;\n            font-weight: bold;\n            color: #776e65;\n        }\n        .game-over.show {\n            display: flex;\n        }\n    \n", "body": "\n    <div class=\"score-container\">得分: <span id=\"score\">0</span> <span id=\"goal\" style=\"font-size:13px; color:#f9f6f2;\"></span></div>\n    <div class=\"game-container\">\n        <div class=\"grid-container\" id=\"grid\"></div>\n        <div class=\"game-over\" id=\"gameOver\">游戏结束</div>\n    </div>\n\n    \n", "script": "\n        class Game2048 {\n            constructor() {\n                this.grid = Array(4).fill().map(() => Array(4).fill(0));\n                this.score = 0;\n                this.gameOver = false;\n                this.paused = false;\n                this.history = []; // R41：撤销步栈\n                this.hintCells = null; // R41：提示闪烁位置\n                this.goal = 1024; // 目标档（config可覆盖：难度1→512、3→1024、6→2048）\n                this.init();\n            }\n\n            init() {\n                this.addRandomTile();\n                this.addRandomTile();\n                this.render();\n                this.bindEvents();\n                this.notifyReady();\n            }\n\n            addRandomTile() {\n                const empty = [];\n                for (let i = 0; i < 4; i++) {\n                    for (let j = 0; j < 4; j++) {\n                        if (this.grid[i][j] === 0) empty.push([i, j]);\n                    }\n                }\n                if (empty.length > 0) {\n                    const [row, col] = empty[Math.floor(Math.random() * empty.length)];\n                    this.grid[row][col] = Math.random() < 0.9 ? 2 : 4;\n                }\n            }\n\n            move(direction) {\n                if (this.gameOver || this.paused) return;\n                let moved = false;\n                const oldScore = this.score; // R41：撤销要还原分数\n                const oldGrid = this.grid.map(row => [...row]);\n\n                switch (direction) {\n                    case 'left':\n                        moved = this.moveLeft();\n                        break;\n                    case 'right':\n                        moved = this.moveRight();\n                        break;\n                    case 'up':\n                        moved = this.moveUp();\n                        break;\n                    case 'down':\n                        moved = this.moveDown();\n                        break;\n                }\n\n                if (moved) {\n                    this.history.push({ grid: oldGrid, score: oldScore }); // R41：记录上一步\n                    if (this.history.length > 30) this.history.shift();\n                    this.addRandomTile();\n                    this.render();\n\n                    // 达成目标档即获胜（难度越高目标越高）\n                    if (this.grid.some(row => row.some(v => v >= this.goal))) {\n                        this.gameOver = true;\n                        setTimeout(() => this.notifyGameOver(), 400);\n                        return;\n                    }\n\n                    if (!this.canMove()) {\n                        this.gameOver = true;\n                        this.showGameOver();\n                    }\n                }\n            }\n\n            moveLeft() {\n                let moved = false;\n                for (let i = 0; i < 4; i++) {\n                    const row = this.grid[i].filter(v => v !== 0);\n                    for (let j = 0; j < row.length - 1; j++) {\n                        if (row[j] === row[j + 1]) {\n                            row[j] *= 2;\n                            this.score += row[j];\n                            row.splice(j + 1, 1);\n                        }\n                    }\n                    while (row.length < 4) row.push(0);\n                    if (row.join() !== this.grid[i].join()) moved = true;\n                    this.grid[i] = row;\n                }\n                return moved;\n            }\n\n            moveRight() {\n                this.reverseRows();\n                const moved = this.moveLeft();\n                this.reverseRows();\n                return moved;\n            }\n\n            moveUp() {\n                this.transpose();\n                const moved = this.moveLeft();\n                this.transpose();\n                return moved;\n            }\n\n            moveDown() {\n                this.transpose();\n                const moved = this.moveRight();\n                this.transpose();\n                return moved;\n            }\n\n            transpose() {\n                const newGrid = Array(4).fill().map(() => Array(4).fill(0));\n                for (let i = 0; i < 4; i++) {\n                    for (let j = 0; j < 4; j++) {\n                        newGrid[j][i] = this.grid[i][j];\n                    }\n                }\n                this.grid = newGrid;\n            }\n\n            reverseRows() {\n                this.grid = this.grid.map(row => row.reverse());\n            }\n\n            canMove() {\n                for (let i = 0; i < 4; i++) {\n                    for (let j = 0; j < 4; j++) {\n                        if (this.grid[i][j] === 0) return true;\n                        if (j < 3 && this.grid[i][j] === this.grid[i][j + 1]) return true;\n                        if (i < 3 && this.grid[i][j] === this.grid[i + 1][j]) return true;\n                    }\n                }\n                return false;\n            }\n\n            render() {\n                const container = document.getElementById('grid');\n                container.innerHTML = '';\n\n                // 绘制底层格子\n                for (let i = 0; i < 16; i++) {\n                    const cell = document.createElement('div');\n                    cell.className = 'grid-cell';\n                    container.appendChild(cell);\n                }\n\n                // 绘制数字方块\n                for (let i = 0; i < 4; i++) {\n                    for (let j = 0; j < 4; j++) {\n                        const value = this.grid[i][j];\n                        if (value !== 0) {\n                            const tile = document.createElement('div');\n                            tile.className = `tile tile-${value}`;\n                            tile.textContent = value;\n                            tile.style.top = (i * 95 + 15) + 'px';\n                            tile.style.left = (j * 95 + 15) + 'px';\n                            container.appendChild(tile);\n                        }\n                    }\n                }\n\n                document.getElementById('score').textContent = this.score;\n                this.renderGoal();\n            }\n\n            showGameOver() {\n                document.getElementById('gameOver').classList.add('show');\n                setTimeout(() => {\n                    this.notifyGameOver();\n                }, 500);\n            }\n\n            bindEvents() {\n                document.addEventListener('keydown', (e) => {\n                    if (e.key === 'ArrowLeft') this.move('left');\n                    else if (e.key === 'ArrowRight') this.move('right');\n                    else if (e.key === 'ArrowUp') this.move('up');\n                    else if (e.key === 'ArrowDown') this.move('down');\n                });\n\n                // 触摸支持（R3-32：加preventDefault防页面滚动；touchStartX初始化为0防NaN误触发）\n                let touchStartX = 0, touchStartY = 0;\n                document.addEventListener('touchstart', (e) => {\n                    e.preventDefault();\n                    touchStartX = e.touches[0].clientX;\n                    touchStartY = e.touches[0].clientY;\n                }, { passive: false });\n                document.addEventListener('touchend', (e) => {\n                    e.preventDefault();\n                    const touchEndX = e.changedTouches[0].clientX;\n                    const touchEndY = e.changedTouches[0].clientY;\n                    const dx = touchEndX - touchStartX;\n                    const dy = touchEndY - touchStartY;\n\n                    if (Math.abs(dx) > Math.abs(dy)) {\n                        this.move(dx > 0 ? 'right' : 'left');\n                    } else {\n                        this.move(dy > 0 ? 'down' : 'up');\n                    }\n                }, { passive: false });\n\n                // 接收父窗口暂停/恢复/配置/道具指令\n                window.addEventListener('message', (e) => {\n                    if (!e.data || typeof e.data !== 'object') return;\n                    const d = e.data;\n                    if (d.type === 'pause') this.paused = true;\n                    else if (d.type === 'resume') this.paused = false;\n                    else if (d.type === 'config') this.applyConfig(d.data || {});\n                    else if (d.type === 'item') this.handleItem(d.data && d.data.id);\n                });\n            }\n\n            // 难度→目标档（1A 适配层）：难度1→512、3→1024、6+→2048\n            applyConfig(cfg) {\n                const diff = cfg.difficulty || 1;\n                if (diff <= 2) this.goal = 512;\n                else if (diff <= 5) this.goal = 1024;\n                else this.goal = 2048;\n                this.renderGoal();\n            }\n\n            renderGoal() {\n                const g = document.getElementById('goal');\n                if (g) g.textContent = `目标: ${this.goal}`;\n            }\n\n            // 局内道具：锤子=敲掉一个最大的方块；魔法棒=让一个方块数字翻倍\n            // R41：提示道具——找一对相邻相同数字（可合并）\n            findMergePair() {\n                for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {\n                    if (this.grid[i][j] === 0) continue;\n                    const v = this.grid[i][j];\n                    if (j < 3 && this.grid[i][j + 1] === v) return [[i, j], [i, j + 1]];\n                    if (i < 3 && this.grid[i + 1][j] === v) return [[i, j], [i + 1, j]];\n                }\n                return null;\n            }\n\n            handleItem(id) {\n                if (this.gameOver || this.paused) return;\n                if (id === 'undo') { // R41：通用道具·撤销一步\n                    const s = this.history.pop();\n                    if (s) { this.grid = s.grid; this.score = s.score; this.render(); }\n                } else if (id === 'hint') { // R41：通用道具·提示（闪烁一对可合并的相同数字）\n                    const pair = this.findMergePair();\n                    if (pair) {\n                        this.hintCells = pair;\n                        this.render();\n                        setTimeout(() => { this.hintCells = null; this.render(); }, 900);\n                    }\n                } else if (id === 'hammer') {\n                    const cells = [];\n                    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (this.grid[r][c] !== 0) cells.push([r, c]);\n                    if (cells.length) {\n                        cells.sort((a, b) => this.grid[b[0]][b[1]] - this.grid[a[0]][a[1]]);\n                        const [r, c] = cells[0];\n                        this.grid[r][c] = 0;\n                        this.render();\n                    }\n                } else if (id === 'magic_wand') {\n                    const cells = [];\n                    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (this.grid[r][c] !== 0) cells.push([r, c]);\n                    if (cells.length) {\n                        const [r, c] = cells[Math.floor(Math.random() * cells.length)];\n                        this.grid[r][c] *= 2;\n                        this.render();\n                    }\n                }\n            }\n\n            notifyReady() {\n                if (window.parent !== window) {\n                    window.parent.postMessage({ type: 'game-ready' }, '*');\n                }\n            }\n\n            notifyGameOver() {\n                if (window.parent !== window) {\n                    window.parent.postMessage({\n                        // 2048无\"失败\"概念：满盘即一局结束，星级完全由分数决定（R3-4语义对齐）\n                        type: 'game-over',\n                        data: { score: this.score, success: true }\n                    }, '*');\n                }\n            }\n        }\n\n        const game = new Game2048();\n    \n"}, "coloring": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#f953c6,#b91d73);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#board{display:grid;gap:2px;background:rgba(0,0,0,.2);padding:6px;border-radius:10px;}\n.cell{width:34px;height:34px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);}\n#palette{display:flex;gap:8px;margin-top:12px;}\n.pal{width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid rgba(255,255,255,.3);}\n.pal.sel{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.7);}\n.hint{font-size:15px;color:#ffe0f0;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">涂色 0 块</div>\n<div id=\"board\"></div>\n<div id=\"palette\"></div>\n<div class=\"hint\">选颜色，点带数字的格子涂上色，把整幅画涂完</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\n// 8x8 像素画：0=留白，1-5=颜色编号（R41：原来只有一张图、难度没接、全是数字1，这次加3张按难度选）\nvar PIC1=[\n '..11..11',\n '1.1..1.1',\n '111..111',\n '111..111',\n '.11..11.',\n '...11...',\n '.11111..',\n '1111111.'\n];\nvar PIC2=[\n '...11...',\n '.11111..',\n '11111111',\n '11111111',\n '..2222..',\n '..2222..',\n '..2..2..',\n '..2..2..'\n];\nvar PIC3=[\n '.11..11.',\n '11111111',\n '11111111',\n '11111111',\n '.111111.',\n '..1111..',\n '...11...',\n '...11...'\n];\nvar PIC=PIC1;\nvar COLORS=['','#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6'];\nvar rows,cols,grid,filled,totalCells,selColor,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;PIC=d<=7?PIC1:d<=14?PIC2:PIC3;start();} // R41:难度选图\nfunction start(){\n  rows=PIC.length;cols=PIC[0].length;\n  grid=[];filled=0;totalCells=0;\n  for(var r=0;r<rows;r++){grid.push([]);for(var c=0;c<cols;c++){var ch=PIC[r][c];grid[r].push(ch==='.'?0:parseInt(ch,10));if(ch!=='.')totalCells++;}}\n  selColor=1;ended=false;gPaused=false;\n  document.getElementById('bar').textContent='涂色 0/'+totalCells+' 块';\n  var b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+cols+',34px)';b.innerHTML='';\n  for(r=0;r<rows;r++)for(c=0;c<cols;c++){\n    (function(rr,cc){\n      var d=document.createElement('div');d.className='cell';d.dataset.r=rr;d.dataset.c=cc;\n      d.textContent=grid[rr][cc]||'';\n      if(grid[rr][cc]){d.style.background='#fff';d.style.color='#666';}\n      d.onclick=function(){\n        if(ended||gPaused)return;\n        var v=grid[rr][cc];\n        if(!v)return;\n        if(!d.dataset.painted){d.dataset.painted='1';filled++;}\n        d.style.background=COLORS[selColor];\n        d.style.color=COLORS[selColor];\n        d.style.textShadow='none';\n        document.getElementById('bar').textContent='涂色 '+filled+'/'+totalCells+' 块';\n        if(filled>=totalCells){end(true);}\n      };\n      b.appendChild(d);\n    })(r,c);\n  }\n  var pal=document.getElementById('palette');pal.innerHTML='';\n  for(var i=1;i<COLORS.length;i++){\n    var p=document.createElement('div');p.className='pal';p.style.background=COLORS[i];\n    (function(ci){p.onclick=function(){if(ended||gPaused)return;selColor=ci;document.querySelectorAll('.pal').forEach(function(x){x.classList.remove('sel');});p.classList.add('sel');};})(i);\n    pal.appendChild(p);\n  }\n  renderPal();notifyReady();\n}\nfunction renderPal(){document.querySelectorAll('.pal')[0].classList.add('sel');}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(filled,win);},400);}\nfunction onPause(){}function onResume(){}function handleItem(){}\n\nnotifyReady();\n\n"}, "link_2248": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#a1c4fd,#c2e9fb);display:flex;flex-direction:column
