     .cell.revealed.n6 { color: #1abc9c; }\n        .cell.revealed.n7 { color: #34495e; }\n        .cell.revealed.n8 { color: #7f8c8d; }\n    \n", "body": "\n    <div class=\"game-container\">\n        <div class=\"info\">\n            <span>💣 <span id=\"minesLeft\">10</span></span>\n            <span>⏱️ <span id=\"timer\">0</span>s</span>\n        </div>\n        <div class=\"grid\" id=\"grid\"></div>\n    </div>\n\n    \n", "script": "\n        class Minesweeper {\n            constructor() {\n                this.rows = 9;\n                this.cols = 9;\n                this.mineCount = 10;\n                this.grid = [];\n                this.revealed = [];\n                this.flagged = [];\n                this.gameOver = false;\n                this.startTime = 0;\n                this.timer = null;\n                this.minesPlaced = false; // 雷延迟到首次点击后再布置（首踩保护）\n                this.paused = false;\n                this.pauseAt = 0; // 暂停起点：恢复时把暂停时长从用时里扣掉\n\n                this.init();\n            }\n\n            init() {\n                this.createGrid();\n                this.render();\n                this.bindMessages();\n                this.notifyReady();\n            }\n\n            // 响应父窗口暂停/恢复/配置/道具消息\n            bindMessages() {\n                window.addEventListener('message', (e) => {\n                    if (!e.data || typeof e.data !== 'object') return;\n                    const d = e.data;\n                    if (d.type === 'pause') this.pause();\n                    else if (d.type === 'resume') this.resume();\n                    else if (d.type === 'config') this.applyConfig(d.data || {});\n                    else if (d.type === 'item') this.handleItem(d.data && d.data.id);\n                });\n            }\n\n            // 收外壳难度：盘越大雷越多（1A 适配层）\n            applyConfig(cfg) {\n                const diff = cfg.difficulty || 1;\n                if (diff <= 2) { this.rows = 9; this.cols = 9; this.mineCount = 5; }\n                else if (diff <= 5) { this.rows = 9; this.cols = 9; this.mineCount = 10; }\n                else { this.rows = 12; this.cols = 12; this.mineCount = 20; }\n                document.getElementById('grid').style.gridTemplateColumns = `repeat(${this.cols}, 35px)`;\n                this.createGrid();\n                this.render();\n            }\n\n            // 局内道具：排雷卡 = 自动翻开两个安全格\n            handleItem(id) {\n                if (id !== 'remove2') return;\n                if (this.gameOver || this.paused) return;\n                // 首次点击前雷还没布：先安全布雷再翻\n                if (!this.minesPlaced) {\n                    this.minesPlaced = true;\n                    this.placeMinesSafeFrom(Math.floor(this.rows / 2), Math.floor(this.cols / 2));\n                    this.calculateNumbers();\n                }\n                const safeCells = [];\n                for (let r = 0; r < this.rows; r++) {\n                    for (let c = 0; c < this.cols; c++) {\n                        if (!this.revealed[r][c] && this.grid[r][c] !== -1 && !this.flagged[r][c]) {\n                            safeCells.push([r, c]);\n                        }\n                    }\n                }\n                for (let i = 0; i < 2 && safeCells.length; i++) {\n                    const idx = Math.floor(Math.random() * safeCells.length);\n                    const [r, c] = safeCells[idx];\n                    safeCells.splice(idx, 1);\n                    this.revealed[r][c] = true;\n                    if (this.grid[r][c] === 0) {\n                        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {\n                            const nr = r + dr, nc = c + dc;\n                            if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols &&\n                                !this.revealed[nr][nc] && this.grid[nr][nc] !== -1) {\n                                this.revealed[nr][nc] = true;\n                            }\n                        }\n                    }\n                }\n                this.render();\n                if (this.checkWin()) this.endGame(true);\n            }\n\n            pause() {\n                if (this.gameOver) return;\n                this.paused = true;\n                if (!this.pauseAt) this.pauseAt = Date.now(); // 记录暂停起点\n                if (this.timer) {\n                    clearInterval(this.timer);\n                    this.timer = null;\n                }\n            }\n\n            resume() {\n                if (this.gameOver) return;\n                this.paused = false;\n                // startTime 后移暂停时长，恢复后用时不把暂停算进去（已开局才补偿）\n                if (this.pauseAt) {\n                    if (this.startTime > 0) this.startTime += Date.now() - this.pauseAt;\n                    this.pauseAt = 0;\n                }\n                // 已开始但暂停中则恢复计时\n                if (this.startTime > 0 && !this.timer) {\n                    this.timer = setInterval(() => this.updateTimer(), 1000);\n                }\n            }\n\n            createGrid() {\n                for (let r = 0; r < this.rows; r++) {\n                    this.grid[r] = [];\n                    this.revealed[r] = [];\n                    this.flagged[r] = [];\n                    for (let c = 0; c < this.cols; c++) {\n                        this.grid[r][c] = 0;\n                        this.revealed[r][c] = false;\n                        this.flagged[r][c] = false;\n                    }\n                }\n            }\n\n            placeMines() {\n                let placed = 0;\n                while (placed < this.mineCount) {\n                    const r = Math.floor(Math.random() * this.rows);\n                    const c = Math.floor(Math.random() * this.cols);\n                    if (this.grid[r][c] !== -1) {\n                        this.grid[r][c] = -1;\n                        placed++;\n                    }\n                }\n            }\n\n            // 首次点击后布雷，保证首点及其周围8格无雷（首踩保护）\n            placeMinesSafeFrom(sr, sc) {\n                let placed = 0;\n                let guard = 0;\n                while (placed < this.mineCount && guard < 500) {\n                    guard++;\n                    const r = Math.floor(Math.random() * this.rows);\n                    const c = Math.floor(Math.random() * this.cols);\n                    // 避开首点周围3x3区域\n                    if (Math.abs(r - sr) <= 1 && Math.abs(c - sc) <= 1) continue;\n                    if (this.grid[r][c] !== -1) {\n                        this.grid[r][c] = -1;\n                        placed++;\n                    }\n                }\n            }\n\n            calculateNumbers() {\n                for (let r = 0; r < this.rows; r++) {\n                    for (let c = 0; c < this.cols; c++) {\n                        if (this.grid[r][c] === -1) continue;\n\n                        let count = 0;\n                        for (let dr = -1; dr <= 1; dr++) {\n                            for (let dc = -1; dc <= 1; dc++) {\n                                const nr = r + dr;\n                                const nc = c + dc;\n                                if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {\n                                    if (this.grid[nr][nc] === -1) count++;\n                                }\n                            }\n                        }\n                        this.grid[r][c] = count;\n                    }\n                }\n            }\n\n            render() {\n                const container = document.getElementById('grid');\n                container.innerHTML = '';\n\n                for (let r = 0; r < this.rows; r++) {\n                    for (let c = 0; c < this.cols; c++) {\n                        const cell = document.createElement('button');\n                        cell.className = 'cell';\n                        cell.dataset.row = r;\n                        cell.dataset.col = c;\n\n                        if (this.revealed[r][c]) {\n                            cell.classList.add('revealed');\n                            const value = this.grid[r][c];\n                            if (value === -1) {\n                                cell.textContent = '💣';\n                                cell.classList.add('mine');\n                            } else if (value > 0) {\n                                cell.textContent = value;\n                                cell.classList.add(`n${value}`);\n                            }\n                        } else if (this.flagged[r][c]) {\n                            cell.textContent = '🚩';\n                            cell.classList.add('flagged');\n                        }\n\n                        cell.onclick = () => this.revealCell(r, c);\n                        cell.oncontextmenu = (e) => {\n                            e.preventDefault();\n                            this.toggleFlag(r, c);\n                        };\n\n                        // 长按标记（移动端）\n                        let pressTimer;\n                        cell.ontouchstart = (e) => {\n                            pressTimer = setTimeout(() => {\n                                e.preventDefault();\n                                this.toggleFlag(r, c);\n                            }, 500);\n                        };\n                        cell.ontouchend = () => {\n                            clearTimeout(pressTimer);\n                        };\n\n                        container.appendChild(cell);\n                    }\n                }\n\n                this.updateInfo();\n            }\n\n            revealCell(r, c) {\n                if (this.gameOver || this.paused || this.revealed[r][c] || this.flagged[r][c]) return;\n\n                // 首次点击时布雷（避开该格），保证第一下不会踩雷\n                if (!this.minesPlaced) {\n                    this.minesPlaced = true;\n                    this.placeMinesSafeFrom(r, c);\n                    this.calculateNumbers();\n                }\n\n                if (!this.startTime) {\n                    this.startTime = Date.now();\n                    this.timer = setInterval(() => this.updateTimer(), 1000);\n                }\n\n                this.revealed[r][c] = true;\n\n                if (this.grid[r][c] === -1) {\n                    this.endGame(false);\n                    return;\n                }\n\n                if (this.grid[r][c] === 0) {\n                    for (let dr = -1; dr <= 1; dr++) {\n                        for (let dc = -1; dc <= 1; dc++) {\n                            const nr = r + dr;\n                            const nc = c + dc;\n                            if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {\n                                if (!this.revealed[nr][nc]) {\n                                    this.revealCell(nr, nc);\n                                }\n                            }\n                        }\n                    }\n                }\n\n                this.render();\n\n                if (this.checkWin()) {\n                    this.endGame(true);\n                }\n            }\n\n            toggleFlag(r, c) {\n                if (this.gameOver || this.paused || this.revealed[r][c]) return;\n                this.flagged[r][c] = !this.flagged[r][c];\n                this.render();\n            }\n\n            checkWin() {\n                for (let r = 0; r < this.rows; r++) {\n                    for (let c = 0; c < this.cols; c++) {\n                        if (this.grid[r][c] !== -1 && !this.revealed[r][c]) {\n                            return false;\n                        }\n                    }\n                }\n                return true;\n            }\n\n            updateInfo() {\n                let flagCount = 0;\n                for (let r = 0; r < this.rows; r++) {\n                    for (let c = 0; c < this.cols; c++) {\n                        if (this.flagged[r][c]) flagCount++;\n                    }\n                }\n                document.getElementById('minesLeft').textContent = this.mineCount - flagCount;\n            }\n\n            updateTimer() {\n                const elapsed = Math.floor((Date.now() - this.startTime) / 1000);\n                document.getElementById('timer').textContent = elapsed;\n            }\n\n            endGame(won) {\n                if (this.gameOver) return; // 防重入：递归revealCell的回溯层会重复触发，只能结算一次\n                this.gameOver = true;\n                if (this.timer) clearInterval(this.timer);\n\n                // 显示所有地雷\n                for (let r = 0; r < this.rows; r++) {\n                    for (let c = 0; c < this.cols; c++) {\n                        if (this.grid[r][c] === -1) {\n                            this.revealed[r][c] = true;\n                        }\n                    }\n                }\n                this.render();\n\n                const time = Math.floor((Date.now() - this.startTime) / 1000);\n                // 计分放宽：对6岁孩子，1分钟内通关可得高分\n                const score = won ? Math.max(1000 - time * 5, 100) : 0;\n\n                setTimeout(() => {\n                    this.notifyGameOver(score, won);\n                }, 500);\n            }\n\n            notifyReady() {\n                if (window.parent !== window) {\n                    window.parent.postMessage({ type: 'game-ready' }, '*');\n                }\n            }\n\n            notifyGameOver(score, won) {\n                if (window.parent !== window) {\n                    window.parent.postMessage({\n                        type: 'game-over',\n                        data: { score: score, success: won }\n                    }, '*');\n                }\n            }\n        }\n\n        const game = new Minesweeper();\n    \n"}, "countshape": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#43a047,#8bc34a);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\ncanvas{background:#fff;border-radius:12px;}\n#q{font-size:22px;margin:10px 0;background:rgba(0,0,0,.2);padding:8px 18px;border-radius:8px;}\n#opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:320px;max-width:92vw;margin-top:10px;}\n.opt{font-size:24px;padding:12px;background:#fff;border:none;border-radius:10px;cursor:pointer;color:#2e7d32;font-weight:bold;}\n.opt.ok{background:#2ecc71;color:#fff;}\n.opt.bad{background:#e74c3c;color:#fff;}\n#fb{font-size:18px;margin:10px 0;min-height:22px;}\n\n", "body": "\n<div id=\"bar\">第 1/8 题</div>\n<div id=\"q\"></div>\n<canvas id=\"cv\" width=\"260\" height=\"220\"></canvas>\n<div id=\"opts\"></div>\n<div id=\"fb\"></div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar total=8,round,correct,answer,fig,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;total=(d>=5)?10:8;start();}\nfunction start(){round=0;correct=0;ended=false;gPaused=false;document.getElementById('bar').textContent='第 1/'+total+' 题';nextQ();notifyReady();}\nfunction gen(){\n  var d=gCfg.difficulty||1;\n  var type=d<=2?0:d<=4?1:Math.random()<0.5?2:1;\n  if(type===0){fig={kind:'tri',n:1+Math.floor(Math.random()*3)};answer=fig.n;} // R41:图上真实三角形数=n（n-1条水平线,三角形以顶点为顶、以线为底）\n  else if(type===1){var s=1+Math.floor(Math.random()*3);fig={kind:'square',n:s};answer=s===1?1:s===2?5:14;}\n  else{fig={kind:'cube'};answer=4; // 一个2层的堆\n  }\n  var q={tri:'数一数，图里有几个三角形？',square:'数一数，图里有几个正方形？',cube:'数一数，图里有几个小方块？（被挡住的也算）'}[fig.kind];\n  return q;\n}\nfunction draw(){\n  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');\n  ctx.clearRect(0,0,260,220);\n  ctx.fillStyle='#fff';ctx.fillRect(0,0,260,220);\n  ctx.strokeStyle='#333';ctx.lineWidth=2.5;ctx.fillStyle='#333';\n  if(fig.kind==='tri'){\n    var n=fig.n,base=200,height=160,ox=130,oy=200;\n    for(var i=0;i<=n;i++){\n      var y=oy-height*i/n;\n      ctx.beginPath();ctx.moveTo(ox-base/2,oy);ctx.lineTo(ox+base/2,oy);\n      if(i===0){ctx.moveTo(ox-base/2,oy);ctx.lineTo(ox,oy-height);ctx.lineTo(ox+base/2,oy);}\n      else{ctx.moveTo(ox-base/2*(1-i/n),y);ctx.lineTo(ox+base/2*(1-i/n),y);}\n      ctx.stroke();\n    }\n  }else if(fig.kind==='square'){\n    var s=fig.n,size=170/s,ox=130-size*s/2,oy=110-size*s/2;\n    for(var r=0;r<=s;r++){ctx.beginPath();ctx.moveTo(ox,oy+r*size);ctx.lineTo(ox+s*size,oy+r*size);ctx.stroke();}\n    for(var c=0;c<=s;c++){ctx.beginPath();ctx.moveTo(ox+c*size,oy);ctx.lineTo(ox+c*size,oy+s*size);ctx.stroke();}\n  }else{ // 立方体堆：底层3个，上层中间1个，共4个\n    var u=50,x0=60,y0=160;\n    for(var k=0;k<3;k++){ctx.strokeRect(x0+k*u,y0-u,u,u);}\n    ctx.strokeRect(x0+u,y0-2*u,u,u);\n  }\n}\nfunction nextQ(){\n  if(round>=total){end();return;}\n  round++;\n  document.getElementById('q').textContent=gen();\n  document.getElementById('bar').textContent='第 '+round+'/'+total+' 题';\n  draw();\n  var opts=[answer];\n  while(opts.length<4){var r=answer+Math.floor(Math.random()*9)-4;if(!opts.includes(r)&&r>=1)opts.push(r);}\n  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}\n  var box=document.getElementById('opts');box.innerHTML='';\n  opts.forEach(function(o){var b=document.createElement('button');b.className='opt';if(o===answer)b.dataset.ans='1';b.textContent=o;\n    b.onclick=function(){if(gPaused||ended)return;if(o===answer){correct++;document.getElementById('fb').textContent='对啦！';b.classList.add('ok');}else{b.classList.add('bad');document.getElementById('fb').textContent='正确答案是 '+answer;}\n      box.querySelectorAll('button').forEach(function(x){x.style.pointerEvents='none';});\n      setTimeout(function(){document.getElementById('fb').textContent='';nextQ();},700);};\n    box.appendChild(b);});\n}\nfunction end(){if(ended)return;ended=true;setTimeout(function(){notifyOver(0,true,{correct:correct,total:total});},300);}\nfunction onPause(){}function onResume(){}function handleItem(id){if(id==='remove2')removeTwo();}function removeTwo(){var bs=[].slice.call(document.querySelectorAll('button.opt'));var ws=bs.filter(function(x){return !x.disabled&&x.dataset.ans!=='1';});for(var k=0;k<2&&ws.length;k++){var i=Math.floor(Math.random()*ws.length);var x=ws.splice(i,1)[0];x.disabled=true;x.style.opacity='0.3';x.style.pointerEvents='none';x.style.cursor='default';}}\n\nnotifyReady();\n\n"}, "gomoku": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#e6d8b2,#d4a574);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#4a2c0a;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\ncanvas{background:#f3e5c2;border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.25);}\n.hint{font-size:15px;color:#6d4c2a;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">你下黑棋 ⚫，电脑下白棋 ⚪</div>\n<canvas id=\"cv\" width=\"360\" height=\"360\"></canvas>\n<div class=\"hint\">点棋盘落子，五个连成一线就赢！</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar N=15,board,moves,ended;\nvar aiRandom,aiBlockW,aiAtkW; // 难度→AI强度：简单=随机走，标准=挡3攻2，困难=挡3攻5（抢攻优先）\nvar DIRS=[[1,0],[0,1],[1,1],[1,-1]];\nfunction onConfig(cfg){\n  var d=cfg.difficulty||1;\n  if(d<=2){aiRandom=true;}\n  else if(d<=5){aiRandom=false;aiBlockW=3;aiAtkW=2;}\n  else{aiRandom=false;aiBlockW=3;aiAtkW=5;}\n  start();\n}\nfunction start(){\n  board=[];for(var r=0;r<N;r++)board.push(new Array(N).fill(0));\n  moves=0;ended=false;gPaused=false;\n  var cv=document.getElementById('cv');\n  cv.onclick=function(e){if(ended||gPaused)return;\n    var r=cv.getBoundingClientRect();var cell=360/N;\n    var c=Math.floor((e.clientX-r.left)/cell),rr=Math.floor((e.clientY-r.top)/cell);\n    if(rr<0||rr>=N||c<0||c>=N||board[rr][c])return;\n    board[rr][c]=1;moves++;\n    if(checkWin(rr,c)){end(true);return;}\n    if(isFull()){end(false);return;} // 下满无空位→平局\n    aiMove();\n  };\n  draw();notifyReady();\n}\nfunction isFull(){return moves>=N*N;}\nfunction aiMove(){\n  // 简单难度：AI 随机走，孩子容易赢\n  if(aiRandom){\n    var empty=[];\n    for(var r0=0;r0<N;r0++)for(var c0=0;c0<N;c0++)if(!board[r0][c0])empty.push([r0,c0]);\n    if(!empty.length){end(false);return;} // 下满→平局\n    var p=empty[Math.floor(Math.random()*empty.length)];\n    board[p[0]][p[1]]=2;moves++;\n    if(checkWin(p[0],p[1])){end(false);return;}\n    if(isFull()){end(false);return;}\n    draw();return;\n  }\n  // 标准/困难 AI：优先挡玩家的活三/冲四，其次自己做；困难档抢攻权重更高\n  var best=null,bestScore=-1;\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n    if(board[r][c])continue;\n    var s=0;\n    board[r][c]=1;s+=evalCell(r,c,1)*aiBlockW; // 挡玩家\n    board[r][c]=2;s+=evalCell(r,c,2)*aiAtkW;   // 自己\n    board[r][c]=0;\n    if(s>bestScore){bestScore=s;best=[r,c];}\n  }\n  if(!best){end(false);return;} // 无空位→平局（不再静默悬挂）\n  board[best[0]][best[1]]=2;moves++;\n  if(checkWin(best[0],best[1])){end(false);return;}\n  if(isFull()){end(false);return;} // 下满→平局\n  draw();\n}\nfunction evalCell(r,c,player){\n  var s=0;\n  DIRS.forEach(function(d){\n    var count=1,open=0;\n    for(var i=1;i<5;i++){var nr=r+d[0]*i,nc=c+d[1]*i;if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===player)count++;else{open+=(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===0)?1:0;break;}}\n    for(var j=1;j<5;j++){var nr2=r-d[0]*j,nc2=c-d[1]*j;if(nr2>=0&&nr2<N&&nc2>=0&&nc2<N&&board[nr2][nc2]===player)count++;else{open+=(nr2>=0&&nr2<N&&nc2>=0&&nc2<N&&board[nr2][nc2]===0)?1:0;break;}}\n    if(count>=5)s+=100;\n    else if(count===4&&open>=1)s+=30;\n    else if(count===3&&open>=2)s+=8;\n    else if(count===2)s+=1;\n  });\n  return s;\n}\nfunction checkWin(r,c){\n  var p=board[r][c];\n  return DIRS.some(function(d){\n    var count=1;\n    for(var i=1;i<5;i++){var nr=r+d[0]*i,nc=c+d[1]*i;if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===p)count++;else break;}\n    for(var j=1;j<5;j++){var nr2=r-d[0]*j,nc2=c-d[1]*j;if(nr2>=0&&nr2<N&&nc2>=0&&nc2<N&&board[nr2][nc2]===p)count++;else break;}\n    return count>=5;\n  });\n}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(win?Math.max(0,100-Math.floor(moves/2)):0,win);},400);}\nfunction draw(){\n  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),cell=360/N;\n  ctx.clearRect(0,0,360,360);\n  ctx.fillStyle='#f3e5c2';ctx.fillRect(0,0,360,360);\n  ctx.strokeStyle='#8d6e63';\n  for(var i=0;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell+cell/2,cell/2);ctx.lineTo(i*cell+cell/2,360-cell/2);ctx.stroke();\n    ctx.beginPath();ctx.moveTo(cell/2,i*cell+cell/2);ctx.lineTo(360-cell/2,i*cell+cell/2);ctx.stroke();}\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n    if(board[r][c]){ctx.beginPath();ctx.arc(c*cell+cell/2,r*cell+cell/2,cell*0.4,0,Math.PI*2);ctx.fillStyle=board[r][c]===1?'#111':'#fff';ctx.fill();ctx.strokeStyle=board[r][c]===2?'#999':'transparent';ctx.lineWidth=1;ctx.stroke();}\n  }\n}\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(){}\n\nnotifyReady();\n\n"}, "fifteen": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#134e5e,#71b280);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#board{display:grid;gap:6px;background:rgba(0,0,0,.25);padding:8px;border-radius:12px;}\n.cell{width:66px;height:66px;background:#fff;color:#134e5e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2);}\n.cell.empty{background:transparent;box-shadow:none;cursor:default;}\n.hint{font-size:15px;color:#d5f5e0;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">走了 0 步</div>\n<div id=\"board\"></div>\n<div class=\"hint\">点空格旁边的数字，把它挪进空格，按 1、2、3… 排好</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar N,grid,moves,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;N=(d<=2)?3:4;start();}\nfunction start(){\n  var nums=[];for(var i=1;i<N*N;i++)nums.push(i);nums.push(0);\n  // 打乱（保证可解：逆序对数为偶数）\n  do{\n    for(var j=nums.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=nums[j];nums[j]=nums[k];nums[k]=t;}\n  }while(!solvable(nums));\n  grid=[];var idx=0;\n  for(var r=0;r<N;r++){grid.push([]);for(var c=0;c<N;c++)grid[r].push(nums[idx++]);}\n  moves=0;ended=false;gPaused=false;\n  document.getElementById('bar').textContent='走了 0 步';\n  render();notifyReady();\n}\nfunction solvable(arr){\n  var inv=0,flat=arr.filter(function(v){return v!==0;});\n  for(var i=0;i<flat.length;i++)for(var j=i+1;j<flat.length;j++)if(flat[i]>flat[j])inv++;\n  if(N%2===1)return inv%2===0;\n  var zeroRow=Math.floor(arr.indexOf(0)/N);\n  return (inv+zeroRow)%2===1;\n}\nfunction click(r,c){\n  if(ended||gPaused)return;\n  var er,ec;for(var rr=0;rr<N;rr++)for(var cc=0;cc<N;cc++)if(grid[rr][cc]===0){er=rr;ec=cc;}\n  if(Math.abs(r-er)+Math.abs(c-ec)!==1)return;\n  grid[er][ec]=grid[r][c];grid[r][c]=0;moves++;\n  document.getElementById('bar').textContent='走了 '+moves+' 步';\n  render();\n  if(checkWin()){end(true);}\n}\nfunction checkWin(){\n  var n=1;\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){if(r===N-1&&c===N-1)return grid[r][c]===0;if(grid[r][c]!==n++)return false;}\n  return true;\n}\nfunction render(){\n  var b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+N+',66px)';b.innerHTML='';\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n    var d=document.createElement('div');d.className='cell';\n    if(grid[r][c]===0)d.classList.add('empty');\n    else d.textContent=grid[r][c];\n    (function(rr,cc){d.onclick=function(){click(rr,cc);};})(r,c);\n    b.appendChild(d);\n  }\n}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(Math.max(0,1000-moves*8),win);},400);}\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(){}\n\nnotifyReady();\n\n"}, "idiomchain": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#f55 nd,correct,answer,used,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;total=(d>=5)?10:8;start();}\nfunction start(){round=0;correct=0;ended=false;gPaused=false;used=[];document.getElementById('bar').textContent='第 1/'+total+' 题';nextQ();notifyReady();}\nfunction pick(){\n  if(used.length>=CHAINS.length)used=[];\n  var idx;do{idx=Math.floor(Math.random()*CHAINS.length);}while(used.includes(idx));\n  used.push(idx);\n  return CHAINS[idx];\n}\nfunction nextQ(){\n  if(round>=total){end();return;}\n  round++;\n  var q=pick();answer=q[1];\n  document.getElementById('q').innerHTML='<b>'+q[0]+'</b> 末尾是「'+q[0][q[0].length-1]+'」，接哪个成语？';\n  document.getElementById('bar').textContent='第 '+round+'/'+total+' 题';\n  var opts=[answer];\n  while(opts.length<4){var r=CHAINS[Math.floor(Math.random()*CHAINS.length)][1];if(!opts.includes(r)&&r[0]!==answer[0])opts.push(r);}\n  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}\n  var box=document.getElementById('opts');box.innerHTML='';\n  opts.forEach(function(o){var b=document.createElement('button');b.className='opt';if(o===answer)b.dataset.ans='1';b.textContent=o;\n    b.onclick=function(){if(gPaused||ended)return;if(o===answer){correct++;document.getElementById('fb').textContent='对啦！';b.classList.add('ok');}else{b.classList.add('bad');document.getElementById('fb').textContent='正确答案是 '+answer;}\n      box.querySelectorAll('button').forEach(function(x){x.style.pointerEvents='none';});\n      setTimeout(function(){document.getElementById('fb').textContent='';nextQ();},700);};\n    box.appendChild(b);});\n}\nfunction end(){if(ended)return;ended=true;setTimeout(function(){notifyOver(0,true,{correct:correct,total:total});},300);}\nfunction onPause(){}function onResume(){}function handleItem(id){if(id==='remove2')removeTwo();}function removeTwo(){var bs=[].slice.call(document.querySelectorAll('button.opt'));var ws=bs.filter(function(x){return !x.disabled&&x.dataset.ans!=='1';});for(var k=0;k<2&&ws.length;k++){var i=Math.floor(Math.random()*ws.length);var x=ws.splice(i,1)[0];x.disabled=true;x.style.opacity='0.3';x.style.pointerEvents='none';x.style.cursor='default';}}\n\nnotifyReady();\n\n"}, "pinyin": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#ff9966,#ff5e62);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#q{font-size:80px;margin:14px 0;background:#fff;color:#c0392b;padding:10px 40px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.2);}\n#opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:320px;max-width:92vw;}\n.opt{font-size:28px;padding:16px;background:#fff;border:none;border-radius:12px;cursor:pointer;color:#c0392b;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.15);}\n.opt:active{transform:scale(.95);}\n.opt.ok{background:#2ecc71;color:#fff;}\n.opt.bad{background:#e74c3c;color:#fff;}\n#fb{font-size:18px;margin:14px 0;min-height:24px;}\n\n", "body": "\n<div id=\"bar\">第 1/10 题</div>\n<div id=\"q\"></div>\n<div id=\"opts\"></div>\n<div id=\"fb\"></div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\n// R41:拼音补全四声\nvar BANK=[['妈','mā'],['爸','bà'],['我','wǒ'],['你','nǐ'],['他','tā'],['好','hǎo'],['大','dà'],['小','xiǎo'],['人','rén'],['山','shān'],['水','shuǐ'],['天','tiān'],['上','shàng'],['下','xià'],['日','rì'],['月','yuè'],['口','kǒu'],['手','shǒu'],['车','chē'],['马','mǎ'],['米','mǐ'],['开','kāi'],['门','mén'],['火','huǒ']];\nvar total=10,round,correct,answer,used,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;total=(d>=5)?12:10;start();}\nfunction start(){round=0;correct=0;ended=false;gPaused=false;used=[];document.getElementById('bar').textContent='第 1/'+total+' 题';nextQ();notifyReady();}\nfunction pick(){\n  if(used.length>=BANK.length)used=[];\n  var idx;do{idx=Math.floor(Math.random()*BANK.length);}while(used.includes(idx));\n  used.push(idx);\n  return BANK[idx];\n}\nfunction nextQ(){\n  if(round>=total){end();return;}\n  round++;\n  var q=pick();answer=q[1];\n  document.getElementById('q').textContent=q[0];\n  document.getElementById('bar').textContent='第 '+round+'/'+total+' 题';\n  var opts=[answer];\n  while(opts.length<4){var r=BANK[Math.floor(Math.random()*BANK.length)][1];if(!opts.includes(r))opts.push(r);}\n  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}\n  var box=document.getElementById('opts');box.innerHTML='';\n  opts.forEach(function(o){var b=document.createElement('button');b.className='opt';if(o===answer)b.dataset.ans='1';b.textContent=o;\n    b.onclick=function(){if(gPaused||ended)return;if(o===answer){correct++;document.getElementById('fb').textContent='对啦！';b.classList.add('ok');}else{b.classList.add('bad');document.getElementById('fb').textContent='正确答案是 '+answer;}\n      box.querySelectorAll('button').forEach(function(x){x.style.pointerEvents='none';});\n      setTimeout(function(){document.getElementById('fb').textContent='';nextQ();},650);};\n    box.appendChild(b);});\n}\nfunction end(){if(ended)return;ended=true;setTimeout(function(){notifyOver(0,true,{correct:correct,total:total});},300);}\nfunction onPause(){}function onResume(){}function handleItem(id){if(id==='remove2')removeTwo();}function removeTwo(){var bs=[].slice.call(document.querySelectorAll('button.opt'));var ws=bs.filter(function(x){return !x.disabled&&x.dataset.ans!=='1';});for(var k=0;k<2&&ws.length;k++){var i=Math.floor(Math.random()*ws.length);var x=ws.splice(i,1)[0];x.disabled=true;x.style.opacity='0.3';x.style.pointerEvents='none';x.style.cursor='default';}}\n\nnotifyReady();\n\n"}, "piano": {"style": "\nbody{margin:0;padding:0;background:linear-gradient(135deg,#1a2a6c,#b21f1f);overflow:hidden;font-family:Arial,sans-serif;color:#fff;touch-action:none;}\n#bar{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-around;font-size:20px;font-weight:bold;z-index:5;}\ncanvas{position:fixed;top:0;left:0;}\n.hint{position:fixed;bottom:74px;left:0;right:0;text-align:center;font-size:14px;opacity:.9;}\n\n", "body": "\n<div id=\"bar\"><span>🎹 对了 <span id=\"hit\">0</span></span><span id=\"time\">30</span></div>\n<canvas id=\"cv\"></canvas>\n<div class=\"hint\">音符落到白色横线时，点下面相应的琴键</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar cv,ctx,W,H,NKEYS=8,KEY_W,keyY,notes,hit,miss,total,timeLeft,ended,rafId,spawnTimer,timeTimer,lastT,ac,notesPer;\nvar FREQS=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25];\nvar KEY_NAMES=['C','D','E','F','G','A','B','C'];\nfunction onConfig(cfg){start();}\nfunction start(){\n  cv=document.getElementById('cv');ctx=cv.getContext('2d');\n  W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;\n  KEY_W=W/NKEYS;keyY=H-60;notes=[];hit=0;miss=0;total=0;timeLeft=30;ended=false;gPaused=false;lastT=performance.now();\n  notesPer=(gCfg.difficulty||1)<=2?1:2;\n  document.getElementById('hit').textContent='0';document.getElementById('time').textContent='30';\n  var speed=1.5+0.4*(gCfg.difficulty-1);\n  spawnTimer=setInterval(function(){if(!ended&&!gPaused){for(var i=0;i<notesPer;i++)notes.push({key:Math.floor(Math.random()*NKEYS),y:-40,speed:speed});}},1200);\n  timeTimer=setInterval(function(){if(ended||gPaused)return;timeLeft--;document.getElementById('time').textContent=timeLeft;if(timeLeft<=0){end(true);}},1000);\n  cv.addEventListener('touchstart',function(e){e.preventDefault();var x=e.touches[0].clientX;tapKey(Math.floor(x/KEY_W));},{passive:false});\n  cv.addEventListener('mousedown',function(e){tapKey(Math.floor(e.clientX/KEY_W));});\n  try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}\n  rafId=requestAnimationFrame(loop);notifyReady();\n}\nfunction tapKey(k){\n  if(ended||gPaused)return;\n  if(k<0||k>=NKEYS)return;\n  playNote(FREQS[k]);\n  var found=false;\n  // 找该键在横线附近且未敲过的音符\n  for(var i=0;i<notes.length;i++){var n=notes[i];\n    if(n.key===k&&!n.done&&Math.abs(n.y-keyY)<40){n.done=true;hit++;total++;found=true;break;}\n  }\n  // R41:空点(判定线附近没音符)计一次失误,乱扫琴键不再白拿3星\n  if(!found){miss++;total++;}\n  document.getElementById('hit').textContent=hit;\n}\nfunction playNote(f){\n  try{if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(0.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.5);}catch(e){}\n}\nfunction loop(){\n  if(ended)return;\n  // 暂停时链不断但什么都不做（单链，恢复后不再起新链，音符不会双倍下落、漏击不会重复计）\n  if(gPaused){rafId=requestAnimationFrame(loop);return;}\n  var now=performance.now(),dt=Math.min((now-lastT)/1000,0.05);lastT=now;\n  notes.forEach(function(n){n.y+=n.speed*dt*60;});\n  // 漏掉的（n.done 保证每个音符只计一次 total）\n  notes.forEach(function(n){if(!n.done&&n.y>keyY+40){n.done=true;miss++;total++;}});\n  notes=notes.filter(function(n){return n.y<H+60;});\n  draw();\n  rafId=requestAnimationFrame(loop);\n}\nfunction draw(){\n  ctx.clearRect(0,0,W,H);\n  // 琴键\n  for(var i=0;i<NKEYS;i++){\n    ctx.fillStyle=i%2?'#fff':'#f0f0f0';ctx.fillRect(i*KEY_W,keyY,KEY_W-2,60);\n    ctx.fillStyle='#333';ctx.font='14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';\n    ctx.fillText(KEY_NAMES[i],i*KEY_W+KEY_W/2,keyY+30);\n  }\n  // 横线\n  ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,keyY);ctx.lineTo(W,keyY);ctx.stroke();\n  // 音符\n  notes.forEach(function(n){ctx.fillStyle='#2ecc71';ctx.beginPath();ctx.arc(n.key*KEY_W+KEY_W/2,n.y,12,0,Math.PI*2);ctx.fill();});\n}\nfunction end(win){if(ended)return;ended=true;clearInterval(spawnTimer);clearInterval(timeTimer);cancelAnimationFrame(rafId);setTimeout(function(){notifyOver(0,win,{correct:hit,total:total});},400);}\nfunction onPause(){}function onResume(){lastT=performance.now();} // 只重置计时基准，不起新rAF链（loop单链一直在）\nfunction handleItem(id){if(id==='time_boost'&&!ended){timeLeft+=30;var el=document.getElementById('time');if(el)el.textContent=timeLeft;}} // R41:通用道具·加时30秒\n\nnotifyReady();\n\n"}, "sokoban": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#42275a,#734b6d);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#board{display:grid;gap:2px;}\n.cell{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px;}\n.cell.wall{background:#3e2723;}\n.cell.floor{background:#8d6e63;}\n.cell.goal{background:#ffd54f;}\n#btns{display:grid;grid-template-columns:repeat(3,64px);gap:8px;margin-top:10px;}\n#btns button{height:52px;font-size:24px;border:none;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;}\n.hint{font-size:15px;color:#e1c9ff;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">第 1 关 · 已过关 0</div>\n<div id=\"board\"></div>\n<div id=\"btns\">\n  <button onclick=\"g.move(-1,0)\">↑</button><button onclick=\"g.move(0,-1)\">←</button><button onclick=\"g.move(0,1)\">→</button>\n  <button style=\"grid-column:span 3\" onclick=\"g.move(1,0)\">↓</button>\n</div>\n<button id=\"resetBtn\" style=\"margin-top:8px;padding:6px 16px;font-size:16px;border:none;border-radius:10px;background:#ffd700;color:#42275a;cursor:pointer;\" onclick=\"if(g&&!g.ended&&!gPaused)g.loadLevel()\">🔄 重开本关</button>\n<div class=\"hint\">把箱子 📦 推到金色格子上，全部到位就过关</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar LEVELS=[\n  ['#####','#   #','#@$*#','#   #','#####'],\n  ['######','#    #','# @$ #','# $* #','#  * #','######'],\n  ['#######','#     #','# @$  #','# $ $ #','#  *  #','#  *  #','#######'],\n  // 3 箱关（高难度用）：三箱一排，逐个从上面往下推到金色格即可，必有解\n  ['#######','#     #','# @   #','# $$$ #','# *** #','#######']\n];\nvar g;\nfunction onConfig(cfg){\n  var d=cfg.difficulty||1;\n  // 难度选关卡组：低难度 1箱→2箱小关；标准 全部递增；高难度 2箱→3箱关\n  var pool;\n  if(d<=2)pool=[LEVELS[0],LEVELS[1]];\n  else if(d<=5)pool=[LEVELS[0],LEVELS[1],LEVELS[2]];\n  else pool=[LEVELS[1],LEVELS[2],LEVELS[3]];\n  g=new Sokoban(pool);\n}\nfunction Sokoban(pool){\n  this.levels=pool;\n  this.level=0;this.done=0;this.ended=false;\n  this.loadLevel();\n  this.render();notifyReady();\n}\nSokoban.prototype.loadLevel=function(){\n  var raw=this.levels[Math.min(this.level,this.levels.length-1)].map(function(r){return r.split('');});\n  this.grid=raw.map(function(row){return row.slice();});\n  this.pr=0;this.pc=0;this.boxes=0;this.goals=[];\n  for(var r=0;r<this.grid.length;r++)for(var c=0;c<this.grid[r].length;c++){\n    var ch=this.grid[r][c];\n    if(ch==='@'){this.pr=r;this.pc=c;this.grid[r][c]=' ';}\n    if(ch==='$'){this.boxes++;}\n    if(ch==='*'){this.goals.push([r,c]);}\n    if(ch==='+'){this.pr=r;this.pc=c;this.goals.push([r,c]);this.grid[r][c]=' ';}\n  }\n  document.getElementById('bar').textContent='第 '+(this.level+1)+' 关 · 已过关 '+this.done;\n  this.render();\n};\nSokoban.prototype.move=function(dr,dc){\n  if(this.ended||gPaused)return;\n  var nr=this.pr+dr,nc=this.pc+dc;\n  if(!this.grid[nr]||this.grid[nr][nc]===undefined)return;\n  var ch=this.grid[nr][nc];\n  if(ch==='#')return;\n  if(ch==='$'){\n    var br=nr+dr,bc=nc+dc;\n    if(!this.grid[br]||this.grid[br][bc]===undefined)return;\n    var bc2=this.grid[br][bc];\n    if(bc2==='#'||bc2==='$')return;\n    this.grid[br][bc]='$';this.grid[nr][nc]=' ';\n  }\n  this.pr=nr;this.pc=nc;\n  this.render();\n  this.checkWin();\n};\nSokoban.prototype.checkWin=function(){\n  var all=true;\n  this.goals.forEach(function(g){if(g[0]>=0&&g[1]>=0){var v=this.grid[g[0]][g[1]];if(v!=='$')all=false;}},this);\n  if(all){this.done++;if(this.level<this.levels.length-1){this.level++;this.loadLevel();}else{this.ended=true;setTimeout(function(){notifyOver(this.done*100,true);}.bind(this),400);}}\n};\nSokoban.prototype.render=function(){\n  var b=document.getElementById('board');b.innerHTML='';\n  b.style.gridTemplateColumns='repeat('+this.grid[0].length+',44px)';\n  for(var r=0;r<this.grid.length;r++)for(var c=0;c<this.grid[r].length;c++){\n    var d=document.createElement('div');d.className='cell';\n    var ch=this.grid[r][c];\n    var isGoal=this.goals.some(function(g){return g[0]===r&&g[1]===c;});\n    if(ch==='#')d.className='cell wall';\n    else if(isGoal){d.className='cell goal';if(ch==='$')d.textContent='📦';else if(r===this.pr&&c===this.pc)d.textContent='🐸';}\n    else{d.className='cell floor';if(ch==='$')d.textContent='📦';else if(r===this.pr&&c===this.pc)d.textContent='🐸';}\n    b.appendChild(d);\n  }\n};\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(){}\n\nnotifyReady();\n\n"}, "lightsout": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#232526,#414345);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#board{display:grid;gap:6px;}\n.lamp{width:64px;height:64px;border-radius:50%;background:#2c2f33;border:3px solid #444;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:all .15s;}\n.lamp.on{background:#ffd700;border-color:#ffaa00;box-shadow:0 0 18px rgba(255,215,0,.8);}\n.hint{font-size:15px;color:#aaa;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">走了 0 步</div>\n<div id=\"board\"></div>\n<div class=\"hint\">点一盏灯，它和上下左右的灯都会变亮变灭，全部点亮就赢！</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar N,board,moves,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;N=(d<=2)?4:5;start();}\nfunction start(){\n  // 从全亮随机点N²/2次，保证有解\n  board=[];for(var r=0;r<N;r++)board.push(new Array(N).fill(1));\n  for(var i=0;i<N*N/2;i++){var r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);toggle(r,c);}\n  moves=0;ended=false;gPaused=false;\n  document.getElementById('bar').textContent='走了 0 步';\n  render();notifyReady();\n}\nfunction toggle(r,c){\n  board[r][c]=board[r][c]?0:1;\n  [[-1,0],[1,0],[0,-1],[0,1]].forEach(function(d){var nr=r+d[0],nc=c+d[1];if(nr>=0&&nr<N&&nc>=0&&nc<N)board[nr][nc]=board[nr][nc]?0:1;});\n}\nfunction click(r,c){\n  if(ended||gPaused)return;\n  toggle(r,c);moves++;document.getElementById('bar').textContent='走了 '+moves+' 步';\n  render();\n  if(board.every(function(row){return row.every(function(v){return v===1;});})){end(true);}\n}\nfunction render(){\n  var b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+N+',64px)';b.innerHTML='';\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n    var d=document.createElement('div');d.className='lamp';if(board[r][c])d.classList.add('on');\n    d.textContent='💡';\n    (function(rr,cc){d.onclick=function(){click(rr,cc);};})(r,c);\n    b.appendChild(d);\n  }\n}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(Math.max(0,1000-moves*25),win);},400);}\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(){}\n\nnotifyReady();\n\n"}, "ludo": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#f46b45,#eea849);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#track{display:flex;flex-wrap:wrap;gap:6px;max-width:420px;justify-content:center;}\n.t{width:52px;height:52px;background:rgba(255,255,255,.12);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;}\n.t.goal{background:#ffd700;}\n#dice{font-size:70px;margin:16px 0;background:#fff;color:#e74c3c;border:none;border-radius:16px;padding:6px 30px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2);}\n#msg{font-size:20px;min-height:28px;margin:8px 0;}\n.hint{font-size:15px;color:#ffe0c0;margin-top:6px;}\n\n", "body": "\n<div id=\"bar\">飞行棋</div>\n<div id=\"track\"></div>\n<button id=\"dice\">🎲</button>\n<div id=\"msg\">轮到你啦！掷骰子</div>\n<div class=\"hint\">掷骰子往前走，比小绿棋先到终点就赢！</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar N=24,player,ai,turn,ended,diff,aiSkipChance;\nfunction onConfig(cfg){diff=cfg.difficulty||1;aiSkipChance=Math.max(0.35,0.6-0.025*(diff-1));start();} // R41:AI睡眠概率恒≥0.35,孩子始终有优势,不再纯运气\nfunction start(){\n  player=0;ai=0;turn='p';ended=false;gPaused=false;\n  document.getElementById('dice').onclick=function(){if(ended||gPaused||turn!=='p')return;roll();};\n  render();notifyReady();\n}\nfunction roll(){\n  var n=Math.floor(Math.random()*6)+1;\n  var d=document.getElementById('dice');\n  d.textContent='🎲'+n;\n  var next=Math.min(N,turn==='p'?player+n:ai+n);\n  if(turn==='p'){\n    player=next;\n    document.getElementById('msg').textContent='你掷到 '+n+'，走到 '+player+' 格';\n    if(player>=N){ended=true;setTimeout(function(){notifyOver(100+diff*10,true);},500);return;}\n    turn='a';\n    setTimeout(function(){aiRoll();},900);\n  }\n  render();\n}\nfunction aiRoll(){\n  if(gPaused){setTimeout(aiRoll,500);return;} // R41:暂停/强制休息期间AI不走棋,恢复后继续(延迟重试,避免回合卡死)\n  var n=Math.floor(Math.random()*6)+1;\n  var d=document.getElementById('dice');d.textContent='🤖'+n;\n  if(Math.random()<aiSkipChance){\n    document.getElementById('msg').textContent='小绿棋掷到 '+n+'，但它睡着啦，没走！';\n    turn='p';render();\n    setTimeout(function(){if(!ended)document.getElementById('msg').textContent='轮到你啦！掷骰子';},800);\n    return;\n  }\n  ai=Math.min(N,ai+n);\n  document.getElementById('msg').textContent='小绿棋掷到 '+n+'，走到 '+ai+' 格';\n  if(ai>=N){ended=true;setTimeout(function(){notifyOver(player/ N*100,false);},500);return;}\n  turn='p';\n  document.getElementById('msg').textContent='轮到你啦！掷骰子';\n  render();\n}\nfunction render(){\n  var t=document.getElementById('track');t.innerHTML='';\n  for(var i=0;i<N;i++){\n    var d=document.createElement('div');d.className='t';\n    if(i===N-1)d.classList.add('goal');\n    var content='';\n    if(i===player)content='🔴';\n    if(i===ai)content+=content?'':'';if(i===ai)content+='🟢';\n    if(i===player&&i===ai)content='🔴🟢';\n    d.textContent=content;\n    t.appendChild(d);\n  }\n}\nfunction onPause(){}function onResume(){}function handleItem(){}\n\nnotifyReady();\n\n"}, "compare": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#4776e6,#8e54e9);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#q{font-size:44px;margin:20px 0;font-weight:bold;background:#fff;color:#4a2a8a;padding:22px 40px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.2);display:flex;gap:20px;align-items:center;}\n#opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:320px;max-width:92vw;}\n.opt{font-size:40px;padding:14px;background:#fff;border:none;border-radius:12px;cursor:pointer;color:#4a2a8a;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.15);}\n.opt:active{transform:scale(.95);}\n.opt.ok{background:#2ecc71;color:#fff;}\n.opt.bad{background:#e74c3c;color:#fff;}\n#fb{font-size:18px;margin:14px 0;min-height:24px;}\n\n", "body": "\n<div id=\"bar\">第 1/10 题</div>\n<div id=\"q\"></div>\n<div id=\"opts\"></div>\n<div id=\"fb\"></div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar total=10,round,correct,answer,left,right,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;total=(d>=5)?12:10;start();}\nfunction gen(){\n  var d=gCfg.difficulty||1;\n  var useExpr=d>=5&&Math.random()<0.5;\n  function expr(max){var a=Math.floor(Math.random()*max)+1,b=Math.floor(Math.random()*max)+1;var op=Math.random()<0.5?'+':'-';if(op==='-'){if(b>a){var t=a;a=b;b=t;}return {txt:a+'-'+b,v:a-b};}return {txt:a+'+'+b,v:a+b};}\n  var max=d<=2?10:d<=4?20:100;\n  if(useExpr){left=expr(max);right=expr(max);}else{var na=Math.floor(Math.random()*max)+1,nb=Math.floor(Math.random()*max)+1;left={txt:String(na),v:na};right={txt:String(nb),v:nb};}\n  answer=left.v>right.v?'＞':left.v<right.v?'＜':'＝';\n  return {l:left.txt,r:right.txt};\n}\nfunction start(){round=0;correct=0;ended=false;gPaused=false;document.getElementById('bar').textContent='第 1/'+total+' 题';nextQ();notifyReady();}\nfunction nextQ(){\n  if(round>=total){end();return;}\n  round++;\n  var q=gen();\n  document.getElementById('q').innerHTML='<span>'+q.l+'</span><span>?</span><span>'+q.r+'</span>';\n  document.getElementById('bar').textContent='第 '+round+'/'+total+' 题';\n  var box=document.getElementById('opts');box.innerHTML='';\n  ['＜','＝','＞'].forEach(function(o){var b=document.createElement('button');b.className='opt';if(o===answer)b.dataset.ans='1';b.textContent=o;\n    b.onclick=function(){if(gPaused||ended)return;if(o===answer){correct++;document.getElementById('fb').textContent='对啦！';b.classList.add('ok');}else{b.classList.add('bad');document.getElementById('fb').textContent='正确答案是 '+answer;}\n      box.querySelectorAll('button').forEach(function(x){x.style.pointerEvents='none';});\n      setTimeout(function(){document.getElementById('fb').textContent='';nextQ();},650);};\n    box.appendChild(b);});\n}\nfunction end(){if(ended)return;ended=true;setTimeout(function(){notifyOver(0,true,{correct:correct,total:total});},300);}\nfunction onPause(){}function onResume(){}function handleItem(id){if(id==='remove2')removeTwo();}function removeTwo(){var bs=[].slice.call(document.querySelectorAll('button.opt'));var ws=bs.filter(function(x){return !x.disabled&&x.dataset.ans!=='1';});for(var k=0;k<2&&ws.length;k++){var i=Math.floor(Math.random()*ws.length);var x=ws.splice(i,1)[0];x.disabled=true;x.style.opacity='0.3';x.style.pointerEvents='none';x.style.cursor='default';}}\n\nnotifyReady();\n\n"}, "sudoku": {"style": "\n        body {\n            margin: 0;\n            padding: 20px;\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            min-height: 100vh;\n            font-family: Arial, sans-serif;\n        }\n        .grid {\n            display: grid;\n            gap: 0;\n            background: #2c3e50;\n            padding: 5px;\n            border-radius: 10px;\n            box-shadow: 0 10px 30px rgba(0,0,0,0.3);\n            max-width: 100%;\n            overflow-x: auto;\n        }\n        .cell {\n            width: 44px;\n            height: 44px;\n            border: 1px solid #34495e;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            font-size: 22px;\n            font-weight: bold;\n            background: white;\n            cursor: pointer;\n        }\n        .cell.fixed {\n            background: #ecf0f1;\n            color: #2c3e50;\n            cursor: default;\n        }\n        .cell.error {\n            background: #e74c3c;\n            color: white;\n        }\n        .cell.box-right { border-right: 3px solid #2c3e50; }\n        .cell.box-bottom { border-bottom: 3px solid #2c3e50; }\n        .controls {\n            display: flex;\n            flex-wrap: wrap;\n            justify-content: center;\n            gap: 10px;\n            margin-top: 20px;\n            max-width: 320px;\n        }\n        .controls button {\n            width: 50px;\n            height: 50px;\n            font-size: 20px;\n            font-weight: bold;\n            background: white;\n            border: 2px solid #3498db;\n            border-radius: 8px;\n            cursor: pointer;\n            color: #2c3e50;\n        }\n        .controls button:active {\n            background: #3498db;\n            color: white;\n        }\n        .info {\n            color: white;\n            font-size: 24px;\n            margin-bottom: 20px;\n            font-weight: bold;\n        }\n    \n", "body": "\n    <div class=\"info\" id=\"info\">数独</div>\n    <div class=\"grid\" id=\"grid\"></div>\n    <div class=\"controls\" id=\"controls\"></div>\n\n    \n", "script": "\n        class Sudoku {\n            constructor() {\n                this.grid = [];\n                this.solution = [];\n                this.fixed = [];\n                this.selected = null;\n                this.errors = 0;\n                this.paused = false;\n                this.startTime = Date.now(); // 计时起点（按用时评星）\n                this.pauseAccum = 0; // 暂停累计毫秒\n                this.pauseStart = 0;\n\n                // R27：数独按难度选棋盘大小——难度1~3是3×3、4~7是4×4、8+是6×6\n                // 从 3×3 起步（拉丁方格，只用数字1~3），最难 6×6（2×3宫），不再做9×9\n                const params = new URLSearchParams(location.search);\n                const difficulty = parseInt(params.get('difficulty') || '1', 10);\n                this.applyDifficulty(difficulty);\n\n                this.init();\n            }\n\n            // 难度→棋盘大小（外壳 config 覆盖，1A 适配层）\n            applyDifficulty(difficulty) {\n                if (difficulty <= 3) this.size = 3;   // 3×3 无宫，纯拉丁方格\n                else if (difficulty <= 7) this.size = 4;   // 4×4，2×2宫\n                else this.size = 6;   // 6×6，2×3宫（每宫2行3列）\n            }\n\n            // 当前已用时间（毫秒，暂停不计）\n            elapsedMs() {\n                if (this.paused) return this.pauseAccum;\n                return this.pauseAccum + (Date.now() - this.startTime);\n            }\n\n            init() {\n                this.generatePuzzle();\n                this.render();\n                this.renderControls();\n                this.bindMessages();\n                this.notifyReady();\n            }\n\n            // 响应父窗口暂停/恢复/配置/道具指令\n            bindMessages() {\n                window.addEventListener('message', (e) => {\n                    if (!e.data || typeof e.data !== 'object') return;\n                    const d = e.data;\n                    if (d.type === 'pause') {\n                        this.paused = true;\n                        this.pauseStart = Date.now();\n                    } else if (d.type === 'resume') {\n                        if (this.paused && this.pauseStart) {\n                            this.pauseAccum += Date.now() - this.pauseStart;\n                            this.pauseStart = 0;\n                        }\n                        this.paused = false;\n                    } else if (d.type === 'config') {\n                        // R33-5：打包版不带 URL 参数，config 是难度唯一来源——尺寸变了必须重建棋盘，\n                        // 否则玩着 3×3 盘按 6×6 门槛评星（白送 3 星）+ 数组越界。\n                        // 只重建棋盘不重挂监听（bindMessages 是匿名函数，重挂会翻倍）。\n                        const old = this.size;\n                        this.applyDifficulty((d.data && d.data.difficulty) || 1);\n                        if (this.size !== old) {\n                            this.startTime = Date.now();\n                            this.pauseAccum = 0;\n                            this.pauseStart = 0;\n                            this.generatePuzzle();\n                            this.render();\n                            this.renderControls();\n                        }\n                    } else if (d.type === 'item') {\n                        this.handleItem(d.data && d.data.id);\n                    }\n                });\n            }\n\n            // 局内道具：小提示 = 自动填对一个空格子（用了提示封顶2星，外壳管）\n            handleItem(id) {\n                if (id !== 'hint') return;\n                if (this.paused || this.checkComplete()) return;\n                const empties = [];\n                for (let r = 0; r < this.size; r++) {\n                    for (let c = 0; c < this.size; c++) {\n                        if (!this.fixed[r][c] && this.grid[r][c] === 0) empties.push([r, c]);\n                    }\n                }\n                if (empties.length === 0) return;\n                const [r, c] = empties[Math.floor(Math.random() * empties.length)];\n                this.grid[r][c] = this.solution[r][c];\n                this.fixed[r][c] = true; // 提示填上的格当固定格处理，不再改动\n                this.render();\n                if (this.checkComplete()) this.endGame();\n            }\n\n            // 宫的大小：3×3无宫；4×4是2×2；6×6是2×3（高2宽3）\n            boxSize() {\n                if (this.size === 4) return { h: 2, w: 2 };\n                if (this.size === 6) return { h: 2, w: 3 };\n                return { h: 0, w: 0 }; // 3×3 只查行列\n            }\n\n            generatePuzzle() {\n                const size = this.size;\n                // 生成完整盘\n                this.solution = this.generateSolution();\n\n                // 复制到grid并挖空，每挖一个洞都校验唯一解\n                this.grid = this.solution.map(row => [...row]);\n\n                // 挖空数量：约一半格子供孩子填（简单优先，多留提示）\n                const holes = size === 3 ? 4 : size === 4 ? 6 : 14;\n\n                const allCells = [];\n                for (let r = 0; r < size; r++) {\n                    for (let c = 0; c < size; c++) {\n                        allCells.push([r, c]);\n                    }\n                }\n                this.shuffle(allCells);\n\n                let dug = 0;\n                for (const [r, c] of allCells) {\n                    if (dug >= holes) break;\n                    const backup = this.grid[r][c];\n                    this.grid[r][c] = 0;\n                    // 挖洞后仍唯一解才保留，否则填回（保证孩子填出的合法解就是唯一解）\n                    if (this.countSolutions(this.grid, 1) === 1) {\n                        dug++;\n                    } else {\n                        this.grid[r][c] = backup;\n                    }\n                }\n\n                // 标记固定格子\n                this.fixed = this.grid.map(row => row.map(v => v !== 0));\n            }\n\n            // 统计解的个数（limit控制上限，提前终止加快速度）\n            countSolutions(grid, limit) {\n                const size = this.size;\n                let count = 0;\n                const g = grid.map(row => [...row]);\n\n                const solve = (gg) => {\n                    if (count > limit) return;\n                    const empty = this.findEmpty(gg);\n                    if (!empty) {\n                        count++;\n                        return;\n                    }\n                    const [r, c] = empty;\n                    for (let n = 1; n <= size; n++) {\n                        if (this.isValid(gg, r, c, n)) {\n                            gg[r][c] = n;\n                            solve(gg);\n                            if (count > limit) return;\n                            gg[r][c] = 0;\n                        }\n                    }\n                };\n\n                solve(g);\n                return count;\n            }\n\n            generateSolution() {\n                const size = this.size;\n                const grid = Array(size).fill(null).map(() => Array(size).fill(0));\n                this.fillGrid(grid);\n                return grid;\n            }\n\n            fillGrid(grid) {\n                const empty = this.findEmpty(grid);\n                if (!empty) return true;\n\n                const [r, c] = empty;\n                const size = this.size;\n                const numbers = this.shuffle(Array.from({ length: size }, (_, i) => i + 1));\n\n                for (const num of numbers) {\n                    if (this.isValid(grid, r, c, num)) {\n                        grid[r][c] = num;\n                        if (this.fillGrid(grid)) return true;\n                        grid[r][c] = 0;\n                    }\n                }\n\n                return false;\n            }\n\n            findEmpty(grid) {\n                const size = this.size;\n                for (let r = 0; r < size; r++) {\n                    for (let c = 0; c < size; c++) {\n                        if (grid[r][c] === 0) return [r, c];\n                    }\n                }\n                return null;\n            }\n\n            isValid(grid, row, col, num) {\n                const size = this.size;\n                // 检查行\n                for (let c = 0; c < size; c++) {\n                    if (grid[row][c] === num) return false;\n                }\n\n                // 检查列\n                for (let r = 0; r < size; r++) {\n                    if (grid[r][col] === num) return false;\n                }\n\n                // 检查宫（3×3无宫，跳过）\n                const box = this.boxSize();\n                if (box.h > 0) {\n                    const boxR = Math.floor(row / box.h) * box.h;\n                    const boxC = Math.floor(col / box.w) * box.w;\n                    for (let r = boxR; r < boxR + box.h; r++) {\n                        for (let c = boxC; c < boxC + box.w; c++) {\n                            if (grid[r][c] === num) return false;\n                        }\n                    }\n                }\n\n                return true;\n            }\n\n            shuffle(array) {\n                for (let i = array.length - 1; i > 0; i--) {\n                    const j = Math.floor(Math.random() * (i + 1));\n                    [array[i], array[j]] = [array[j], array[i]];\n                }\n                return array;\n            }\n\n            render() {\n                const size = this.size;\n                const container = document.getElementById('grid');\n                container.innerHTML = '';\n\n                // 按棋盘大小设置列数\n                container.style.gridTemplateColumns = `repeat(${size}, 44px)`;\n\n                const box = this.boxSize();\n\n                for (let r = 0; r < size; r++) {\n                    for (let c = 0; c < size; c++) {\n                        const cell = document.createElement('div');\n                        cell.className = 'cell';\n                        cell.dataset.row = r;\n                        cell.dataset.col = c;\n\n                        if (this.fixed[r][c]) {\n                            cell.classList.add('fixed');\n                        }\n\n                        // 宫边界加粗（最后一行的下边、最后一列的右边不加，让外框圆角干净）\n                        if (box.w > 0 && c % box.w === box.w - 1 && c !== size - 1) {\n                            cell.classList.add('box-right');\n                        }\n                        if (box.h > 0 && r % box.h === box.h - 1 && r !== size - 1) {\n                            cell.classList.add('box-bottom');\n                        }\n\n                        if (this.grid[r][c] !== 0) {\n                            cell.textContent = this.grid[r][c];\n                        }\n\n                        // 检查错误\n                        if (!this.fixed[r][c] && this.grid[r][c] !== 0) {\n                            if (this.grid[r][c] !== this.solution[r][c]) {\n                                cell.classList.add('error');\n                            }\n                        }\n\n                        cell.onclick = () => this.selectCell(r, c);\n\n                        container.appendChild(cell);\n                    }\n                }\n\n                // 标题显示棋盘大小，孩子一眼知道多大盘\n                document.getElementById('info').textContent = `数独 ${size}×${size}`;\n            }\n\n            renderControls() {\n                const container = document.getElementById('controls');\n                const size = this.size;\n\n                // 数字按钮只出 1~size（3×3只用1~3，4×4用1~4，6×6用1~6）\n                for (let i = 1; i <= size; i++) {\n                    const btn = document.createElement('button');\n                    btn.textContent = i;\n                    btn.onclick = () => this.placeNumber(i);\n                    container.appendChild(btn);\n                }\n\n                const clearBtn = document.createElement('button');\n                clearBtn.textContent = '×';\n                clearBtn.onclick = () => this.placeNumber(0);\n                container.appendChild(clearBtn);\n\n                // 认输按钮：孩子卡住时可直接结束本局结算\n                const giveUpBtn = document.createElement('button');\n                giveUpBtn.textContent = '认输';\n                giveUpBtn.style.cssText = 'background:#e74c3c; color:white; border-color:#e74c3c;';\n                giveUpBtn.onclick = () => this.giveUp();\n                container.appendChild(giveUpBtn);\n            }\n\n            // 认输：直接失败结算\n            giveUp() {\n                if (this.paused) return;\n                this.notifyGameOver(false);\n            }\n\n            selectCell(r, c) {\n                if (this.paused || this.fixed[r][c]) return;\n                this.selected = [r, c];\n            }\n\n            placeNumber(num) {\n                if (this.paused || !this.selected) return;\n                const [r, c] = this.selected;\n                if (this.fixed[r][c]) return;\n\n                this.grid[r][c] = num;\n                this.render();\n\n                if (this.checkComplete()) {\n                    this.endGame();\n                }\n            }\n\n            checkComplete() {\n                const size = this.size;\n                for (let r = 0; r < size; r++) {\n                    for (let c = 0; c < size; c++) {\n                        if (this.grid[r][c] === 0) return false;\n                        if (this.grid[r][c] !== this.solution[r][c]) return false;\n                    }\n                }\n                return true;\n            }\n\n            endGame() {\n                setTimeout(() => {\n                    this.notifyGameOver(true);\n                }, 300);\n            }\n\n            notifyReady() {\n                if (window.parent !== window) {\n                    window.parent.postMessage({ type: 'game-ready' }, '*');\n                }\n            }\n\n            // 按用时评星：上报用时和盘大小，分数固定0（外壳按 target 类算星）\n            notifyGameOver(won) {\n                if (window.parent !== window) {\n                    window.parent.postMessage({\n                        type: 'game-over',\n                        data: {\n                            score: 0,\n                            success: won,\n                            extra: { gridSize: this.size, timeMs: this.elapsedMs() }\n                        }\n                    }, '*');\n                }\n            }\n        }\n\n        const game = new Sudoku();\n    \n"}, "synonym": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#4b6cb7,#182848);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#q{font-size:36px;margin:14px 0;background:#fff;color:#1a3a6b;padding:16px 40px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.2);}\n#q small{font-size:18px;display:block;color:#666;}\n#opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:320px;max-width:92vw;}\n.opt{font-size:26px;padding:16px;background:#fff;border:none;border-radius:12px;cursor:pointer;color:#1a3a6b;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.15);}\n.opt:active{transform:scale(.95);}\n.opt.ok{background:#2ecc71;color:#fff;}\n.opt.bad{background:#e74c3c;color:#fff;}\n#fb{font-size:18px;margin:14px 0;min-height:24px;}\n\n", "body": "\n<div id=\"bar\">第 1/10 题</div>\n<div id=\"q\"></div>\n<div id=\"opts\"></div>\n<div id=\"fb\"></div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar ANTONYMS=[['大','小'],['高','矮'],['多','少'],['快','慢'],['白','黑'],['上','下'],['左','右'],['长','短'],['冷','热'],['开','关'],['来','去'],['早','晚'],['新','旧'],['好','坏'],['远','近'],['前','后'],['胖','瘦'],['哭','笑']];\nvar SYNONYMS=[['高兴','开心'],['美丽','漂亮'],['喜欢','喜爱'],['难过','伤心'],['快乐','开心'],['朋友','伙伴'],['道路','马路'],['高兴','快乐']];\nvar total=10,round,correct,answer,used,ended;\nfunction onConfig(cfg){var d=cfg.difficulty||1;total=(d>=5)?12:10;start();}\nfunction start(){round=0;correct=0;ended=false;gPaused=false;used=[];document.getElementById('bar').textContent='第 1/'+total+' 题';nextQ();notifyReady();}\nfunction pick(){\n  var d=gCfg.difficulty||1;\n  var isSyn=(d>=5)&&Math.random()<0.4;\n  var pool=isSyn?SYNONYMS:ANTONYMS;\n  if(used.length>=pool.length)used=[];\n  var idx;do{idx=Math.floor(Math.random()*pool.length);}while(used.includes(idx));\n  used.push(idx);\n  var p=pool[idx];\n  var avoid=[];\n  if(isSyn){SYNONYMS.forEach(function(s){if(s[0]===p[0]&&avoid.indexOf(s[1])<0)avoid.push(s[1]);if(s[1]===p[0]&&avoid.indexOf(s[0])<0)avoid.push(s[0]);});}\n  return {word:p[0],answer:p[1],label:isSyn?'找出「近义词」':'找出「反义词」',avoid:avoid};\n}\nfunction nextQ(){\n  if(round>=total){end();return;}\n  round++;\n  var q=pick();answer=q.answer;\n  document.getElementById('q').innerHTML=q.word+'<small>'+q.label+'</small>';\n  document.getElementById('bar').textContent='第 '+round+'/'+total+' 题';\n  var all=ANTONYMS.concat(SYNONYMS).map(function(p){return p[1];});\n  var opts=[answer];\n  while(opts.length<4){var r=all[Math.floor(Math.random()*all.length)];if(!opts.includes(r)&&q.avoid.indexOf(r)<0)opts.push(r);}\n  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}\n  var box=document.getElementById('opts');box.innerHTML='';\n  opts.forEach(function(o){var b=document.createElement('button');b.className='opt';if(o===answer)b.dataset.ans='1';b.textContent=o;\n    b.onclick=function(){if(gPaused||ended)return;if(o===answer){correct++;document.getElementById('fb').textContent='对啦！';b.classList.add('ok');}else{b.classList.add('bad');document.getElementById('fb').textContent='正确答案是 '+answer;}\n      box.querySelectorAll('button').forEach(function(x){x.style.pointerEvents='none';});\n      setTimeout(function(){document.getElementById('fb').textContent='';nextQ();},650);};\n    box.appendChild(b);});\n}\nfunction end(){if(ended)return;ended=true;setTimeout(function(){notifyOver(0,true,{correct:correct,total:total});},300);}\nfunction onPause(){}function onResume(){}function handleItem(id){if(id==='remove2')removeTwo();}function removeTwo(){var bs=[].slice.call(document.querySelectorAll('button.opt'));var ws=bs.filter(function(x){return !x.disabled&&x.dataset.ans!=='1';});for(var k=0;k<2&&ws.length;k++){var i=Math.floor(Math.random()*ws.length);var x=ws.splice(i,1)[0];x.disabled=true;x.style.opacity='0.3';x.style.pointerEvents='none';x.style.cursor='default';}}\n\nnotifyReady();\n\n"}, "clock": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#ff8008,#ffc837);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\ncanvas{background:#fff;border-radius:50%;box-shadow:0 8px 25px rgba(0,0,0,.25);}\n#opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:300px;max-width:92vw;margin-top:14px;}\n.opt{font-size:26px;padding:14px;background:#fff;border:none;border-radius:12px;cursor:pointer;color:#a0522d;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.15);}\n.opt:active{transform:scale(.95);}\n.opt.ok{background:#2ecc71;color:#fff;}\n.opt.bad{background:#e74c3c;color:#fff;}\n#fb{font-size:18px;margin:10px 0;min-height:24px;}\n\n", "body": "\n<div id=\"bar\">第 1/10 题</div>\n<canvas id=\"cv\" width=\"220\" height=\"220\"></canvas>\n<div id=\"opts\"></div>\n<div id=\"fb\"></div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if .strokeStyle='#e74c3c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(110,110);ctx.lineTo(110+Math.cos(mAngle)*78,110+Math.sin(mAngle)*78);ctx.stroke();\n  ctx.beginPath();ctx.arc(110,110,5,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();\n}\nfunction start(){round=0;correct=0;ended=false;gPaused=false;document.getElementById('bar').textContent='第 1/'+total+' 题';nextQ();notifyReady();}\nfunction nextQ(){\n  if(round>=total){end();return;}\n  round++;\n  var ans=gen();\n  document.getElementById('bar').textContent='第 '+round+'/'+total+' 题';\n  drawClock();\n  var opts=[ans];\n  var pool=[];\n  for(var h=1;h<=12;h++)for(var m=0;m<60;m+=15)pool.push((h===12?12:h)+'点'+(m===0?'整':m+'分')); // R41:干扰项含15/45分\n  while(opts.length<4){var r=pool[Math.floor(Math.random()*pool.length)];if(!opts.includes(r))opts.push(r);}\n  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}\n  var box=document.getElementById('opts');box.innerHTML='';\n  opts.forEach(function(o){var b=document.createElement('button');b.className='opt';if(o===ans)b.dataset.ans='1';b.textContent=o;\n    b.onclick=function(){if(gPaused||ended)return;if(o===ans){correct++;document.getElementById('fb').textContent='对啦！';b.classList.add('ok');}else{b.classList.add('bad');document.getElementById('fb').textContent='正确答案是 '+ans;}\n      box.querySelectorAll('button').forEach(function(x){x.style.pointerEvents='none';});\n      setTimeout(function(){document.getElementById('fb').textContent='';nextQ();},700);};\n    box.appendChild(b);});\n}\nfunction end(){if(ended)return;ended=true;setTimeout(function(){notifyOver(0,true,{correct:correct,total:total});},300);}\nfunction onPause(){}function onResume(){}function handleItem(id){if(id==='remove2')removeTwo();}function removeTwo(){var bs=[].slice.call(document.querySelectorAll('button.opt'));var ws=bs.filter(function(x){return !x.disabled&&x.dataset.ans!=='1';});for(var k=0;k<2&&ws.length;k++){var i=Math.floor(Math.random
