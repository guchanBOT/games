=e.target;\n    if(!t.classList.contains('cell'))return;\n    var r=+t.dataset.r,c=+t.dataset.c;\n    if(sel===null){sel=[r,c];t.classList.add('sel');return;}\n    var sr=sel[0],sc=sel[1];\n    var adj=Math.abs(r-sr)+Math.abs(c-sc)===1;\n    if(adj&&grid[sr][sc]===grid[r][c]&&grid[r][c]!==0){\n      grid[sr][sc]=grid[r][c]*2;grid[r][c]=0;score+=grid[sr][sc];\n      document.getElementById('bar').textContent='得分: '+score;\n      gravity();sel=null;render();\n      if(score>=1200){end(true);return;}\n      if(!hasMove())end(false);\n    }else{\n      document.querySelector('.cell.sel')&&document.querySelector('.cell.sel').classList.remove('sel');\n      sel=[r,c];t.classList.add('sel');\n    }\n  };\n  render();notifyReady();\n}\nfunction gravity(){\n  for(var c=0;c<N;c++){\n    var col=[];\n    for(var r=N-1;r>=0;r--)if(grid[r][c]!==0)col.push(grid[r][c]);\n    while(col.length<N)col.push(0);\n    for(var r2=0;r2<N;r2++)grid[r2][c]=col[N-1-r2];\n  }\n}\nfunction hasMove(){\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n    if(grid[r][c]===0)continue;\n    if(c<N-1&&grid[r][c]===grid[r][c+1])return true;\n    if(r<N-1&&grid[r][c]===grid[r+1][c])return true;\n  }\n  return false;\n}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(score,win);},400);}\nfunction render(){\n  var b=document.getElementById('board');\n  b.innerHTML='';\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n    var t=document.createElement('div');t.className='cell';t.dataset.r=r;t.dataset.c=c;\n    var v=grid[r][c];\n    if(v){t.textContent=v;t.style.background=COLORS[v]||'#e74c3c';t.style.color=v>=128?'#fff':'#2c3e50';}\n    else{t.style.background='rgba(255,255,255,0.08)';}\n    if(sel&&sel[0]===r&&sel[1]===c)t.classList.add('sel');\n    b.appendChild(t);\n  }\n}\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(){}\n\nnotifyReady();\n\n"}, "onestroke": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#1c92d2,#f2fcfe);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#333;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\ncanvas{background:#fff;border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.15);}\n.hint{font-size:15px;color:#4a7ba6;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">还差 0 条线段</div>\n<canvas id=\"cv\" width=\"360\" height=\"360\"></canvas>\n<div><button id=\"redoBtn\" onclick=\"restart()\" style=\"margin-top:10px;font-size:16px;padding:8px 24px;border:none;border-radius:8px;background:#1c92d2;color:#fff;cursor:pointer;\">🔄 重开本局</button></div>\n<div class=\"hint\">从起点出发，点下一个点连线，不能重复走，把整幅图一笔连完</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar points,edges,used,cur,ended,startNode;\nfunction onConfig(cfg){start();}\nfunction start(){\n  var n=(gCfg.difficulty<=2)?5:(gCfg.difficulty<=5?7:9);\n  // 生成点的位置（环上分布）\n  points=[];for(var i=0;i<n;i++){var a=Math.PI*2*i/n;points.push({x:180+Math.cos(a)*130,y:180+Math.sin(a)*130});}\n  // 随机生成可一笔画的图（奇度点<=2）\n  do{genEdges(n);}while(oddCount()>2);\n  used={};startNode=findStart();cur=startNode;ended=false;gPaused=false;\n  document.getElementById('bar').textContent='还差 '+(edges.length-Object.keys(used).length)+' 条线段';\n  var cv=document.getElementById('cv');\n  cv.onclick=function(e){if(ended||gPaused)return;var r=cv.getBoundingClientRect();var x=e.clientX-r.left,y=e.clientY-r.top;\n    var best=-1,bd=99999;\n    for(var i=0;i<points.length;i++){var d=Math.hypot(points[i].x-x,points[i].y-y);if(d<bd){bd=d;best=i;}}\n    if(bd<25)tryMove(best);\n  };\n  draw();notifyReady();\n}\nfunction genEdges(n){\n  edges=[];var p=[];\n  for(var i=0;i<n;i++)p.push(i);\n  for(var j=n-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=p[j];p[j]=p[k];p[k]=t;}\n  for(var x=0;x<n-1;x++)edges.push([p[x],p[x+1]]);\n  // 加几条弦，增加趣味（保证不重复）\n  var chords=Math.floor(n/3);\n  for(var c=0;c<chords;c++){var a=Math.floor(Math.random()*n),b=Math.floor(Math.random()*n);\n    if(a!==b&&!edges.some(function(e){return (e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a);}))edges.push([a,b]);}\n}\nfunction oddCount(){\n  var deg={};\n  edges.forEach(function(e){deg[e[0]]=(deg[e[0]]||0)+1;deg[e[1]]=(deg[e[1]]||0)+1;});\n  return Object.values(deg).filter(function(d){return d%2===1;}).length;\n}\n// 选合法起点：有奇度点必须从奇度点出发，全偶则任意（取0）\nfunction findStart(){\n  var deg={};\n  edges.forEach(function(e){deg[e[0]]=(deg[e[0]]||0)+1;deg[e[1]]=(deg[e[1]]||0)+1;});\n  var odds=Object.keys(deg).filter(function(k){return deg[k]%2===1;});\n  return odds.length?+odds[0]:0;\n}\nfunction restart(){\n  if(ended||gPaused)return;\n  used={};cur=startNode;\n  document.getElementById('bar').textContent='还差 '+(edges.length-Object.keys(used).length)+' 条线段';\n  draw();\n}\nfunction tryMove(i){\n  var key=Math.min(cur,i)+','+Math.max(cur,i);\n  if(cur===i)return;\n  if(!edges.some(function(e){return (e[0]===cur&&e[1]===i)||(e[0]===i&&e[1]===cur);}))return;\n  if(used[key])return;\n  used[key]=true;cur=i;\n  document.getElementById('bar').textContent='还差 '+(edges.length-Object.keys(used).length)+' 条线段';\n  draw();\n  if(Object.keys(used).length===edges.length){end(true);}\n}\nfunction draw(){\n  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');\n  ctx.clearRect(0,0,360,360);\n  ctx.fillStyle='#fff';ctx.fillRect(0,0,360,360);\n  // 未用的边\n  ctx.strokeStyle='#b0bec5';ctx.lineWidth=3;\n  edges.forEach(function(e){if(!used[e[0]+','+e[1]]&&!used[e[1]+','+e[0]]){ctx.beginPath();ctx.moveTo(points[e[0]].x,points[e[0]].y);ctx.lineTo(points[e[1]].x,points[e[1]].y);ctx.stroke();}});\n  // 用过的边\n  ctx.strokeStyle='#2ecc71';ctx.lineWidth=4;\n  Object.keys(used).forEach(function(key){var p=key.split(',');ctx.beginPath();ctx.moveTo(points[+p[0]].x,points[+p[0]].y);ctx.lineTo(points[+p[1]].x,points[+p[1]].y);ctx.stroke();});\n  // 点\n  points.forEach(function(p,i){ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.fillStyle=i===cur?'#e74c3c':'#3498db';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();});\n}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(win?300:0,win);},400);}\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(){}\n\nnotifyReady();\n\n"}, "match3": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#ffb75e,#ed8f03);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;}\n#bar{font-size:20px;font-weight:bold;margin:6px 0;}\n#board{display:grid;gap:3px;background:rgba(0,0,0,.2);padding:6px;border-radius:10px;}\n.cell{width:38px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;}\n.cell.sel{outline:3px solid #fff;}\n.hint{font-size:15px;color:#fff3e0;margin-top:8px;}\n\n", "body": "\n<div id=\"bar\">得分: 0</div>\n<div id=\"board\"></div>\n<div class=\"hint\">点一个糖果，再点旁边换位置，三个一样的排一排就消掉</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\nvar N,grid,score,sel,ended;\nvar EMO=['🍎','🍌','🍉','🍇','🍊','🍓'];\nfunction onConfig(cfg){var d=cfg.difficulty||1;N=(d<=2)?6:(d<=5?7:8);start();}\nfunction start(){\n  do{grid=[];for(var r=0;r<N;r++){grid.push([]);for(var c=0;c<N;c++)grid[r].push(EMO[Math.floor(Math.random()*EMO.length)]);}}while(hasMatch()||!hasAnyMove());\n  score=0;sel=null;ended=false;gPaused=false;\n  document.getElementById('bar').textContent='得分: 0';\n  var b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+N+',38px)';b.innerHTML='';\n  render();notifyReady();\n}\nfunction hasMatch(){\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n    if(c<N-2&&grid[r][c]===grid[r][c+1]&&grid[r][c+1]===grid[r][c+2])return true;\n    if(r<N-2&&grid[r][c]===grid[r+1][c]&&grid[r+1][c]===grid[r+2][c])return true;\n  }\n  return false;\n}\n// 全局是否还有合法交换（换后能消除）：试所有相邻对\nfunction hasAnyMove(){\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n    for(var k=0;k<2;k++){\n      var r2=r+(k===0?0:1),c2=c+(k===0?1:0);\n      if(r2>=N||c2>=N)continue;\n      var t=grid[r][c];grid[r][c]=grid[r2][c2];grid[r2][c2]=t;\n      var ok=hasMatch();\n      t=grid[r][c];grid[r][c]=grid[r2][c2];grid[r2][c2]=t; // 换回\n      if(ok)return true;\n    }\n  }\n  return false;\n}\n// 死局重排：打乱现有棋子直到无直接消除且至少存在一个合法交换（设上限防死循环）\nfunction reshuffle(){\n  var guard=0;\n  do{\n    var flat=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)flat.push(grid[r][c]);\n    for(var i=flat.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=flat[i];flat[i]=flat[j];flat[j]=t;}\n    for(var r2=0;r2<N;r2++)for(var c2=0;c2<N;c2++)grid[r2][c2]=flat[r2*N+c2];\n    guard++;\n  }while((hasMatch()||!hasAnyMove())&&guard<200);\n}\nfunction click(r,c){\n  if(ended||gPaused)return;\n  if(sel===null){sel=[r,c];render();return;}\n  if(sel[0]===r&&sel[1]===c){sel=null;render();return;}\n  var sr=sel[0],sc=sel[1];\n  sel=null;\n  if(Math.abs(r-sr)+Math.abs(c-sc)!==1){render();return;}\n  var t=grid[sr][sc];grid[sr][sc]=grid[r][c];grid[r][c]=t;\n  if(!hasMatch()){\n    t=grid[sr][sc];grid[sr][sc]=grid[r][c];grid[r][c]=t; // 换回\n  }else{\n    resolve();\n  }\n  render();\n}\nfunction resolve(){\n  var cleared=true,guard=0;\n  while(cleared&&guard<50){\n    cleared=false;guard++;\n    var toRemove=new Set();\n    for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n      if(c<N-2&&grid[r][c]===grid[r][c+1]&&grid[r][c+1]===grid[r][c+2]){for(var k=0;k<3;k++)toRemove.add(r+','+(c+k));}\n      if(r<N-2&&grid[r][c]===grid[r+1][c]&&grid[r+1][c]===grid[r+2][c]){for(var k2=0;k2<3;k2++)toRemove.add((r+k2)+','+c);}\n    }\n    if(toRemove.size){cleared=true;score+=toRemove.size*10;document.getElementById('bar').textContent='得分: '+score;if(score>=1800){end(true);return;}}\n    toRemove.forEach(function(key){var p=key.split(',');grid[+p[0]][+p[1]]=null;});\n    for(var cc=0;cc<N;cc++){var col=[];for(var rr=N-1;rr>=0;rr--)if(grid[rr][cc])col.push(grid[rr][cc]);while(col.length<N)col.push(EMO[Math.floor(Math.random()*EMO.length)]);for(var rr2=0;rr2<N;rr2++)grid[rr2][cc]=col[N-1-rr2];}\n  }\n  if(score>=1800&&!ended){end(true);return;}\n  // 补子后可能无合法交换（死局）→ 重排到至少有一步可走\n  if(!ended&&!hasAnyMove())reshuffle();\n}\nfunction render(){\n  var b=document.getElementById('board');b.innerHTML='';\n  for(var r=0;r<N;r++)for(var c=0;c<N;c++){\n    var d=document.createElement('div');d.className='cell';\n    if(grid[r][c]){d.textContent=grid[r][c];d.style.background='rgba(255,255,255,.2)';}\n    if(sel&&sel[0]===r&&sel[1]===c)d.classList.add('sel');\n    (function(rr,cc){d.onclick=function(){click(rr,cc);};})(r,c);\n    b.appendChild(d);\n  }\n}\nfunction end(win){if(ended)return;ended=true;setTimeout(function(){notifyOver(score,win);},400);}\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(){}\n\nnotifyReady();\n\n"}, "idiomblank": {"style": "\nbody{margin:0;padding:10px;background:linear-gradient(135deg,#f7971e,#ffd200);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;}\n#bar{font-size:20px;font-weight:bold;color:#5d3a1a;margin:6px 0;}\n#q{font-size:34px;margin:20px 0;font-weight:bold;color:#5d3a1a;letter-spacing:6px;background:#fff;padding:20px 30px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.2);}\n#opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:320px;max-width:92vw;}\n.opt{font-size:26px;padding:16px;background:#fff;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15);color:#5d3a1a;font-weight:bold;}\n.opt:active{transform:scale(.95);}\n.opt.ok{background:#2ecc71;color:#fff;}\n.opt.bad{background:#e74c3c;color:#fff;}\n#fb{font-size:18px;margin:14px 0;min-height:24px;color:#5d3a1a;}\n\n", "body": "\n<div id=\"bar\">第 1/10 题</div>\n<div id=\"q\"></div>\n<div id=\"opts\"></div>\n<div id=\"fb\"></div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.postMessage({type:'game-over',data:{score:score,success:!!success,extra:extra||{}}},'*');}\n\n// 常见成语词库（小学一年级常见）\nvar BANK=[\n  '一心一意','十全十美','三心二意','四面八方','五颜六色','七上八下','九牛一毛','百花齐放',\n  '春暖 ment.getElementById('fb').textContent='';nextQ();},700);};\n    box.appendChild(b);\n  });\n}\nfunction end(){if(ended)return;ended=true;setTimeout(function(){notifyOver(0,true,{correct:correct,total:total});},300);}\nfunction onPause(){}\nfunction onResume(){}\nfunction handleItem(id){if(id==='remove2')removeTwo();}function removeTwo(){var bs=[].slice.call(document.querySelectorAll('button.opt'));var ws=bs.filter(function(x){return !x.disabled&&x.dataset.ans!=='1';});for(var k=0;k<2&&ws.length;k++){var i=Math.floor(Math.random()*ws.length);var x=ws.splice(i,1)[0];x.disabled=true;x.style.opacity='0.3';x.style.pointerEvents='none';x.style.cursor='default';}}\n\nnotifyReady();\n\n"}, "fruitninja": {"style": "\nbody{margin:0;padding:0;background:linear-gradient(135deg,#1a2a6c,#b21f1f);overflow:hidden;font-family:Arial,sans-serif;color:#fff;}\n#bar{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-around;font-size:22px;font-weight:bold;z-index:5;}\ncanvas{position:fixed;top:0;left:0;}\n.hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:15px;opacity:.9;}\n\n", "body": "\n<div id=\"bar\"><span>✂️ <span id=\"score\">0</span></span><span id=\"time\">30</span><span>❤️ <span id=\"lives\">3</span></span></div>\n<canvas id=\"cv\"></canvas>\n<div class=\"hint\">手指划过去切水果，炸弹千万别切！</div>\n\n", "script": "\nvar gCfg={difficulty:1},gPaused=false;\nwindow.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;var d=e.data;\nif(d.type==='config'){gCfg.difficulty=(d.data&&d.data.difficulty)||1;onConfig(gCfg);}\nelse if(d.type==='pause'){gPaused=true;onPause();}\nelse if(d.type==='resume'){gPaused=false;onResume();}\nelse if(d.type==='item'){handleItem(d.data&&d.data.id);}});\nfunction notifyReady(){if(window.__readySent)return;window.__readySent=true;if(window.parent!==window)window.parent.postMessage({type:'game-ready'},'*');}\nfunction notifyOver(score,success,extra){if(window.parent!==window)window.parent.pos const HOUSES = {"1": "云的家", "11": "雨的家", "21": "雾的家", "31": "风的家", "41": "雪的家", "51": "雷电的家", "61": "霜的家", "71": "彩虹的家", "81": "星空的家", "91": "太阳的家"};
const LS_KEY = 'sky100_test_v1';
let results = {};
try { results = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e) { results = {}; }
let current = null;

function save() { localStorage.setItem(LS_KEY, JSON.stringify(results)); }

function loadEmbeddedGame(gameId) {
    const game = EMBEDDED_GAMES[gameId];
    const iframe = document.getElementById('gameFrame');
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    const safeScript = game.script.replace(/<\/script>/gi, '<\\/script>');
    const html = [
        '<!DOCTYPE html><html><head><meta charset="UTF-8">',
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
        '<style>', game.style, '</style></head><body>',
        game.body,
        '<scr', 'ipt>', safeScript, '</scr', 'ipt>',
        '</body></html>'
    ].join('');
    doc.open(); doc.write(html); doc.close();
}

function sendConfig() {
    if (!current) return;
    const iframe = document.getElementById('gameFrame');
    iframe.contentWindow.postMessage({
        type: 'config', difficulty: current.tier,
        starThresholds: {}, items: []
    }, '*');
}

function launch(key) {
    const row = PLAN.find(r => r.key === key);
    if (!row) return;
    current = row;
    document.getElementById('barTitle').textContent = row.label + ' · ' + row.name;
    document.getElementById('barResult').textContent = '（玩完一局这里显示结算数据）';
    document.getElementById('overlay').style.display = 'flex';
    loadEmbeddedGame(row.id);
    setTimeout(sendConfig, 400);   // 有的游戏不发 game-ready，兜底发一次
}

document.getElementById('backBtn').onclick = () => {
    document.getElementById('overlay').style.display = 'none';
    const iframe = document.getElementById('gameFrame');
    iframe.contentDocument.open(); iframe.contentDocument.write(''); iframe.contentDocument.close();
    current = null;
};

window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || !d.type) return;
    if (d.type === 'game-ready') { sendConfig(); return; }
    if (d.type === 'game-over' && current) {
        const data = d.data || {};
        const ok = data.success !== false;
        const extra = data.extra ? ' ' + JSON.stringify(data.extra) : '';
        document.getElementById('barResult').textContent =
            (ok ? '✅ 过关' : '❌ 失败') + '　分数: ' + (data.score ?? '—') + extra;
        results[current.key] = { ok, score: data.score ?? null, t: Date.now() };
        save(); render();
    }
});

function render() {
    const filter = document.getElementById('filter').value;
    const tb = document.getElementById('tbody');
    tb.innerHTML = '';
    let done = 0;
    for (const r of PLAN) {
        if (results[r.key]) done++;
    }
    for (const r of PLAN) {
        const res = results[r.key];
        if (filter === 'todo' && res) continue;
        if (r.house) {
            const tr = document.createElement('tr');
            tr.className = 'house';
            tr.innerHTML = '<td colspan="5">' + r.house + '</td>';
            tb.appendChild(tr);
        }
        const tr = document.createElement('tr');
        tr.className = (r.kind === 'test' ? 'test ' : r.kind === 'window' ? 'window ' : '') + (res ? 'done' : '');
        let tags = '';
        if (r.kind === 'test') tags += '<span class="tag tag-test">考验</span>';
        if (r.kind === 'window') tags += '<span class="tag tag-window">小窗户</span>';
        if (r.tier === 2) tags += '<span class="tag tag-2">升档</span>';
        const st = res
            ? '<span class="st">' + (res.ok ? '✅' : '❌') + ' ' + (res.score ?? '') + '</span>'
            : '<span class="st" style="color:#aaa">未测</span>';
        tr.innerHTML = '<td>' + r.label + '</td><td>' + r.name + tags + '</td><td>' + r.cat +
                       '</td><td>' + st + '</td>' +
                       '<td><button class="play" data-key="' + r.key + '">开始</button></td>';
        tb.appendChild(tr);
    }
    document.getElementById('doneCount').textContent = done;
    document.getElementById('prog').style.width = (done / PLAN.length * 100) + '%';
    tb.querySelectorAll('.play').forEach(b => b.onclick = () => launch(b.dataset.key));
}

document.getElementById('filter').onchange = render;
document.getElementById('resetBtn').onclick = () => {
    if (confirm('清空全部测试记录？')) { results = {}; save(); render(); }
};
render();
</script>
