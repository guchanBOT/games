<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 测试区（家长自用）</title>
<style>
  body {
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#2d2a26; margin:0; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none;
  }
  h1 { color:#f9f6f2; margin:40px 0 8px; font-size:36px; }
  .warn {
    color:#ffca28; font-size:14px; margin:0 24px 6px; text-align:center; line-height:1.6;
  }
  .hint { color:#a89a8c; font-size:13px; margin:0 24px 22px; text-align:center; }
  .grid {
    display:grid; gap:16px; width:min(92vw, 560px);
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  }
  a.card {
    background:#fff; border-radius:16px; padding:22px 12px;
    text-align:center; text-decoration:none; color:#2d2a26;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
    transition:transform .15s;
  }
  a.card:active { transform:scale(.94); }
  a.card div { margin-top:10px; font-weight:700; font-size:17px; }
  a.card .tag {
    display:inline-block; margin-top:6px; font-size:11px; color:#ffca28;
    background:#2d2a26; border-radius:8px; padding:2px 8px;
  }
</style>
</head>
<body>
  <h1>🧪 测试区</h1>
  <p class="warn">家长自用，尚未完成、别让孩子点进来。</p>
  <p class="hint">这个页面没有从"游戏大厅"链接出去，只有知道网址的人才进得来。</p>
  <div class="grid">
    <!-- 每个预览单元一张卡片。规则：/test 一级不放游戏本体；目录名 = 待发布包名（test/<包名>/）。 -->
    <a class="card" href="./v2-accounts/">
      <span style="font-size:44px">🧩</span>
      <div>多用户云存档 · 预览</div>
      <span class="tag">账号登录 / 换孩子 / 跨设备</span>
    </a>
    <a class="card" href="./sky100/">
      <span style="font-size:44px">🏗️</span>
      <div>天空100层·测试台</div>
      <span class="tag">66 游戏选关全测</span>
    </a>
    <a class="card" href="./villa-audio/">
      <span style="font-size:44px">🎧</span>
      <div>梦幻大别墅 · 音效试听</div>
      <span class="tag">26 事件 × 2~3 候选</span>
    </a>
  </div>
</body>
</html>
