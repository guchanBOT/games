<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">

<title>数字跑酷</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#7ec8f7;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #game{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;
    display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;
    color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.35);
    font-weight:900;font-size:27px}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(20,30,50,.55);color:#fff;text-align:center;z-index:10}
  .hidden{display:none!important}
  button{font-size:24px;padding:16px 52px;border:none;border-radius:999px;
    background:#ffb300;color:#5d3800;font-weight:900;box-shadow:0 5px 0 #c98a00;margin:10px}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #c98a00}
  button:disabled{opacity:.45}
  button.small{font-size:18px;padding:12px 26px}
  button.ghost{background:#eceff1;color:#37474f;box-shadow:0 4px 0 #b0bec5}

  .stars{font-size:60px;letter-spacing:12px;margin:12px 0;min-height:70px}
  .tip{opacity:.95;margin-bottom:10px;font-size:20px;font-weight:700;
    text-shadow:0 1px 4px rgba(0,0,0,.4)}
</style>

<body>
<div id="game"><canvas id="cv"></canvas></div>
<div class="hud"><div id="hudLevel">第 1 关</div><div id="hudCoin">🪙 0</div><div id="hudTime">⏱ 30 分钟</div><div id="hudCount">👥 5</div></div>

<div id="lock" class="overlay hidden">
  <div class="big">今天已经玩够 30 分钟啦</div>

<div id="menu" class="overlay">
  <div style="display:flex;align-items:center;gap:20px">
    <button id="btnPrevLv" class="ghost small" style="margin:0">◀</button>
    <div class="big" id="menuTitle">第 1 关</div>

  </div>
  <div id="lvPicker" style="display:none;margin-top:4px;max-width:min(92vw,660px);text-align:center">

    <div id="lvChips" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-height:110px;overflow-y:auto"></div>
  </div>
  <div id="menuStars" class="stars"></div>
  <div class="tip">移动鼠标 / 滑动手指 / 按住 ← →<br>选更划算的门，带最多小人冲过终点！</div>
  <div id="menuCoins" style="font-size:28px;font-weight:900"></div>
  <button id="btnStart">开 始</button>
  <button id="btnUp" class="ghost small"></button>

  <button id="btnCoinUndo" class="ghost small" style="display:none"></button>
  <div style="margin-top:14px;text-align:center">
    <div style="font-size:14px;font-weight:700;color:#776e65;margin-bottom:6px">小人颜色</div>
    <div id="palette" style="display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:88vw"></div>
    <div id="palHint" style="font-size:12px;color:#a89a8c;margin-top:6px"></div>
  </div>
  <div style="margin-top:10px;text-align:center">
    <div style="font-size:14px;font-weight:700;color:#776e65;margin-bottom:6px">头上戴的</div>
    <div id="hatPal" style="display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:88vw"></div>
    <div id="hatHint" style="font-size:12px;color:#a89a8c;margin-top:6px"></div>
  </div>

</div>

  <div class="big" id="resTitle">太棒了！</div>
  <div class="stars" id="resStars"></div>
  <div id="resInfo" style="font-size:27px;margin-bottom:6px;font-weight:800"></div>
  <button id="btnNext">下一关</button>
  <button id="btnRetry" class="ghost">再玩一次</button>
</div>

<script>
'use strict';
/* ================= 基础 ================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

if(!ctx.roundRect){
  ctx.roundRect = function(x,y,w,h,r){ r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); };
}

/* 固定种子的随机数：同一关每次生成完全一样 */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

/* ================= 音效（简单蜂鸣，无音频文件） ================= */
let AC = null;
function beep(f, dur, type, g){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    gn.gain.setValueAtTime(g || 0.12, AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + (dur || 0.12));
    o.connect(gn); gn.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (dur || 0.12));
  }catch(e){}
}
const sndGood = ()=>{ beep(620,.1,'triangle'); setTimeout(()=>beep(880,.12,'triangle'),70); };
const sndBad  = ()=>beep(170,.25,'sawtooth',.1);
const sndWin  = ()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*110));

/* ================= 关卡配方 ================= */
function diffOf(n){
  return {
    maxAdd : Math.min(55, Math.round(12 + n*2.4)),   // 加法数字上限（增长放缓）
    pairs  : Math.min(18, 6 + n),              // 门的对数（少一点，节奏慢一点）
    gap    : Math.max(150, Math.round(196 - n*1.6)), // 门间距（缩得更慢）
    sub    : n >= 3,                           // 减法出现
    mul    : n >= 5,                           // ×2 出现
    mul3   : n >= 9,                           // ×3 出现
    div    : n >= 12,                          // ÷2 出现（对齐原版：除法基本只有 ÷2）
    gate3  : n >= 18 ? (n >= 26 ? 0.5 : 0.28) : 0,  // 一部分门变“三选一”
    super  : n >= 22,                          // 少量超大门 ×4
    fork   : n >= 20,                          // 陷阱可能升级成“岔路”：多一个不变选项
    trap   : n >= 14 ? 0.18 : 0,               // “两边都亏”陷阱对概率
    rnd    : n >= 9 ? 0.15 : 0,                // “?”惊喜门概率
    mv     : n >= 12,                          // 障碍会左右移动
    obs    : n >= 5 ? Math.min(4, 1 + Math.floor(n/5)) : 0, // 障碍数量上限
    obsDmg : 3 + Math.floor(n/4),              // 障碍伤害涨得慢
    enemies: n >= 8 ? (n >= 18 ? 2 : 1) : 0,   // 敌方队伍数量（越后越多）
    speed  : Math.min(1.45, 0.92 + n*0.035),   // 速度爬得更平缓
  };
}
function applyOp(n, op){
  if(op.t==='rnd'){                       // “?”门：碰了才知道
    const r = Math.random();
    if(r < 0.35) return n * 2;
    if(r < 0.6)  return n + 20 + Math.floor(Math.random()*20);
    if(r < 0.8)  return Math.max(1, Math.floor(n / 2));
    return Math.max(1, n - (5 + Math.floor(Math.random()*10)));
  }
  if(op.t==='pass') return n;             // 岔路口的“直行”门：人不变
  if(op.t==='add') return n + op.v;
  if(op.t==='sub') return n - op.v;
  if(op.t==='mul') return n * op.v;
  return Math.floor(n / op.v);
}
function opLabel(op){
  return op.t==='rnd' ? '?' :
         op.t==='pass' ? '不变' :
         op.t==='add' ? '+'+op.v : op.t==='sub' ? '−'+op.v :
         op.t==='mul' ? '×'+op.v : '÷'+op.v;
}
const isBad = op => op.t==='sub' || op.t==='div';

function genLevel(n, up){
  const d = diffOf(n), R = mulberry32(n*7919 + 13);
  const ri = (a,b)=> a + Math.floor(R()*(b-a+1));
  const start = 9 + ri(0,2) + (up || 0);   // 约 10 人起步（对齐原版）
  let e = start;                              // 预期人数（按选对门估算）
  const events = [];
  let z = 320;
  let enemiesLeft = d.enemies;
  let obsLeft = d.obs;
  let mulLeft = 3 + Math.floor(n/6);           // 每关乘法有预算，避免一路×冲到顶

  function randOp(positiveOnly){
    if(d.super && !positiveOnly && mulLeft > 0 && R() < 0.1){ mulLeft--; return {t:'mul', v:4}; }
    const pool = ['add'];
    if(!positiveOnly){
      if(d.sub && e >= 3) pool.push('sub');
      if(d.div && e >= 4 && e % 2 === 0) pool.push('div');
    }
    if(d.mul && mulLeft > 0) pool.push('mul');
    if(d.mul3 && mulLeft > 0) pool.push('mul3');
    const t = pool[Math.floor(R()*pool.length)];
    if(t==='mul' || t==='mul3') mulLeft--;
    if(t==='add')  return {t:'add', v: ri(5, d.maxAdd)};
    if(t==='sub')  return {t:'sub', v: Math.min(e-1, ri(3, Math.max(4, Math.floor(d.maxAdd*0.7))))};
    if(t==='mul')  return {t:'mul', v: 2};
    if(t==='mul3') return {t:'mul', v: 3};
    return {t:'div', v: 2};
  }

  function makePair(){
    // 陷阱 / 岔路：两边都亏，岔路口会多给一扇“不变”，让孩子能绕过去
    if(!d.bonus && d.trap > 0 && e >= 6 && R() < d.trap){
      const a = {t:'sub', v: ri(2, Math.max(3, Math.floor(e*0.4)))};
      const b = (d.div && e%2===0 && R()<0.5) ? {t:'div', v:2}
          : {t:'sub', v: ri(Math.floor(e*0.5), Math.max(Math.floor(e*0.5)+1, e-1))};
      if(d.fork && R() < 0.55) return R() < 0.5 ? [a, b, {t:'pass'}] : [b, a, {t:'pass'}];
      return R() < 0.5 ? [a, b] : [b, a];
    }
    // “?”惊喜门：一侧内容未知，另一侧是已知数
    if(!d.bonus && d.rnd > 0 && R() < d.rnd){
      const known = {t:'add', v: ri(8, d.maxAdd)};
      return R() < 0.5 ? [{t:'rnd'}, known] : [known, {t:'rnd'}];
    }
    // 普通门：高阶一部分是“三选一”
    const L = (d.gate3 && R() < d.gate3) ? 3 : 2;
    for(let tries=0; tries<40; tries++){
      const arr = [];
      for(let k=0; k<L; k++) arr.push(randOp(R() < 0.18));
      let ok = true;
      const vals = arr.map(op => {
        const v = op.t==='rnd' ? e + 20 : applyOp(e, op);
        if(v < 1) ok = false;
        return v;
      });
      if(!ok) continue;
      let best = -1e9, second = -1e9;
      for(const v of vals){ if(v > best){ second = best; best = v; } else if(v > second) second = v; }
      if(best >= second*1.3 || best - second >= 10){
        if(R() < 0.5) arr.reverse();           // 别总把最好的放最左边
        return arr;
      }
    }
    const v1 = ri(6, Math.floor(d.maxAdd*0.5)), v2 = ri(v1+10, d.maxAdd+10); // 兜底：大小加法
    return R()<0.5 ? [{t:'add',v:v2},{t:'add',v:v1}] : [{t:'add',v:v1},{t:'add',v:v2}];
  }

  for(let i=0; i<d.pairs; i++){
    const pair = makePair();
    events.push({kind:'gate', z, pair, done:false});
    // 预期人数按“选得好”估算（?门按 +20、不变按原样估），上限 999
    const est = op => op.t==='rnd' ? e + 20 : applyOp(e, op);
    let e2 = 0;
    for(const op of pair){ const ev = est(op); if(ev > e2) e2 = ev; }
    e = Math.min(MAXC, e2);
    const seg = d.gap + ri(-15, 25);
    z += seg;
    // 障碍花样（随关卡解锁：贴边红刺 → 旋转锯片 → 摆锤 → 双刺夹道），
    // 每段最多一个、放在两段门中间，永远留得出能钻过去的缝
    if(i >= 1 && i < d.pairs-1 && obsLeft > 0 && R() < 0.5){
      const w = 0.42 + R()*0.18, zz = z - seg*0.5;
      const ob = {kind:'obs', z: zz, x: (R()<0.5?-1:1)*(0.98-w/2), w, dmg: d.obsDmg, done:false};
      if(d.mv && R() < 0.5) ob.mv = {a: 0.22 + R()*0.12, s: 1.4 + R()*1.4, p: R()*6};
      const roll = R();
      if(n >= 10 && roll < 0.3){                // 旋转锯片：在路面中间来回滚
        ob.kind = 'saw'; ob.x = 0;
        ob.mv = {a: 0.42, s: 2.2 + R()*1.2, p: R()*6};
      }else if(n >= 15 && roll < 0.5){          // 摆锤：从高处甩下来的大摆锤
        ob.kind = 'pend'; ob.x = 0; ob.w = w*1.2;
        ob.mv = {a: 0.5, s: 1.6 + R()*1.2, p: R()*6};
      }else if(n >= 19 && roll < 0.62){         // 双刺夹道：两侧尖刺往里夹
        ob.kind = 'pike';
        ob.a = 0.34; ob.b = 0.16; ob.s = 2.0 + R()*1.5; ob.p = R()*6;
      }
      events.push(ob);
      obsLeft--;
    }
    // 敌方人群：脚下红圈，踏进圈就开打。多数横在路中央挡路（几乎绕不开），少数靠边
    else if(i >= 2 && enemiesLeft > 0 && R() < 0.6){
      const en = Math.max(3, Math.floor(e * (0.5 + R()*0.4)));   // 人数随你涨
      const wide = R() < 0.6;
      events.push({kind:'enemy', z: z - seg*0.5,
                   x: wide ? 0 : (R() < 0.5 ? -0.55 : 0.55),
                   r: wide ? 0.55 : 0.36, n: en, done:false});    // 圈径≈路宽40–60%
      e = Math.max(1, e - en);
      enemiesLeft--;
    }
    // 金币串：只撒在没有障碍也没有敌人的路段
    else if(i < d.pairs-1 && R() < 0.55){
      const cx = (R()*2-1) * 0.5, nC = 5;
      for(let k=0; k<nC; k++)
        events.push({kind:'coin', z: z - seg*0.8 + k*11,
                     x: Math.max(-0.8, Math.min(0.8, cx + Math.sin(k*0.9)*0.15)), taken:false});
    }
  }
  const finishZ = z + 60;
  const theme = THEMES[Math.floor((n-1)/5) % THEMES.length];
  const decos = [];
  for(let i=0; i<Math.ceil((finishZ+200)/45); i++)
    decos.push({z: i*45 + R()*25, side:(R()<0.5?-1:1)*(1.25+R()*0.9), k:R()});
  // 关底布局：跑道结束 → 上一座擂台(守门王站中间) → 打赢后再拉开一段才到 ×台阶
  const bossZ = finishZ + 46;                    // 擂台中心
  const stairZ0 = finishZ + 150;                 // 登塔台阶，和擂台明显分开
  // 王血 = 预期人数 × 王系数。系数随关卡逐关变高（第1关 0.50 → 第60关 0.80），
  // 也就是要到王面前留下“预期人数”的多少成：0.50 很容易赢 → 0.80 约等于只有
  // 发挥到 8 成的人能赢（到王胜率从接近100% 一路压到 30–40%）。三个数是调难度用的旋钮：
  const BOSS_F0    = 0.50;      // 起始系数（第1关）
  const BOSS_FSTEP = 0.0051;    // 每关往上加多少
  const BOSS_FMAX  = 0.80;      // 封顶系数（≈第60关），再往后不再变难
  const bossF = Math.min(BOSS_FMAX, BOSS_F0 + (n - 1) * BOSS_FSTEP);
  const boss  = Math.min(MAXC, Math.max(8, Math.floor(e * bossF)));
  // ×台阶门槛按“撞完守门王还剩多少”来标：顶台留 20% 余量，
  // 这样“每个门都选得差不多对”就能上顶台 ×5（而不是必须极限完美）
  const M = Math.max(2, Math.floor((e - boss) * 0.8));
  const stairs = [];
  for(let j=1; j<=5; j++)
    stairs.push({mult: j, need: Math.round(M * (j-1) / 4)});
  // 守门王皮肤：每 8 关换一个颜色，后期体型略微变大，不只是一串数字
  const bossColor = BOSS_COLORS[Math.floor((n-1)/8) % BOSS_COLORS.length];
  const bossBig = Math.min(3.1, 2.4 + Math.floor(n/8) * 0.1);
  return {n, start, events, finishZ, length: stairZ0 + 220, theme, decos,
          speed: d.speed, par: e, bonus: d.bonus, stairs,
          stairZ0, stairT: 26,
          boss, bossMax: boss, bossZ, bossColor, bossBig};
}

/* ================= 主题 ================= */
const THEMES = [
  {sky:['#7ec8f7','#d8f1ff'], ground:'#79c46b', track:'#f7e9c3', stripe:'#ecd9a8',
   crowd:'#ff7043', deco:'tree'},
  {sky:['#f7c873','#fdeec8'], ground:'#e0b25e', track:'#fff3d6', stripe:'#eed9a8',
   crowd:'#42a5f5', deco:'cactus'},
  {sky:['#a5d8f0','#eef9ff'], ground:'#eef6fb', track:'#cfdfec', stripe:'#bccfdf',
   crowd:'#ef5350', deco:'snow'},
  {sky:['#1a2350','#3b4a8c'], ground:'#2c3560', track:'#4a5588', stripe:'#3d4673',
   crowd:'#ffca28', deco:'star'},
];

/* 守门王配色：每 8 关换一档 */
const BOSS_COLORS = ['#8e24aa','#c62828','#1565c0','#00695c','#ef6c00','#37474f'];

/* ================= 伪 3D 投影 ================= */
const VIEW = 520;
const persp = d => 1 / (1 + Math.max(d, -30) * 0.011);
const SX = (x,p) => W/2 + x * W * 0.42 * p;
const SY = d => { const p = persp(d); return H*0.30 + (H*1.02 - H*0.30) * p; };

/* ================= 游戏状态 ================= */
let level = null, state = 'menu';   // menu | run | finish | over | locked
const MAXC = 9999;                  // 小人人数上限（提高，避免一冲就到顶）
let crowd = 5, px = 0, targetX = 0, pz = 0;
let floats = [], confetti = [];
let finT = 0, time = 0;

/* ================= 每日限时（30 分钟） ================= */
const DAY_LIMIT = 30 * 60;          // 秒
// 测试区（/test/ 路径或带 test 参数）不限时，正式版才启用每日 30 分钟
const TEST_BUILD = (typeof location !== 'undefined') &&
    (/\/test\//.test(location.pathname) || /[?&]test/.test(location.search));
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
       + '-' + String(d.getDate()).padStart(2,'0');
}
const timeKey = () => 'np_time_' + todayStr();
let usedSec = +(localStorage.getItem(timeKey()) || 0);
let lastSave = 0, lockPending = false, lastShownMin = -1;
function remainSec(){ return TEST_BUILD ? DAY_LIMIT : Math.max(0, DAY_LIMIT - usedSec); }
function tickTimer(dt){
  if(TEST_BUILD){
    if(lastShownMin !== -2){ lastShownMin = -2; $('hudTime').textContent = '⏱ 不限·测试'; }
    return;
  }
  if(state === 'locked') return;
  usedSec += dt;
  if(time - lastSave > 2){ lastSave = time; localStorage.setItem(timeKey(), usedSec.toFixed(0)); }
  const m = Math.ceil(remainSec() / 60);
  if(m !== lastShownMin){
    lastShownMin = m;
    $('hudTime').textContent = '⏱ ' + m + ' 分钟';
  }
  if(remainSec() <= 0){
    if(state === 'run' || state === 'finish') lockPending = true;  // 让本局跑完再锁
    else showLock();
  }
}
function showLock(){
  state = 'locked';
  $('menu').classList.add('hidden');
  $('result').classList.add('hidden');
  $('lock').classList.remove('hidden');
}

const store = {
  get unlocked(){ return +(localStorage.getItem('np_unlock') || 1); },
  set unlocked(v){ localStorage.setItem('np_unlock', v); },
  stars(n){ return +(localStorage.getItem('np_star_'+n) || 0); },
  setStars(n,s){ if(s > this.stars(n)) localStorage.setItem('np_star_'+n, s); },
  coins(){ return +(localStorage.getItem('np_coins') || 0); },
  addCoins(v){ localStorage.setItem('np_coins', Math.max(0, this.coins() + v)); },
  upLvl(){ return +(localStorage.getItem('np_upstart') || 0); },
  setUpLvl(v){ localStorage.setItem('np_upstart', v); },
  coinLvl(){ return +(localStorage.getItem('np_coinlvl') || 0); },
  setCoinLvl(v){ localStorage.setItem('np_coinlvl', v); },
  color(){ return +(localStorage.getItem('np_color') || 0); },
  setColor(v){ localStorage.setItem('np_color', v); },
  hat(){ return +(localStorage.getItem('np_hat') || 0); },
  setHat(v){ localStorage.setItem('np_hat', v); },
};
/* 小人颜色皮肤：8 款。每款一个“攒够多少总星数就解锁”的门槛，
   越往后越慢——前期两关换一色，后期要慢慢攒（第 0 款一开始就有） */
const COLORS = ['#ff7043','#42a5f5','#66bb6a','#ab47bc','#ffca28','#ec407a','#7e57c2','#26c6da'];
const COLOR_STARS = [0, 10, 22, 36, 52, 72, 96, 124];
/* 帽子装饰：8 款（第 0 个 = 不戴），门槛同样越往后越高 */
const HATS = ['', '🎩', '🪖', '🎀', '🐰', '🌟', '👑', '🧸'];
const HAT_STARS  = [0, 14, 30, 48, 70, 96, 126, 160];
function totalStars(){
  let s = 0;
  for(let n = 1; n < store.unlocked; n++) s += store.stars(n);
  return s;
}
function unlockCount(arr){
  const t = totalStars(); let c = 0;
  while(c < arr.length && t >= arr[c]) c++;
  return c;
}
const unlockedColors = () => unlockCount(COLOR_STARS);
const unlockedHats   = () => unlockCount(HAT_STARS);
const crowdColor = () => COLORS[store.color() % Math.max(1, unlockedColors())];
const hatEmoji = () => HATS[store.hat() % Math.max(1, unlockedHats())];
let curLevel = store.unlocked;
let runCoins = 0, bossResult = null, fightAcc = 0;
let fightFx = null;              // 守门王战胜负的小动画：{kind:'win'|'lose', t:播放时长}

let ptrX = null;
cv.addEventListener('pointerdown', ev => { ptrX = ev.clientX; });
addEventListener('pointermove', ev => {
  // 鼠标：不用按住，移动即控制（触控板/鼠标友好）
  if(ev.pointerType === 'mouse'){
    targetX = Math.max(-0.86, Math.min(0.86, (ev.clientX - W/2) / (W*0.42)));
    return;
  }
  // 触屏：按住拖动
  if(ptrX === null) return;
  targetX += (ev.clientX - ptrX) / W * 2.4;
  targetX = Math.max(-0.86, Math.min(0.86, targetX));
  ptrX = ev.clientX;
});
addEventListener('pointerup', ()=> ptrX = null);
addEventListener('pointercancel', ()=> ptrX = null);
const keys = {};
addEventListener('keydown', ev => {
  keys[ev.key] = true;
  if(ev.key === 'Enter' || ev.key === ' '){          // 回车/空格 = 点开始按钮

});

function paintPalette(){

  const pal = $('palette'); pal.innerHTML = '';

    dot.type = 'button';

      'border:' + (i === cur ? '3px solid #2d2a26' : '3px solid transparent') + ';' +
      'background:' + (unlocked ? COLORS[i] : '#e8e2d5') + ';' +

function startLevel(){

  crowd = level.start; px = 0; targetX = 0; pz = 0;

function endLevel(fail){
  state = 'over';
  let stars, title, info;
  if(fail){
    stars = 0;
    if(bossResult === 'lose'){                   // 守门王战输了 = 卡关：这关不算过，重试攒人
      title = '守门王赢了…';
      info = '小人全被打散了 · 多攒点人再来撞！';
    }else{
      title = '哎呀，小人都没有啦'; info = '别灰心，再试一次！';
    }
  }else{                                         // 撞倒守门王 → 爬上 ×台阶 结算
    let stair = 0;
    for(const s of level.stairs) if(crowd >= s.need) stair = s.mult;
    const score = crowd * Math.max(1, stair);
    stars = stair >= 5 ? 3 : stair >= 3 ? 2 : 1;
    title = ['','不错哦！','太棒了！','完美！'][stars];
    // 按剩余人数结算金币（对齐原版：人留得越多奖励越多）
    const reward = Math.max(2, Math.floor(crowd / 2));
    store.addCoins(reward);
    info = crowd + ' 人 × ' + Math.max(1,stair) + ' 倍 = ' + score + ' 分'
         + ' · 结算 +' + reward + '🪙'
         + (runCoins ? ' · 途中捡 ' + runCoins + '🪙' : '');
    if(bossResult === 'win') info = '撞倒守门王 +5🪙 · ' + info;
  }
  if(fail){
    sndBad();
    $('resTitle').textContent = title;
    $('resStars').textContent = '';
    $('resInfo').textContent = info;
    $('btnNext').classList.add('hidden');
  }else{
    sndWin();
    store.setStars(curLevel, stars);
    store.unlocked = Math.max(store.unlocked, curLevel + 1);
    $('resTitle').textContent = title;
    $('resStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
    $('resInfo').textContent = info;
    $('btnNext').classList.remove('hidden');
    if(stars === 3) spawnConfetti();
  }
  $('hudCoin').textContent = '🪙 ' + store.coins();
  $('btnRetry').textContent = fail ? '再试一次' : '再玩一次';
  if(lockPending){ showLock(); return; }
  $('result').classList.remove('hidden');
}

function spawnConfetti(){

    c:'hsl('+Math.floor(Math.random()*360)+',90%,60%)', s:6+Math.random()*6, r:Math.random()*3
  });
}
function addFloat(txt, good){
  floats.push({txt, good, age: 0});
}

/* ================= 更新 ================= */
function update(dt){
  time += dt;
  tickTimer(dt);
  if(state === 'run'){
    // 方向键按住连续移动
    if(keys['ArrowLeft'])  targetX = Math.max(-0.86, targetX - 2.2*dt);
    if(keys['ArrowRight']) targetX = Math.min( 0.86, targetX + 2.2*dt);
    pz += 150 * level.speed * dt;
    px += (targetX - px) * Math.min(1, dt*10);
    for(const ev of level.events){
      if(ev.done || ev.z > pz) continue;
      ev.done = true;
      if(ev.kind === 'gate'){
        const L = ev.pair.length;                 // 两扇或三扇：小人身体中线对准第几扇
        const op = ev.pair[L === 2
          ? (px < 0 ? 0 : 1)
          : Math.max(0, Math.min(L-1, Math.floor((px + 1) * L / 2)))];
        const old = crowd;
        crowd = Math.max(0, Math.min(MAXC, applyOp(crowd, op)));
        const delta = crowd - old;
        if(op.t === 'pass'){ addFloat('绕过去！人不变', false); sndGood(); }
        else{
          const good = delta >= 0;
          addFloat((good ? '+' : '') + delta + (good ? '!' : '…'), good);
          good ? sndGood() : sndBad();
        }
        if(crowd <= 0){ endLevel(true); return; }
      }else if(ev.kind === 'coin'){
        if(Math.abs(px - ev.x) < 0.30){
          const gain = 1 + store.coinLvl();               // 金币收益升级后每枚更多
          ev.taken = true; runCoins++; store.addCoins(gain);
          addFloat('+' + gain + '🪙', true);
          beep(1200, .06, 'sine', .07);
          $('hudCoin').textContent = '🪙 ' + store.coins();
        }
      }else if(ev.kind === 'enemy'){
        if(Math.abs(px - ev.x) < (ev.r || 0.45)){   // 踏进红圈就开打
          if(crowd > ev.n){                       // 人多：双方消耗，赢的只剩差额
            crowd -= ev.n;
            addFloat('−' + ev.n + ' 击败!', true);
            sndGood();
          }else{                                  // 人不够：被撞散
            crowd = 0;
            endLevel(true); return;
          }
        }
      }else{ // 障碍：撞上才减人。红刺贴边可绕；锯片/摆锤看时机；双刺夹道钻中间缝
        let clear;
        if(ev.kind === 'pike'){
          const gap = ev.a + Math.sin(time*ev.s + ev.p)*ev.b;   // 中间缝当前多宽
          clear = Math.abs(px) < gap;
        }else{
          const ox = ev.mv ? ev.x + Math.sin(time*ev.mv.s + ev.mv.p)*ev.mv.a : ev.x;
          const r = ev.kind === 'saw' ? ev.w*0.55 : ev.w/2 + 0.1;
          clear = Math.abs(px - ox) >= r;
        }
        if(!clear){
          crowd = Math.max(0, crowd - ev.dmg);
          addFloat('−' + ev.dmg + '…', false);
          sndBad();
          if(crowd <= 0){ endLevel(true); return; }
        }
      }
      $('hudCount').textContent = '👥 ' + crowd;
    }
    if(pz >= level.finishZ){
      state = 'fight';                          // 每关关底都先撞守门王
      finT = 0;
    }
  }
  else if(state === 'fight'){                   // 守门王战：双方小人互相扑，人多的剩差额登塔
    finT += dt;
    px += (0 - px) * Math.min(1, dt*6); targetX = 0;
    if(pz < level.bossZ){ pz += 150 * level.speed * dt; }
    else if(fightFx){                           // 正在演胜负小动画：播完再收场
      fightFx.t += dt;
      if(fightFx.kind === 'win'){               // 王倒下、欢呼完 → 冲 ×台阶
        if(fightFx.t >= (level.fxWinT || 1.7)){ fightFx = null; finT = 0; state = 'finish'; }
      }else{                                    // 小人被打散 → 演完再判负（不马上黑屏）
        if(fightFx.t >= (level.fxLoseT || 1.5)){ fightFx = null; endLevel(true); }
      }
    }else{
      if(level.fstep === undefined){            // 开场一次性定死步长 → 固定 ~1.8 秒线性打完
        level.fstep = Math.max(1, Math.ceil(Math.min(crowd, level.boss) / 36));
        addFloat('和守门王打起来啦！', true); sndGood();
      }
      fightAcc += dt;
      while(fightAcc > 0.05 && level.boss > 0 && crowd > 0){
        fightAcc -= 0.05;
        level.boss = Math.max(0, level.boss - level.fstep);
        crowd = Math.max(0, crowd - level.fstep);
        beep(280 + Math.random()*220, .05, 'square', .05);
      }
      $('hudCount').textContent = '👥 ' + crowd;
      if(crowd > 0 && level.boss <= 0){         // 撞倒守门王：先放倒他再庆祝
        level.boss = 0; bossResult = 'win';
        store.addCoins(5); addFloat('+5🪙', true);
        $('hudCoin').textContent = '🪙 ' + store.coins();
        fightFx = {kind:'win', t:0};
        level.fxWinT = 1.7;
        beep(300, .25, 'sine', .16); sndWin();
      }else if(crowd <= 0){                     // 人被打光：先播一段“被打散”的动画
        bossResult = 'lose';
        fightFx = {kind:'lose', t:0};
        level.fxLoseT = 1.5;
        sndBad();
      }
    }
  }
  else if(state === 'finish'){                  // 爬 ×台阶：能站上的最高一级
    finT += dt;
    px += (0 - px) * Math.min(1, dt*6); targetX = 0;
    let si = 0;
    level.stairs.forEach((s,i) => { if(crowd >= s.need) si = i; });
    const stopZ = level.stairZ0 + si * level.stairT + level.stairT * 0.5;
    if(pz < stopZ) pz += 150 * level.speed * dt;
    else if(finT > 0.4) endLevel(false);
  }
  floats = floats.filter(f => (f.age += dt) < 1.3);
  for(const c of confetti){ c.y += c.vy*dt; c.x += c.vx*dt; c.r += dt*4; }
  confetti = confetti.filter(c => c.y < H + 30);
}

/* ================= 绘制 ================= */
// 大字：粗体 + 深色描边，给孩子看更醒目
function bigText(s, x, y, px, fill){
  ctx.font = '900 ' + px + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.8)';
  ctx.lineWidth = Math.max(2.5, px * 0.22);
  ctx.strokeText(s, x, y);
  ctx.fillStyle = fill || '#fff';
  ctx.fillText(s, x, y);
}
// 深色底托 + 大字（在任何底色上都清楚）
function numPlate(s, x, y, px, fill){
  ctx.font = '900 ' + px + 'px sans-serif';
  const w = ctx.measureText(s).width;
  const pad = px * 0.35, hh = px * 1.5;
  ctx.fillStyle = 'rgba(8,14,28,.62)';
  ctx.beginPath(); ctx.roundRect(x - w/2 - pad, y - hh/2, w + pad*2, hh, hh/2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = Math.max(1, px*0.06); ctx.stroke();
  bigText(s, x, y, px, fill);
}
// 守门王大战：切到屏幕中央的“擂台特写”，高台+围绳，我方往上冲
// 打赢：王侧倒砸地 → 金星四溅 → 我方欢呼跳；打输：我方小人被甩飞淡出
function drawFight(){
  const eff = fightFx;
  const fxW = !!(eff && eff.kind === 'win');
  const fxL = !!(eff && eff.kind === 'lose');
  const shake = fxL ? Math.sin(finT*95) * Math.max(0, 1 - eff.t*1.8) * 9 : 0; // 输时画面抖一抖
  const cx = W/2 + shake;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, fxL ? '#2c0f10' : fxW ? '#3a2d00' : '#0b1526');
  g.addColorStop(.6, fxL ? '#451516' : fxW ? '#241d04' : '#16283f');
  g.addColorStop(1, '#000');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 大字标题：打起来 / 打赢 / 打输，各说各话
  bigText(fxW ? '🎉 撞倒守门王！' : fxL ? '💨 守门王赢了…' : '👑 守门王之战',
          W/2, Math.max(44, H*0.10), Math.min(W*0.05, 46), fxL ? '#ff8a80' : '#ffd54f');
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  ctx.beginPath(); ctx.arc(cx, H*0.60, Math.min(W*0.44, 420), 0, 7); ctx.fill();
  // 高台（木质 + 抬起的影子）
  const cy = H*0.60, rx = Math.min(W*0.36, 340), ry = rx*0.24;
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.ellipse(cx, cy + ry*0.22, rx, ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = fxW ? '#a07a22' : '#9a6a2f';
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = fxW ? '#c9a33c' : '#c98a3a';
  ctx.beginPath(); ctx.ellipse(cx, cy - ry*0.5, rx*0.8, ry*0.8, 0, 0, 7); ctx.fill();
  // 四角桩（打赢砸地那一下整台轻微歪）
  ctx.fillStyle = '#6b4a1f';
  const hp = Math.min(70, H*0.11);
  const tilt = fxW ? 0.06 * Math.min(1, eff.t/0.6) : 0;
  for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    const px = cx + a*rx*1.05 - (a > 0 ? tilt*rx : 0), py = cy + b*ry*0.6 + b*tilt*rx*0.3;
    ctx.fillRect(px - 6, py - hp, 12, hp);
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath(); ctx.arc(px, py - hp, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#6b4a1f';
  }
  // 围绳（四个桩顶连一圈）
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  const ring = [[-1,-1],[1,-1],[1,1],[-1,1]];
  ring.forEach(([a,b], i) => {
    const px = cx + a*rx*1.05 - (a > 0 ? tilt*rx : 0), py = cy + b*ry*0.6 + b*tilt*rx*0.3 - hp;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  });
  ctx.closePath(); ctx.stroke();
  // 守门王
  const bc = level.bossColor || '#8e24aa';
  const kH = Math.min(H*0.3, 200) * ((level.bossBig || 2.4) / 2.4);
  const ky = cy - ry*0.2;
  if(fxW){
    // —— 胜利仪式：0~0.55s 侧倒砸地，之后趴地冒金星 ——
    const uf = Math.min(1, eff.t / 0.55);
    const ease = uf*uf*(3 - 2*uf);
    const lying = uf >= 1;
    const ang = -ease*Math.PI/2 - 0.03;                       // 仰面往左倒下
    const sink = Math.sin(ease*Math.PI) * kH*0.08;            // 砸地瞬间轻微下挫
    ctx.save();
    ctx.translate(cx, ky + (lying ? kH*0.05 : sink));
    ctx.rotate(ang);
    if(lying) ctx.globalAlpha = Math.max(0.35, 1 - Math.max(0, eff.t - 1.1)); // 趴一会儿再淡出
    drawFigure(0, 0, kH, 0.2, bc);
    ctx.restore(); ctx.globalAlpha = 1;
    // 砸地音效（只响一次）
    if(lying && level.boomFired === undefined){
      level.boomFired = true;
      beep(70, .3, 'sine', .18); beep(52, .45, 'square', .09);
    }
    // 着地：金星/尘土向四周炸开
    if(lying){
      const dd = eff.t - 0.55;
      for(let i = 0; i < 16; i++){
        const a = i*2.399963 + 0.3;
        const rr = 20 + dd*330 + (i%3)*20;
        ctx.globalAlpha = Math.max(0, 1 - dd/1.15);
        ctx.fillStyle = ['#fff','#ffe082','#ffd54f','#ffca28','#fff59d'][i%5];
        ctx.beginPath(); ctx.arc(cx + Math.cos(a)*rr, ky + Math.abs(Math.sin(a))*22 - dd*10,
                                 3.5 + (i%3)*2.5, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // 王冠掉在一旁，晕晕的星星在脑袋位置转
      ctx.font = '900 ' + Math.max(16, kH*0.2) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('👑', cx - kH*0.85, ky + 8 + Math.sin(eff.t*9)*4, );
      const dsw = eff.t - 0.55;
      for(let i = 0; i < 3; i++){
        const sa = dsw*6 + i*2.1;
        ctx.globalAlpha = Math.max(0, 1 - dsw/0.9);
        ctx.fillText('✨', cx - Math.cos(sa)*kH*0.5, ky + Math.sin(sa)*kH*0.08 - kH*0.12);
      }
      ctx.globalAlpha = 1;
    }
  }else if(fxL){
    // —— 我方被团灭：王稳稳站着，我方小人被打飞、甩出去淡出 ——
    ctx.fillStyle = 'rgba(255,60,60,.22)';                    // 王脚下红光更凶
    ctx.beginPath(); ctx.ellipse(cx, cy + ry*0.9, rx*0.6, ry*1.7, 0, 0, 7); ctx.fill();
    const bob = Math.sin(time*4) * kH*0.035;
    drawFigure(cx, ky + bob, kH, 0, bc);
    const u = Math.min(1, eff.t / 1.05);
    for(let i = 0; i < 18; i++){
      const a = i*2.399963 + 0.6;
      const rr = rx*0.1 + u*(rx*1.15 + (i%4)*26);
      const sx = cx + Math.cos(a)*rr;
      const sy = ky - Math.sin(a)*rr*0.35 - u*u*H*0.16;
      const ang = -u*3.4 + ((i*7)%2 ? 1 : -1)*0.5;
      ctx.globalAlpha = Math.max(0, 1 - u*1.5);
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
      drawFigure(0, 0, Math.max(13, kH*0.14), i*0.7, '#9e9e9e');
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }else{
    drawFigure(cx, ky, kH, 0, bc);                             // 开打：王站在台上
  }
  // 王的血量牌（打起来和打输时显示；王倒地打赢了就撤掉）
  if(!fxW && level.boss > 0){
    const bs = '👑' + level.boss, kbh = 52, kbw = kbh + bs.length*16;
    const kby = ky - kH*2.4 - 30;
    ctx.fillStyle = bc;
    ctx.beginPath(); ctx.roundRect(cx - kbw/2, kby - kbh/2, kbw, kbh, kbh/2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; ctx.stroke();
    bigText(bs, cx, kby + 1, 40, '#fff');
  }
  // 我方小人从台下往上涌；打赢后整群欢呼跳
  const cc = crowdColor();
  if(crowd > 0){
    const show = Math.min(crowd, 42);
    const surge = Math.min(1, finT * 0.35);
    const joy = fxW ? Math.max(0, Math.min(1, (eff.t - 0.5) * 2)) : 0;
    const baseY = H*0.94 - surge*H*0.13;
    for(let i = 0; i < show; i++){
      const rr2 = Math.sqrt((i + 0.5) / show);
      const aa = i * 2.399963 + time * 0.2;
      const sx = cx + Math.cos(aa) * rr2 * rx*0.9;
      const sy = baseY - Math.abs(Math.sin(aa)) * rr2 * H*0.18
               + Math.sin(time*16 + i)*6
               - joy * joy * Math.abs(Math.sin(time*13 + i*1.7)) * kH*0.22;   // 蹦跳欢呼
      drawFigure(sx, sy, Math.max(18, H*0.045) * (1 - rr2*0.25), i*0.7, cc);
    }
    // 我方人数牌
    const cs = String(crowd), cbh = 38, cbw = Math.max(48, 24 + cs.length*17);
    const cby = H*0.82;
    ctx.fillStyle = 'rgba(255,255,255,.96)';
    ctx.beginPath(); ctx.roundRect(cx - cbw/2, cby - cbh/2, cbw, cbh, cbh/2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#111'; ctx.font = '900 26px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('我方 ' + cs, cx, cby + 1);
  }
  // 一句话点题
  if(!fxW && !fxL) bigText('人多的一方赢！', cx, H*0.745, 42, '#ffe082');
  if(fxW) bigText('闯过守门王 → 冲上 ×台阶！', cx, H*0.76, 40, '#fff9c4');
  if(fxL) bigText('小人被打散了… 多攒点人再来', cx, H*0.76, 38, '#ffccbc');
}
function drawFigure(x, y, h, phase, color){
  const swing = Math.sin(time*14 + phase);
  const hipY = y - h*0.45, shoY = y - h*0.68, headR = h*0.16;
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, h*0.07); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, hipY); ctx.lineTo(x, shoY);                          // 身子
  ctx.moveTo(x, hipY); ctx.lineTo(x + swing*h*0.2, y);               // 腿 1
  ctx.moveTo(x, hipY); ctx.lineTo(x - swing*h*0.2, y);               // 腿 2
  ctx.moveTo(x, shoY); ctx.lineTo(x - swing*h*0.16, y - h*0.38);     // 臂 1
  ctx.moveTo(x, shoY); ctx.lineTo(x + swing*h*0.16, y - h*0.38);     // 臂 2
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y - h*0.85, headR, 0, 7); ctx.fill();  // 头
}
function drawDeco(de, d, theme){
  const p = persp(d), x = SX(de.side, p), y = SY(d), s = p * 46;
  if(s < 2) return;
  if(theme.deco === 'tree'){
    ctx.fillStyle = '#8d5a2b'; ctx.fillRect(x - s*0.08, y - s*0.5, s*0.16, s*0.5);
    ctx.fillStyle = '#3e9e4f';
    ctx.beginPath(); ctx.moveTo(x, y - s*1.25); ctx.lineTo(x + s*0.55, y - s*0.4);
    ctx.lineTo(x - s*0.55, y - s*0.4); ctx.closePath(); ctx.fill();
  }else if(theme.deco === 'cactus'){
    ctx.fillStyle = '#4caf50';
    ctx.beginPath(); ctx.roundRect(x - s*0.14, y - s*1.1, s*0.28, s*1.1, s*0.14); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x + s*0.12, y - s*0.85, s*0.35, s*0.16, s*0.08); ctx.fill();
  }else if(theme.deco === 'snow'){
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y - s*0.3, s*0.34, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y - s*0.75, s*0.24, 0, 7); ctx.fill();
  }
}
function drawGate(ev, d){
  const p = persp(d), y = SY(d);
  const hgt = 128 * p, L = ev.pair.length;
  // 两扇或三扇门拼满整条路，扇与扇之间用细立柱隔开（对齐原版比例）
  for(let i=0; i<L; i++){
    const x0 = SX(-1 + i*2/L + 0.014, p), x1 = SX(-1 + (i+1)*2/L - 0.014, p);
    const op = ev.pair[i];
    const danger = op.t === 'sub' || op.t === 'div';          // 会扣人的门：偏红调提醒
    const pass = op.t === 'pass';                             // 岔路口的“不变”门：灰调
    ctx.fillStyle = pass ? 'rgba(140,140,150,.30)'
                 : danger ? 'rgba(229,57,53,.30)' : 'rgba(90,180,255,.30)';
    ctx.beginPath(); ctx.roundRect(x0, y - hgt, x1 - x0, hgt, 10*p); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(1, 2.5*p);
    ctx.stroke();
    // 面板下部一条更深的口子，做出“立在地面”的体积感
    ctx.fillStyle = danger ? 'rgba(200,30,30,.4)' : 'rgba(30,110,220,.35)';
    ctx.fillRect(x0 + (x1-x0)*0.18, y - 5*p, (x1-x0)*0.64, 6*p);
    // 门上的字：深色底托 + 白粗字
    numPlate(opLabel(op), (x0+x1)/2, y - hgt/2,
             Math.max(13, Math.min(62, H*0.046) * p), pass ? '#cfd8dc' : '#fff');
  }
  // 扇与扇之间的分隔立柱
  ctx.fillStyle = 'rgba(20,60,90,.6)';
  for(let i=1; i<L; i++){
    const cx0 = SX(-1 + i*2/L - 0.02, p), cx1 = SX(-1 + i*2/L + 0.02, p);
    ctx.beginPath(); ctx.roundRect(cx0, y - hgt, cx1 - cx0, hgt, 3*p); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(cx0 + (cx1-cx0)*0.35, y - hgt*0.88, Math.max(1,(cx1-cx0)*0.3), hgt*0.76);
    ctx.fillStyle = 'rgba(20,60,90,.6)';
  }
}
function drawObs(ev, d){
  const p = persp(d), y = SY(d);
  const ox = ev.mv ? ev.x + Math.sin(time*ev.mv.s + ev.mv.p)*ev.mv.a : ev.x;
  const x0 = SX(ox - ev.w/2, p), x1 = SX(ox + ev.w/2, p), hgt = 46*p;
  ctx.fillStyle = '#e53935';
  ctx.beginPath(); ctx.roundRect(x0, y - hgt, x1 - x0, hgt, 5*p); ctx.fill();
  ctx.fillStyle = '#b71c1c';                                   // 尖刺
  const n = 3, step = (x1 - x0) / n;
  for(let i=0;i<n;i++){
    ctx.beginPath();
    ctx.moveTo(x0 + i*step, y - hgt);
    ctx.lineTo(x0 + (i+0.5)*step, y - hgt - 16*p);
    ctx.lineTo(x0 + (i+1)*step, y - hgt);
    ctx.closePath(); ctx.fill();
  }
}
function drawSaw(ev, d){                              // 旋转锯片：在路面滚来滚去
  const p = persp(d), y = SY(d);
  const ox = ev.x + Math.sin(time*ev.mv.s + ev.mv.p)*ev.mv.a;
  const x = SX(ox, p);
  const rr = Math.max(5, (ev.w*0.55) * W * 0.42 * p);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(time*5 + ev.p);
  ctx.fillStyle = '#cfd8dc';
  ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.fill();
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = Math.max(1, 2*p);
  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.arc(0, 0, rr, i/6*6.283, (i+0.5)/6*6.283);
    ctx.arc(0, 0, rr*0.72, (i+0.5)/6*6.283, i/6*6.283, true);
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#e53935';                            // 红芯
  ctx.beginPath(); ctx.arc(x, y, rr*0.38, 0, 7); ctx.fill();
  ctx.fillStyle = '#b71c1c';
  ctx.beginPath(); ctx.arc(x, y, rr*0.16, 0, 7); ctx.fill();
}
function drawPend(ev, d){                             // 摆锤：横杆上吊的大锤左右甩
  const p = persp(d), y = SY(d);
  const topY = y - 165*p, pivotX = SX(ev.x, p);
  const bobX = SX(ev.x + Math.sin(time*ev.mv.s + ev.mv.p)*ev.mv.a, p);
  const rBob = Math.max(6, (ev.w*0.5) * W * 0.42 * p);
  ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = Math.max(3, 5*p);   // 顶梁
  ctx.beginPath(); ctx.moveTo(pivotX - 90*p, topY); ctx.lineTo(pivotX + 90*p, topY); ctx.stroke();
  ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = Math.max(2, 3*p);    // 吊链
  ctx.beginPath(); ctx.moveTo(pivotX, topY); ctx.lineTo(bobX, y - rBob*0.3); ctx.stroke();
  ctx.fillStyle = '#f57c00';                                      // 锤头（带刺）
  ctx.beginPath(); ctx.arc(bobX, y - rBob*0.25, rBob, 0, 7); ctx.fill();
  ctx.fillStyle = '#e65100';
  for(let i=0;i<6;i++){
    const a = i/6*6.283 + time*4;
    ctx.beginPath();
    ctx.moveTo(bobX + Math.cos(a)*rBob*0.8, y - rBob*0.25 + Math.sin(a)*rBob*0.8);
    ctx.lineTo(bobX + Math.cos(a)*rBob*1.25, y - rBob*0.25 + Math.sin(a)*rBob*1.25);
    ctx.stroke();
  }
}
function drawPike(ev, d){                             // 双刺夹道：两侧尖刺，看中间缝
  const p = persp(d), y = SY(d);
  const gap = ev.a + Math.sin(time*ev.s + ev.p)*ev.b;            // 中间缝半宽
  const h = 40*p;
  for(const sign of [-1, 1]){
    const x0 = SX(sign * (sign < 0 ? -1 : gap), p);
    const x1 = SX(sign * (sign < 0 ? gap : 1), p);
    ctx.fillStyle = '#c62828';
    ctx.fillRect(Math.min(x0,x1), y - h, Math.abs(x1-x0), h);
    ctx.fillStyle = '#ef5350';                                    // 顶部尖刺
    const w = Math.abs(x1-x0), n = Math.max(3, Math.min(10, Math.round(w / Math.max(8, 14*p))));
    const stp = w / n;
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(Math.min(x0,x1) + i*stp, y - h);
      ctx.lineTo(Math.min(x0,x1) + (i+0.5)*stp, y - h - 16*p);
      ctx.lineTo(Math.min(x0,x1) + (i+1)*stp, y - h);
      ctx.closePath(); ctx.fill();
    }
  }
}
function drawCoin(ev, d){
  if(ev.taken) return;
  const p = persp(d), x = SX(ev.x, p), y = SY(d) - 16*p;
  const r = Math.max(4, 21*p);                                  // 再大一圈
  const spin = Math.abs(Math.sin(time*3 + ev.z));               // 自转：侧过去变窄
  const rx = Math.max(1.6, r*(0.35 + 0.65*spin));               // 留点厚度，不会完全消失
  ctx.save();
  ctx.shadowColor = 'rgba(255,205,0,.5)'; ctx.shadowBlur = Math.max(4, 8*p); // 金光辉光
  ctx.fillStyle = '#b3800a';                                    // 暗金外圈
  ctx.beginPath(); ctx.ellipse(x, y, rx, r, 0, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  const g = ctx.createRadialGradient(x - rx*0.35, y - r*0.4, r*0.1, x, y, r*0.95); // 上缘受光
  g.addColorStop(0, '#fff7c2'); g.addColorStop(.5, '#ffd54f'); g.addColorStop(1, '#ef9f0a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, y, rx*0.78, r*0.78, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(160,105,0,.6)'; ctx.lineWidth = Math.max(1, 1.6*p);   // 内圈压纹
  ctx.beginPath(); ctx.ellipse(x, y, rx*0.5, r*0.5, 0, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.9)';                       // 受光高光点
  ctx.beginPath(); ctx.ellipse(x - rx*0.32, y - r*0.4, Math.max(1.2, rx*0.18), Math.max(1, r*0.1), -.5, 0, 7); ctx.fill();
  ctx.restore();
}
function drawBoss(d){
  const p = persp(d), x = SX(0, p), y = SY(d);
  const bc = level.bossColor || '#8e24aa';
  const big = level.bossBig || 2.4;
  // 脚下红色警告圈：守门王的“领地”，人不够别硬闯
  ctx.fillStyle = 'rgba(229,57,53,.18)';
  ctx.beginPath(); ctx.ellipse(x, y, 74*p, 24*p, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(229,57,53,.7)'; ctx.lineWidth = Math.max(1.5, 3*p);
  ctx.beginPath(); ctx.ellipse(x, y, 74*p, 24*p, 0, 0, 7); ctx.stroke();
  const figH = 54 * Math.min(1.3, H/760);
  drawFigure(x, y, figH*p*big, 0, bc);                        // 每 8 关换色的守门王
  // 守门王血量牌：深色圆角胶囊（大、醒目）
  const bs = '👑' + level.boss, bh2 = Math.max(20, 42*p);
  const bw2 = bh2 + bs.length * 15*p;
  const by = y - figH*p*big - 34*p;
  ctx.fillStyle = bc;
  ctx.beginPath(); ctx.roundRect(x - bw2/2, by - bh2/2, bw2, bh2, bh2/2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(2, 3*p); ctx.stroke();
  bigText(bs, x, by + 1, Math.max(18, 30*p), '#fff');
}
function drawArena(){                       // 守门王的擂台：椭圆形台面 + 四角桩
  const zc = level.bossZ, d = zc - pz;
  if(d > VIEW + 30 || d < -100) return;
  const p = persp(d), y = SY(d), xc = SX(0, p);
  const rx = Math.max(10, 0.7 * W * 0.42 * p);        // 台面半宽 ≈ 路的 0.7
  const ry = rx * 0.15;
  ctx.fillStyle = 'rgba(0,0,0,.16)';                  // 抬起的影子
  ctx.beginPath(); ctx.ellipse(xc, y + ry*0.35, rx, ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(150,110,70,.38)';             // 木台面
  ctx.beginPath(); ctx.ellipse(xc, y, rx, ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = Math.max(1, 2*p);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(90,60,20,.5)';
  ctx.beginPath(); ctx.ellipse(xc, y, rx*0.7, ry*0.7, 0, 0, 7); ctx.stroke();
  // 四角矮桩（金顶）
  const hp = 40*p, wp = Math.max(2, 5*p);
  ctx.fillStyle = 'rgba(120,90,40,.95)';
  for(const [ax, ay] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    const px = xc + ax*rx, py = y + ay*ry;
    ctx.fillRect(px - wp/2, py - hp, wp, hp);
    ctx.fillStyle = 'rgba(255,205,90,.95)';
    ctx.beginPath(); ctx.arc(px, py - hp, wp*0.75, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(120,90,40,.95)';
  }
}
function drawStairs(){
  // 五级台阶一级级往上升：前立面(暗金)+受光台面，站上去越高级 × 倍数越大
  const T = level.stairT, R = 26, s0 = level.stairZ0;
  for(let j = 5; j >= 1; j--){                          // 远的先画，近的盖住下沿
    const st = level.stairs[j-1];
    const zF = s0 + (j-1)*T, zB = zF + T;
    const dF = zF - pz, dB = zB - pz;
    if(dF > VIEW + 20 || dB < -55) continue;
    const pF = persp(dF), pB = persp(dB);
    const hi = j*R, lo = (j-1)*R;                       // 台面/前立面底 的高程
    const x0F = SX(-0.99,pF), x1F = SX(0.99,pF);
    const x0B = SX(-0.99,pB), x1B = SX(0.99,pB);
    const y0F = SY(dF) - lo*pF, y1F = SY(dF) - hi*pF;   // 前立面 底/顶
    const y1B = SY(dB) - hi*pB;                         // 台面后沿（更高）
    // 前立面
    ctx.fillStyle = j%2 ? '#e0a00e' : '#d49300';
    ctx.beginPath();
    ctx.moveTo(x0F, y0F); ctx.lineTo(x0F, y1F);
    ctx.lineTo(x1F, y1F); ctx.lineTo(x1F, y0F);
    ctx.closePath(); ctx.fill();
    // 受光台面（向后收窄）
    ctx.fillStyle = j%2 ? '#ffe082' : '#ffd54f';
    ctx.beginPath();
    ctx.moveTo(x0F, y1F); ctx.lineTo(x1F, y1F);
    ctx.lineTo(x1B, y1B); ctx.lineTo(x0B, y1B);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(122,80,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
    // 台上的字：×倍数 + 要多少人（深色底托白字）
    numPlate('×' + st.mult + ' 需' + st.need + '人', (x0F+x1F)/2, (y1F+y0F)/2,
             Math.max(13, 34*pF), '#ffd54f');
    if(j === 5){                                           // 顶台插面小旗作标识
      ctx.font = Math.max(9, 28*pB) + 'px sans-serif';
      ctx.fillText('🏁', (x0B+x1B)/2, y1B - 10*pB);
    }
  }
}
function drawEnemy(ev, d){
  const p = persp(d), y = SY(d);
  const x = SX(ev.x, p);
  // 脚下红圈：踏进去就要打
  const rw = Math.max(6, (ev.r || 0.45) * W * 0.42 * p);
  ctx.fillStyle = 'rgba(229,57,53,.13)';
  ctx.beginPath(); ctx.ellipse(x, y, rw, rw*0.3, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(229,57,53,.6)'; ctx.lineWidth = Math.max(1, 2*p);
  ctx.beginPath(); ctx.ellipse(x, y, rw, rw*0.3, 0, 0, 7); ctx.stroke();
  const figH = 54 * Math.min(1.3, H/760);
  const show = Math.min(ev.n, 12);
  for(let i = show - 1; i >= 0; i--){
    const row = Math.floor(i / 4), col = i % 4;
    drawFigure(x + (col-1.5)*14*p*2, y - row*20*p - (col%2)*8*p, figH*p*0.9, i*1.3, '#b71c1c');
  }
  // 敌方人数牌：红底圆角胶囊白字（大、醒目）
  const es = String(ev.n), bh = Math.max(16, 24*p);
  const bw = Math.max(18, bh + es.length * 11*p);
  const by = y - figH*p - 34*p - 10;
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.roundRect(x - bw/2, by - bh/2, bw, bh, bh/2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '900 ' + Math.max(12, 20*p) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(es, x, by + 1);
}
function draw(){
  if(state === 'fight' && pz >= level.bossZ){ drawFight(); return; }  // 擂台战：居中特写
  const th = level.theme;
  // 天空与地面
  const g = ctx.createLinearGradient(0,0,0,H*0.55);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H*0.55);
  ctx.fillStyle = th.ground; ctx.fillRect(0, H*0.3, W, H*0.72);
  // 星空主题：天上撒星星
  if(th.deco === 'star'){
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for(let i=0;i<40;i++){
      const x = (i*97) % W, y = (i*53) % (H*0.28);
      ctx.fillRect(x, y, 2, 2);
    }
  }else{ // 太阳
    ctx.fillStyle = 'rgba(255,244,180,.95)';
    ctx.beginPath(); ctx.arc(W*0.82, H*0.09, 26, 0, 7); ctx.fill();
  }
  // 跑道
  const pF = persp(VIEW), yF = SY(VIEW), pN = persp(-30), yN = SY(-30);
  ctx.fillStyle = th.track;
  ctx.beginPath();
  ctx.moveTo(SX(-1.06,pF), yF); ctx.lineTo(SX(1.06,pF), yF);
  ctx.lineTo(SX(1.06,pN), yN); ctx.lineTo(SX(-1.06,pN), yN);
  ctx.closePath(); ctx.fill();
  // 横条纹（速度感）
  ctx.fillStyle = th.stripe;
  const base = Math.floor(pz/40)*40;
  for(let zz = base; zz < pz + VIEW; zz += 40){
    const d = zz - pz; if(d < -30) continue;
    const p = persp(d), y = SY(d), hh = Math.max(1, 8*p);
    ctx.fillRect(SX(-1.06,p), y - hh, SX(1.06,p) - SX(-1.06,p), hh);
  }
  // 中线虚线
  for(let zz = base; zz < pz + VIEW; zz += 40){
    const d = zz - pz + 20; if(d < -30) continue;
    const p = persp(d), y = SY(d);
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(SX(0,p) - 2*p, y - 14*p, 4*p, 14*p);
    ctx.fillStyle = th.stripe;
  }
  // 远处 → 近处绘制
  const items = [];
  for(const de of level.decos){ const d = de.z - pz; if(d > -30 && d < VIEW) items.push({d, de}); }
  for(const ev of level.events){ if(ev.done) continue; const d = ev.z - pz;
    if(d > -30 && d < VIEW) items.push({d, ev}); }
  items.sort((a,b) => b.d - a.d);
  drawStairs();
  drawArena();
  if(level.boss > 0){ const bd = level.bossZ - pz; if(bd > -30 && bd < VIEW) drawBoss(bd); }
  for(const it of items){
    if(it.de) drawDeco(it.de, it.d, th);
    else if(it.ev.kind === 'gate') drawGate(it.ev, it.d);
    else if(it.ev.kind === 'enemy') drawEnemy(it.ev, it.d);
    else if(it.ev.kind === 'coin') drawCoin(it.ev, it.d);
    else if(it.ev.kind === 'saw') drawSaw(it.ev, it.d);
    else if(it.ev.kind === 'pend') drawPend(it.ev, it.d);
    else if(it.ev.kind === 'pike') drawPike(it.ev, it.d);
    else drawObs(it.ev, it.d);
  }
  // 小人队伍：整团从屏幕底部往上铺，身体完整可见（单人高约屏高 6%）
  const show = Math.min(crowd, 80);
  const cColor = crowdColor();
  const h0 = Math.max(24, Math.round(H * 0.062));             // 前排小人身高 ≈ 屏高 6%
  let lift = 0;                                                // 终点登塔逐级抬升
  if(state === 'finish' && level.stairZ0 && pz > level.stairZ0){
    const k = Math.min(4, Math.floor((pz - level.stairZ0) / level.stairT));
    if(k >= 0) lift = (k + 1) * h0 * 0.4;
  }
  const baseY = H - 6;                                         // 最前那排的脚底（贴屏幕底但不被切）
  const halfW = Math.min(W * 0.15, 150);                       // 团半宽 ≈ 路宽 1/3
  const depth = Math.min(H * 0.15, h0 * 2.4);                  // 往后/往上堆多高
  const cx = SX(px, 1);
  const heTop = hatEmoji();                                     // 选中的帽子（没戴就是空）
  // 戴帽子的人数跟队伍一起涨：几十人时一小撮戴，几百上千人时一大片都戴
  const hatK = heTop ? Math.max(1, Math.min(show, Math.round(Math.sqrt(crowd) * 2.2))) : 0;
  for(let i = show - 1; i >= 0; i--){                          // 先画后排(上方)，前排最后画在最前
    const rr = Math.sqrt((i + 0.5) / show);                    // 中心→外圈铺满
    const aa = i * 2.399963 + ((i * 7919) % 13) * 0.002;       // 黄金角 + 抖动，乱一点像人群
    const fx = Math.cos(aa), fd = Math.abs(Math.sin(aa));      // 横向 / 远近
    const sc = 1 - 0.3 * (fd * rr);                            // 越往后越小
    const x = Math.max(24, Math.min(W - 24, cx + fx * rr * halfW * sc + (i % 7 - 3) * 3));
    const y = baseY - fd * rr * depth - lift;
    drawFigure(x, y, h0 * sc, i * 0.9, cColor);
    const he = (heTop && i < hatK) ? heTop : '';          // 戴帽子的人数随队伍涨
    if(he){
      ctx.font = '900 ' + Math.max(8, h0 * 0.5 * sc) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(he, x, y - (h0 * sc) * 0.98);
    }
  }
  // 人数牌：白底圆角胶囊，跟在小队上方（大、醒目）
  const bx = cx, by = baseY - depth - lift - 22;
  const tx = String(crowd), bw = Math.max(34, 20 + tx.length * 14), bh = 28;
  ctx.fillStyle = 'rgba(255,255,255,.96)';
  ctx.beginPath(); ctx.roundRect(bx - bw/2, by - bh/2, bw, bh, bh/2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#1a1a1a'; ctx.font = '900 21px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(tx, bx, by + 1);
  // 浮动反馈文字（大、带描边）
  for(const f of floats){
    ctx.globalAlpha = Math.max(0, 1 - f.age/1.3);
    bigText(f.txt, bx, by - 56 - f.age*80, 52, f.good ? '#2dd45f' : '#ff5252');
    ctx.globalAlpha = 1;
  }
  // 彩带
  for(const c of confetti){
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
    ctx.fillStyle = c.c; ctx.fillRect(-c.s/2, -c.s/4, c.s, c.s/2);
    ctx.restore();
  }
}

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
showMenu();
requestAnimationFrame(loop);
</script>
</body>
